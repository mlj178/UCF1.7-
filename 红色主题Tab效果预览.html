<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>设置窗口 · 红色主题 Tab 效果预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px;
    min-height: 100vh;
  }
  /* 设置窗口容器：500x650，置顶不可拉伸 */
  .settings-window {
    width: 500px;
    height: 650px;
    background: #2b0d0d;            /* Tab 背景：深红黑 */
    border: 1px solid #5a2020;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    resize: none;
  }
  /* Tab 栏：快捷键 / 关于 / 红色主题 */
  .tab-bar {
    display: flex;
    background: #1f0808;
    border-bottom: 1px solid #5a2020;
    height: 38px;
    flex-shrink: 0;
  }
  .tab-item {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cc9999;                 /* 非激活 Tab 文字 */
    font-size: 13px;
    cursor: pointer;
    border-right: 1px solid #3a1212;
    transition: background 0.15s;
    user-select: none;
  }
  .tab-item:last-child { border-right: none; }
  .tab-item:hover:not(.active) { background: #2b0d0d; }
  .tab-item.active {
    background: #2b0d0d;
    color: #ff3b3b;                 /* 激活高亮色 */
    border-bottom: 2px solid #ff3b3b;
    font-weight: bold;
  }
  /* Tab 内容区 */
  .tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .tab-content::-webkit-scrollbar { width: 8px; }
  .tab-content::-webkit-scrollbar-track { background: #2b0d0d; }
  .tab-content::-webkit-scrollbar-thumb { background: #5a2020; border-radius: 4px; }

  /* 区块卡片 */
  .block {
    background: #3a1212;            /* 区块卡片背景 */
    border: 1px solid #5a2020;
    border-radius: 4px;
    padding: 12px;
    display: flex;
    flex-direction: column;
  }
  .block-title {
    font-size: 12px;
    color: #cc9999;                 /* 说明文字 */
    margin-bottom: 8px;
  }
  /* 内容区：单独占一行（背景/圆角/居中通用） */
  .content-area {
    background: #1f0808;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* 图片显示区：等比缩放 + 居中，不裁剪不变形 */
  .image-area {
    width: 100%;
    height: 200px;
  }
  .image-area img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  /* 音频内容区：纵向排列 */
  .audio-area {
    width: 100%;
    padding: 10px;
    flex-direction: column;
    gap: 6px;
    min-height: 80px;
  }
  .audio-name {
    color: #ffcccc;                 /* 文字主色 */
    font-size: 14px;
  }
  .play-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: #8b0000;
    color: #ffcccc;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .play-btn:hover { background: #b00000; }
  .audio-hint { font-size: 11px; color: #888888; }
  /* 文字内容区 */
  .text-area {
    width: 100%;
    padding: 14px;
    min-height: 90px;
  }
  .text-content {
    color: #CC0000;                 /* 文字颜色（文档规定） */
    font-size: 14px;
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    line-height: 1.8;
    text-align: center;
  }
  /* 控制条：nav_button + position_label + nav_button 同一行 */
  .control-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
  }
  .nav-btn {
    width: 34px;
    height: 26px;
    border-radius: 4px;
    border: none;
    background: #8b0000;            /* 按钮（可用） */
    color: #ffcccc;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .nav-btn:hover:not(:disabled) { background: #b00000; }   /* hover */
  .nav-btn:disabled {
    background: #5a4a4a;            /* 按钮（置灰） */
    color: #888888;
    cursor: not-allowed;
  }
  /* 位置标签：X / N 格式，数字和斜杠之间各有一个空格 */
  .position-label {
    font-size: 12px;
    color: #ff6b6b;                 /* 位置标签色 */
    min-width: 50px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="settings-window">
  <!-- Tab 栏：快捷键 / 关于 / 红色主题 -->
  <div class="tab-bar">
    <div class="tab-item">快捷键</div>
    <div class="tab-item">关于</div>
    <div class="tab-item active">红色主题</div>
  </div>

  <!-- 红色主题 Tab 内容 -->
  <div class="tab-content">
    <!-- 1. 图片轮播区 -->
    <div class="block">
      <div class="block-title">图片轮播</div>
      <div class="content-area image-area">
        <img id="imgEl" src="" alt="红色图片">
      </div>
      <div class="control-bar">
        <button class="nav-btn" id="imgPrev">‹</button>
        <div class="position-label" id="imgPos">1 / 4</div>
        <button class="nav-btn" id="imgNext">›</button>
      </div>
    </div>

    <!-- 2. 音频播放区 -->
    <div class="block">
      <div class="block-title">音频播放</div>
      <div class="content-area audio-area">
        <div class="audio-name" id="audName">音效1.MP3</div>
        <button class="play-btn" id="playBtn">▶</button>
        <div class="audio-hint">音频文件待补充</div>
      </div>
      <div class="control-bar">
        <button class="nav-btn" id="audPrev">‹</button>
        <div class="position-label" id="audPos">1 / 3</div>
        <button class="nav-btn" id="audNext">›</button>
      </div>
    </div>

    <!-- 3. 文字展示区 -->
    <div class="block">
      <div class="block-title">文字展示</div>
      <div class="content-area text-area">
        <div class="text-content" id="txtEl"></div>
      </div>
      <div class="control-bar">
        <button class="nav-btn" id="txtPrev">‹</button>
        <div class="position-label" id="txtPos">1 / 3</div>
        <button class="nav-btn" id="txtNext">›</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 图片资源（真实文件，按 1.jpg→4.jpg 排序）
  const images = [
    'file:///D:/trae_project/ucf1.7-modifier/04-正式发行版/全功能整合包2.4/资源/红色图片/1.jpg',
    'file:///D:/trae_project/ucf1.7-modifier/04-正式发行版/全功能整合包2.4/资源/红色图片/2.jpg',
    'file:///D:/trae_project/ucf1.7-modifier/04-正式发行版/全功能整合包2.4/资源/红色图片/3.jpg',
    'file:///D:/trae_project/ucf1.7-modifier/04-正式发行版/全功能整合包2.4/资源/红色图片/4.jpg'
  ];
  // 音频资源（占位，文件待补充）
  const audios = ['音效1.MP3', '音效2.MP3', '音效3.MP3'];
  // 文字资源（占位，文件待补充）
  const texts = [
    '星火燎原，初心不改。',
    '传承精神，砥砺前行。',
    '铭记历史，开创未来。'
  ];

  /* —— 图片轮播 —— */
  let imgIdx = 0;
  const imgEl = document.getElementById('imgEl');
  const imgPos = document.getElementById('imgPos');
  const imgPrev = document.getElementById('imgPrev');
  const imgNext = document.getElementById('imgNext');
  function renderImg() {
    imgEl.src = images[imgIdx];
    imgPos.textContent = `${imgIdx + 1} / ${images.length}`;   // X / N 格式
    imgPrev.disabled = imgIdx === 0;                           // 第一张左按钮置灰
    imgNext.disabled = imgIdx === images.length - 1;           // 最后一张右按钮置灰
  }
  imgPrev.onclick = () => { if (imgIdx > 0) { imgIdx--; renderImg(); } };
  imgNext.onclick = () => { if (imgIdx < images.length - 1) { imgIdx++; renderImg(); } };
  renderImg();

  /* —— 音频播放 —— */
  let audIdx = 0;
  let playing = false;
  const audName = document.getElementById('audName');
  const audPos = document.getElementById('audPos');
  const audPrev = document.getElementById('audPrev');
  const audNext = document.getElementById('audNext');
  const playBtn = document.getElementById('playBtn');
  function renderAud() {
    audName.textContent = audios[audIdx];
    audPos.textContent = `${audIdx + 1} / ${audios.length}`;
    audPrev.disabled = audIdx === 0;
    audNext.disabled = audIdx === audios.length - 1;
    // 切换音频时自动停止当前播放
    playing = false;
    playBtn.textContent = '▶';
  }
  audPrev.onclick = () => { if (audIdx > 0) { audIdx--; renderAud(); } };
  audNext.onclick = () => { if (audIdx < audios.length - 1) { audIdx++; renderAud(); } };
  playBtn.onclick = () => {
    playing = !playing;
    playBtn.textContent = playing ? '⏸' : '▶';
  };
  renderAud();

  /* —— 文字展示 —— */
  let txtIdx = 0;
  const txtEl = document.getElementById('txtEl');
  const txtPos = document.getElementById('txtPos');
  const txtPrev = document.getElementById('txtPrev');
  const txtNext = document.getElementById('txtNext');
  function renderTxt() {
    txtEl.textContent = texts[txtIdx];
    txtPos.textContent = `${txtIdx + 1} / ${texts.length}`;
    txtPrev.disabled = txtIdx === 0;
    txtNext.disabled = txtIdx === texts.length - 1;
  }
  txtPrev.onclick = () => { if (txtIdx > 0) { txtIdx--; renderTxt(); } };
  txtNext.onclick = () => { if (txtIdx < texts.length - 1) { txtIdx++; renderTxt(); } };
  renderTxt();
</script>
</body>
</html>
