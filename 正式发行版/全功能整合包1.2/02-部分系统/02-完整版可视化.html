<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF射击游戏 - 核心类结构可视化（完整版）</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel-bg: #16213e;
            --text: #e0e0e0;
            --text-secondary: #a0a0b8;
            --accent: #e94560;
            --border: #2a2a4a;
            --player: #e94560;
            --weapon: #f39c12;
            --buff: #8e44ad;
            --ai: #3498db;
            --manager: #2ecc71;
            --map: #1abc9c;
            --inherit-line: #f1c40f;
            --ref-line: #5dade2;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            overflow: hidden;
            height: 100vh; width: 100vw;
            display: flex;
            user-select: none; -webkit-user-select: none;
        }
        #main-container { display: flex; width: 100%; height: 100%; position: relative; }
        #svg-container {
            flex: 1; position: relative; cursor: grab; min-width: 0;
        }
        #svg-container:active { cursor: grabbing; }
        #svg-container.panning { cursor: grabbing; }
        svg { width: 100%; height: 100%; display: block; }
        #search-box {
            position: absolute; top: 16px; left: 16px; z-index: 10;
            display: flex; align-items: center; gap: 8px;
        }
        #search-input {
            padding: 10px 16px; border-radius: 24px;
            border: 2px solid var(--border); background: var(--panel-bg);
            color: var(--text); font-size: 14px; width: 260px; outline: none;
        }
        #search-input:focus { border-color: var(--accent); }
        #search-input::placeholder { color: #666; }
        #search-clear {
            padding: 8px 14px; border-radius: 20px;
            border: 1px solid var(--border); background: var(--panel-bg);
            color: var(--text-secondary); cursor: pointer; font-size: 13px;
        }
        #search-clear:hover { background: #252545; color: #fff; }
        #reset-btn {
            padding: 8px 14px; border-radius: 20px;
            border: 1px solid var(--border); background: var(--panel-bg);
            color: var(--text-secondary); cursor: pointer; font-size: 13px;
        }
        #reset-btn:hover { background: #e94560; color: #fff; border-color: #e94560; }
        #legend {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            background: var(--panel-bg); border-radius: 12px; padding: 14px 18px;
            border: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px;
            font-size: 12px; color: var(--text-secondary);
        }
        #legend .legend-item { display: flex; align-items: center; gap: 10px; }
        #legend .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        #legend .legend-line { width: 24px; height: 0; flex-shrink: 0; }
        #detail-panel {
            width: 380px; min-width: 380px; background: var(--panel-bg);
            border-left: 2px solid var(--border); padding: 20px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
            z-index: 5; height: 100vh; color: var(--text);
        }
        #detail-panel h3 { font-size: 18px; color: #fff; margin-bottom: 4px; word-break: break-all; }
        .detail-section {
            background: #1a1a35; border-radius: 8px; padding: 12px;
            border: 1px solid var(--border);
        }
        .detail-section h4 { font-size: 13px; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }
        .detail-item {
            font-size: 12px; color: var(--text-secondary); padding: 3px 0; word-break: break-all; line-height: 1.5;
        }
        .detail-item .en { color: #c0c0d0; font-family: 'Consolas','Monaco','Courier New',monospace; }
        .detail-item .cn { color: #8888a8; font-size: 11px; margin-left: 4px; }
        #detail-placeholder { color: #555; text-align: center; margin-top: 60px; font-size: 14px; }
        .tooltip-box {
            position: absolute; pointer-events: none; background: #1e1e38;
            border: 1px solid #444; border-radius: 8px; padding: 10px 14px;
            font-size: 12px; color: #ddd; z-index: 20; max-width: 320px;
            line-height: 1.6; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            opacity: 0; transition: opacity 0.15s;
        }
        .tooltip-box.visible { opacity: 1; }
    </style>
</head>
<body>
<div id="main-container">
    <div id="svg-container">
        <div id="search-box">
            <input type="text" id="search-input" placeholder="搜索类名、字段、方法...">
            <button id="search-clear">清除</button>
            <button id="reset-btn">重置布局</button>
        </div>
        <div id="legend">
            <div class="legend-item"><span class="legend-dot" style="background:var(--player)"></span> 玩家与角色</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--weapon)"></span> 武器与战斗</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--buff)"></span> 增益与技能</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--ai)"></span> AI系统</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--manager)"></span> 游戏管理</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--map)"></span> 地图相关</div>
            <div class="legend-item"><span class="legend-line" style="border-top:3px solid var(--inherit-line)"></span> 继承关系</div>
            <div class="legend-item"><span class="legend-line" style="border-top:1.5px dashed var(--ref-line)"></span> 字段引用</div>
        </div>
        <div class="tooltip-box" id="tooltip"></div>
        <svg id="main-svg"></svg>
    </div>
    <div id="detail-panel">
        <div id="detail-placeholder">👈 点击左侧类节点查看详情</div>
    </div>
</div>

    const relationDescriptions = {
        "Player-Entity":"Player 继承 Entity",
        "Entity-MonoBehaviour":"Entity 继承 MonoBehaviour",
        "Player->cameraManager":"Player 持有 PlayerCameraManager",
        "Player->recoil":"Player 持有 Recoil",
        "Player->skills":"Player 持有 PlayerSkills",
        "Entity->buffs":"Entity 持有 Buff 列表",
        "PlayerWeapons->all":"PlayerWeapons 持有 Weapon 列表",
        "PlayerWeapons->inUse":"PlayerWeapons 引用当前 Weapon",
        "Weapon->data":"Weapon 引用 WeaponData",
        "Weapon->bindMapTrigger":"Weapon 绑定 MapGun",
        "WPN_Gun->realData":"WPN_Gun 引用 WeaponData_Gun",
        "WPN_Gun-Weapon":"WPN_Gun 继承 Weapon",
        "WPN_GRENADE-WPN_Missile":"WPN_GRENADE 继承 WPN_Missile",
        "DamageEventData->attacker":"DamageEventData 引用攻击者 Entity",
        "DamageEventData->victim":"DamageEventData 引用受害者 Entity",
        "DeathEventData->killer":"DeathEventData 引用击杀者 Entity",
        "DeathEventData->dead":"DeathEventData 引用死者 Entity",
        "WeaponData_Gun->damageBodyRatio":"WeaponData_Gun 引用 DamageBodyRatio",
        "Bot->ability":"Bot 持有 BotAbility",
        "Bot->enemyInfo":"Bot 持有 BotEnemyInfo",
        "BotEnemyInfo->enemy":"BotEnemyInfo 引用敌人 Entity",
        "GameManager->myPlayer":"GameManager 引用主 Player",
        "MapManager->SP_BL":"MapManager 持有 SpawnPoint 数组",
        "MapGun->occupier":"MapGun 引用占用 Player",
        "MapGun->weapon":"MapGun 引用 Weapon",
        "SpeedBuff-Buff":"SpeedBuff 继承 Buff",
        "DamageRateBuff-Buff":"DamageRateBuff 继承 Buff",
        "InvincibleBuff-Buff":"InvincibleBuff 继承 Buff",
        "StunGrenadeBuff-SpeedBuff":"StunGrenadeBuff 继承 SpeedBuff",
        "TransparentBuff-Buff":"TransparentBuff 继承 Buff",
        "InfinityAmmoBuff-Buff":"InfinityAmmoBuff 继承 Buff",
        "Skill_Common-Skill":"Skill_Common 继承 Skill",
        "BotSkillBase-BotActionBase":"BotSkillBase 继承 BotActionBase",
        "Recoil-OffsetModifier":"Recoil 继承 OffsetModifier",
        "WeaponData_Gun-WeaponData":"WeaponData_Gun 继承 WeaponData",
        "PlayerCameraManager-MonoBehaviour":"PlayerCameraManager 继承 MonoBehaviour",
        "Bot-MonoBehaviour":"Bot 继承 MonoBehaviour",
        "MapGun-MapTrigger":"MapGun 继承 MapTrigger",
        "SupplyBox-RecyclableObject":"SupplyBox 继承 RecyclableObject",
        "WPN_Knife-Weapon":"WPN_Knife 继承 Weapon",
        "Weapon-CFAnimator":"Weapon 继承 CFAnimator"
    };

    const moduleOrder = ["player","weapon","buff","ai","manager","map"];
    const moduleColors = { player:"#e94560", weapon:"#f39c12", buff:"#8e44ad", ai:"#3498db", manager:"#2ecc71", map:"#1abc9c" };
    const moduleNamesCN = { player:"玩家与角色", weapon:"武器与战斗", buff:"增益与技能", ai:"AI系统", manager:"游戏管理", map:"地图相关" };

    const classMap = {};
    classDefinitions.forEach(c => classMap[c.id]=c);
    const allClassIds = classDefinitions.map(c=>c.id);

    function getDepth(cls){
        let d=0, cur=cls;
        while(cur.parent && classMap[cur.parent]){ d++; cur=classMap[cur.parent]; if(d>20) break; }
        return d;
    }
    classDefinitions.forEach(c=>c._depth=getDepth(c));

    const modulesMap = {};
    moduleOrder.forEach(m=>modulesMap[m]=[]);
    classDefinitions.forEach(c=>{
        if(modulesMap[c.module]) modulesMap[c.module].push(c);
        else { modulesMap[c.module]=[c]; if(!moduleOrder.includes(c.module)) moduleOrder.push(c.module); }
    });
    moduleOrder.forEach(m=>{ if(modulesMap[m]) modulesMap[m].sort((a,b)=>a._depth-b._depth||a.id.localeCompare(b.id)); });

    const moduleXSpacing = 340;
    const depthXSpacing = 55;
    const moduleYSpacing = 36;
    const classNodeWidth = 230;
    const classNodeHeight = 55;
    const svgPadding = 80;

    let classPositions = {};
    let currentY = {};
    moduleOrder.forEach(m=>currentY[m]=svgPadding+60);
    moduleOrder.forEach(m=>{
        const classes = modulesMap[m]||[];
        const baseX = svgPadding + moduleOrder.indexOf(m)*moduleXSpacing;
        classes.forEach(cls=>{
            const x = baseX + cls._depth*depthXSpacing;
            const y = currentY[m];
            classPositions[cls.id] = {x,y,module:m,depth:cls._depth};
            currentY[m] += classNodeHeight + moduleYSpacing;
        });
    });

    // ========== 位置记忆功能 ==========
    const STORAGE_KEY = 'cf_game_layout_positions';
    
    function loadSavedPositions() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const positions = JSON.parse(saved);
                // 只恢复存在的类
                Object.keys(positions).forEach(clsId => {
                    if (classPositions[clsId]) {
                        classPositions[clsId].x = positions[clsId].x;
                        classPositions[clsId].y = positions[clsId].y;
                    }
                });
                console.log('已加载保存的布局位置');
            }
        } catch (e) {
            console.warn('加载布局失败:', e);
        }
    }
    
    function savePositions() {
        try {
            const positionsToSave = {};
            Object.keys(classPositions).forEach(clsId => {
                positionsToSave[clsId] = {
                    x: classPositions[clsId].x,
                    y: classPositions[clsId].y
                };
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(positionsToSave));
        } catch (e) {
            console.warn('保存布局失败:', e);
        }
    }
    
    function resetPositions() {
        localStorage.removeItem(STORAGE_KEY);
        // 重新计算初始位置
        currentY = {};
        moduleOrder.forEach(m=>currentY[m]=svgPadding+60);
        moduleOrder.forEach(m=>{
            const classes = modulesMap[m]||[];
            const baseX = svgPadding + moduleOrder.indexOf(m)*moduleXSpacing;
            classes.forEach(cls=>{
                classPositions[cls.id].x = baseX + cls._depth*depthXSpacing;
                classPositions[cls.id].y = currentY[m];
                currentY[m] += classNodeHeight + moduleYSpacing;
            });
        });
        // 更新所有节点位置
        nodesGroup.selectAll("g.class-node")
            .attr("transform", d => `translate(${classPositions[d.id].x},${classPositions[d.id].y})`);
        // 重新绘制所有连线
        drawAllLinks();
        // 更新字段节点
        updateFieldNodes();
        drawFieldNodes();
        console.log('布局已重置');
    }
    
    // 加载保存的位置
    loadSavedPositions();

    let fieldNodesData = [];
    let expandedClasses = {};
    let classToFieldNodes = {};

    function buildFieldNodes(clsId){
        const cls = classMap[clsId];
        if(!cls||!cls.fields||cls.fields.length===0) return [];
        const pos = classPositions[clsId];
        if(!pos) return [];
        const nodes = [];
        const startY = pos.y + classNodeHeight + 8;
        cls.fields.forEach((f,i)=>{
            nodes.push({
                id: clsId+"_field_"+i,
                classId: clsId,
                fieldIndex: i,
                fieldText: f,
                x: pos.x + classNodeWidth/2,
                y: startY + i*22 + 11,
                r: 6,
                module: pos.module
            });
        });
        return nodes;
    }

    function updateFieldNodes(){
        fieldNodesData = [];
        classToFieldNodes = {};
        Object.keys(expandedClasses).forEach(clsId=>{
            if(expandedClasses[clsId]){
                const fnodes = buildFieldNodes(clsId);
                classToFieldNodes[clsId] = fnodes;
                fieldNodesData = fieldNodesData.concat(fnodes);
            }
        });
    }
    updateFieldNodes();

    const svg = d3.select("#main-svg");
    const totalWidth = 4200, totalHeight = 3000;
    svg.attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`);

    const defs = svg.append("defs");
    defs.append("marker").attr("id","arrow-inherit").attr("viewBox","0 0 14 14").attr("refX",13).attr("refY",7).attr("markerWidth",10).attr("markerHeight",10).attr("orient","auto").append("polygon").attr("points","0,0 14,7 0,14").attr("fill","#f1c40f");
    defs.append("marker").attr("id","arrow-ref").attr("viewBox","0 0 10 10").attr("refX",9).attr("refY",5).attr("markerWidth",7).attr("markerHeight",7).attr("orient","auto").append("polygon").attr("points","0,0 10,5 0,10").attr("fill","#5dade2");

    const mainGroup = svg.append("g").attr("id","main-group");
    const linksGroup = mainGroup.append("g").attr("id","links-group");
    const nodesGroup = mainGroup.append("g").attr("id","nodes-group");
    const fieldNodesGroup = mainGroup.append("g").attr("id","field-nodes-group");

    const inheritLinks = [];
    const refLinks = [];
    classDefinitions.forEach(cls=>{
        if(cls.parent && allClassIds.includes(cls.parent) && classMap[cls.parent]){
            inheritLinks.push({source:cls.parent, target:cls.id, type:"inherit"});
        }
    });
    classDefinitions.forEach(cls=>{
        if(cls.fields){
            cls.fields.forEach(f=>{
                const typeMatch = f.match(/:?\s*([A-Z][a-zA-Z0-9_<>\[\]\.]*)/);
                if(!typeMatch) return;
                let typeName = typeMatch[1].replace(/[<>\[\]]/g,'').split('.').pop();
                if(typeName==='List'){ const lm = f.match(/List<([A-Z][a-zA-Z0-9_]*)>/); if(lm) typeName=lm[1]; }
                if(['Action','Func','RefBool','RefInt','Ref2Float','PropertyModifier','ObscuredBool','ObscuredInt','Vector2','Vector3','Vector2Int','Transform','Collider','Ray','GameObject','Coroutine','Sprite','Texture2D','ParticleSystem','Animator','CharacterController','CinemachineVirtualCamera','Camera','BoxCollider','Seeker','IEnumerator','KeyInputState','bool','int','float','string','Quaternion','QVModel'].includes(typeName)) return;
                if(allClassIds.includes(typeName) && typeName!==cls.id){
                    const exists = refLinks.find(r=>r.source===cls.id && r.target===typeName);
                    if(!exists) refLinks.push({source:cls.id, target:typeName, type:"ref", fieldName: f.split('(')[0].trim()});
                }
            });
        }
    });

    function drawAllLinks(){
        linksGroup.selectAll("*").remove();
        inheritLinks.forEach(link=>{
            const sp = classPositions[link.source], tp = classPositions[link.target];
            if(!sp||!tp) return;
            const sx = sp.x+classNodeWidth/2, sy = sp.y+classNodeHeight;
            const tx = tp.x+classNodeWidth/2, ty = tp.y;
            const midY = (sy+ty)/2;
            linksGroup.append("path").attr("d",`M${sx},${sy} C${sx},${midY} ${tx},${midY} ${tx},${ty}`).attr("fill","none").attr("stroke","#f1c40f").attr("stroke-width",3).attr("marker-end","url(#arrow-inherit)").attr("class","link inherit-link").attr("data-source",link.source).attr("data-target",link.target);
        });
        refLinks.forEach(link=>{
            const sp = classPositions[link.source], tp = classPositions[link.target];
            if(!sp||!tp) return;
            const sx = sp.x+classNodeWidth, sy = sp.y+classNodeHeight/2;
            const tx = tp.x, ty = tp.y+classNodeHeight/2;
            const midX = (sx+tx)/2;
            linksGroup.append("path").attr("d",`M${sx},${sy} C${midX},${sy} ${midX},${ty} ${tx},${ty}`).attr("fill","none").attr("stroke","#5dade2").attr("stroke-width",1.5).attr("stroke-dasharray","6,3").attr("class","link ref-link").attr("data-source",link.source).attr("data-target",link.target);
            linksGroup.append("text").attr("x",midX).attr("y",(sy+ty)/2-6).attr("text-anchor","middle").attr("font-size","10").attr("fill","#88ccff").attr("class","link ref-label").attr("data-source",link.source).attr("data-target",link.target).text(link.fieldName||"");
        });
    }
    drawAllLinks();

    const classNodeG = nodesGroup.selectAll("g.class-node").data(classDefinitions).enter().append("g")
        .attr("class","class-node")
        .attr("data-id",d=>d.id)
        .attr("transform",d=>`translate(${classPositions[d.id].x},${classPositions[d.id].y})`)
        .style("cursor","pointer")
        .on("dblclick",function(event,d){
            event.stopPropagation();
            if(expandedClasses[d.id]) expandedClasses[d.id]=false; else expandedClasses[d.id]=true;
            updateFieldNodes();
            drawFieldNodes();
        })
        .on("click",function(event,d){ event.stopPropagation(); showDetailPanel(d); })
        .on("mouseenter",function(event,d){ showTooltip(event,d); })
        .on("mouseleave",hideTooltip)
        .call(d3.drag()
            .on("start",function(event,d){
                d3.select(this).raise().style("cursor","grabbing");
            })
            .on("drag",function(event,d){
                const pos = classPositions[d.id];
                pos.x += event.dx;
                pos.y += event.dy;
                d3.select(this).attr("transform",`translate(${pos.x},${pos.y})`);
                updateLinksForClass(d.id);
                if(expandedClasses[d.id]){
                    updateFieldNodes();
                    drawFieldNodes();
                }
            })
            .on("end",function(event,d){
                d3.select(this).style("cursor","pointer");
                savePositions();
            })
        );

    classNodeG.each(function(d){
        const g = d3.select(this);
        const color = moduleColors[d.module]||"#888";
        g.append("rect").attr("width",classNodeWidth).attr("height",classNodeHeight).attr("rx",12).attr("ry",12).attr("fill",color).attr("stroke","#fff").attr("stroke-width",1.5).attr("opacity",0.9);
        g.append("text").attr("x",classNodeWidth/2).attr("y",22).attr("text-anchor","middle").attr("fill","#fff").attr("font-size","14").attr("font-weight","bold").text(d.id);
        g.append("text").attr("x",classNodeWidth/2).attr("y",42).attr("text-anchor","middle").attr("fill","#ffeebb").attr("font-size","11").text(d.nameCN||"");
        const fCount = d.fields?d.fields.length:0;
        const mCount = d.methods?d.methods.length:0;
        g.append("text").attr("x",classNodeWidth-10).attr("y",13).attr("text-anchor","end").attr("fill","#ffffffcc").attr("font-size","9").text(`${fCount}字段 ${mCount}方法`);
    });

    function updateLinksForClass(clsId){
        linksGroup.selectAll(".link").each(function(){
            const el = d3.select(this);
            const src = el.attr("data-source"), tgt = el.attr("data-target");
            if(src===clsId || tgt===clsId){
                if(el.classed("inherit-link")){
                    const sp = classPositions[src], tp = classPositions[tgt];
                    if(sp&&tp){
                        const sx = sp.x+classNodeWidth/2, sy = sp.y+classNodeHeight;
                        const tx = tp.x+classNodeWidth/2, ty = tp.y;
                        const midY = (sy+ty)/2;
                        el.attr("d",`M${sx},${sy} C${sx},${midY} ${tx},${midY} ${tx},${ty}`);
                    }
                }else if(el.classed("ref-link")){
                    const sp = classPositions[src], tp = classPositions[tgt];
                    if(sp&&tp){
                        const sx = sp.x+classNodeWidth, sy = sp.y+classNodeHeight/2;
                        const tx = tp.x, ty = tp.y+classNodeHeight/2;
                        const midX = (sx+tx)/2;
                        el.attr("d",`M${sx},${sy} C${midX},${sy} ${midX},${ty} ${tx},${ty}`);
                    }
                }
            }
        });
        linksGroup.selectAll(".ref-label").each(function(){
            const el = d3.select(this);
            const src = el.attr("data-source"), tgt = el.attr("data-target");
            if(src===clsId || tgt===clsId){
                const sp = classPositions[src], tp = classPositions[tgt];
                if(sp&&tp){
                    const sx = sp.x+classNodeWidth, sy = sp.y+classNodeHeight/2;
                    const tx = tp.x, ty = tp.y+classNodeHeight/2;
                    el.attr("x",(sx+tx)/2).attr("y",(sy+ty)/2-6);
                }
            }
        });
    }

    function drawFieldNodes(){
        fieldNodesGroup.selectAll("*").remove();
        const fg = fieldNodesGroup.selectAll("g.field-node").data(fieldNodesData).enter().append("g")
            .attr("class","field-node")
            .attr("data-class-id",d=>d.classId)
            .attr("transform",d=>`translate(${d.x},${d.y})`);
        fg.append("circle").attr("r",d=>d.r).attr("fill",d=>moduleColors[d.module]||"#888").attr("stroke","#fff").attr("stroke-width",1);
        fg.append("text").attr("x",12).attr("y",4).attr("fill","#ddd").attr("font-size","10").text(d=>d.fieldText.length>45?d.fieldText.substring(0,42)+'...':d.fieldText);
        fg.append("title").text(d=>d.fieldText);
    }
    drawFieldNodes();

    let zoomTransform = d3.zoomIdentity;
    const zoomBehavior = d3.zoom().scaleExtent([0.2,3]).on("zoom",(event)=>{
        zoomTransform = event.transform;
        mainGroup.attr("transform", zoomTransform);
    });
    svg.call(zoomBehavior);
    svg.on("dblclick.zoom",null);

    const container = document.getElementById("svg-container");
    let isPanning = false, panStart = {x:0,y:0};
    container.addEventListener("mousedown",function(e){
        if(e.target===svg.node()||e.target===container||e.target.classList.contains('svg-bg')){
            isPanning=true; panStart={x:e.clientX,y:e.clientY}; container.classList.add("panning");
        }
    });
    window.addEventListener("mousemove",function(e){
        if(isPanning){
            const dx=e.clientX-panStart.x, dy=e.clientY-panStart.y;
            panStart={x:e.clientX,y:e.clientY};
            zoomTransform = d3.zoomIdentity.translate(zoomTransform.x+dx, zoomTransform.y+dy).scale(zoomTransform.k);
            mainGroup.attr("transform", zoomTransform);
        }
    });
    window.addEventListener("mouseup",function(){
        if(isPanning){ isPanning=false; container.classList.remove("panning"); }
    });

    const tooltipDiv = document.getElementById("tooltip");
    function showTooltip(event,d){
        const rels=[];
        Object.keys(relationDescriptions).forEach(key=>{
            if(key.startsWith(d.id+'-')||key.startsWith(d.id+'->')||key.includes('-'+d.id)||key.includes('->'+d.id)) rels.push(relationDescriptions[key]);
        });
        if(d.parent&&classMap[d.parent]) rels.push(`继承自: ${d.parent}`);
        const children = classDefinitions.filter(c=>c.parent===d.id);
        if(children.length) rels.push(`子类: ${children.map(c=>c.id).join(', ')}`);
        refLinks.filter(r=>r.source===d.id).forEach(r=>rels.push(`引用→ ${r.target}: ${r.fieldName}`));
        refLinks.filter(r=>r.target===d.id).forEach(r=>rels.push(`被引用← ${r.source}: ${r.fieldName}`));
        if(!rels.length) rels.push("暂无特殊关联");
        tooltipDiv.innerHTML = `<strong>${d.id}</strong> (${d.nameCN||''})<br><br>${rels.join('<br>')}`;
        tooltipDiv.classList.add("visible");
        tooltipDiv.style.left = (event.clientX+20)+'px';
        tooltipDiv.style.top = (event.clientY-20)+'px';
    }
    function hideTooltip(){ tooltipDiv.classList.remove("visible"); }

    function showDetailPanel(d){
        const panel = document.getElementById("detail-panel");
        let html = `<h3>${d.id} <span style="color:#aaa;font-size:14px;">(${d.nameCN||''})</span></h3>`;
        html += `<div class="detail-section"><h4>基本信息</h4><div class="detail-item">模块: ${moduleNamesCN[d.module]||d.module}</div>`;
        html += `<div class="detail-item">继承: ${d.parent||'无'}</div>`;
        const children = classDefinitions.filter(c=>c.parent===d.id);
        if(children.length) html += `<div class="detail-item">子类: ${children.map(c=>c.id).join(', ')}</div>`;
        html += `</div>`;
        if(d.fields&&d.fields.length){
            html += `<div class="detail-section"><h4>字段 (${d.fields.length})</h4>`;
            d.fields.forEach(f=>html+=`<div class="detail-item"><span class="en">${f}</span></div>`);
            html += `</div>`;
        }
        if(d.methods&&d.methods.length){
            html += `<div class="detail-section"><h4>方法 (${d.methods.length})</h4>`;
            d.methods.forEach(m=>html+=`<div class="detail-item"><span class="en">${m}</span></div>`);
            html += `</div>`;
        }
        panel.innerHTML = html;
    }

    let searchTerm = "";
    document.getElementById("search-input").addEventListener("input",function(){
        searchTerm = this.value.trim().toLowerCase();
        applySearchHighlight();
    });
    document.getElementById("search-clear").addEventListener("click",function(){
        document.getElementById("search-input").value="";
        searchTerm="";
        applySearchHighlight();
    });
    document.getElementById("reset-btn").addEventListener("click",function(){
        if(confirm('确定要重置布局吗？这将清除所有保存的位置。')){
            resetPositions();
        }
    });

    function applySearchHighlight(){
        if(!searchTerm){
            nodesGroup.selectAll(".class-node").style("opacity",1);
            fieldNodesGroup.selectAll(".field-node").style("opacity",0.85);
            linksGroup.selectAll(".link").style("opacity",1);
            linksGroup.selectAll(".ref-label").style("opacity",1);
            return;
        }
        const matched = new Set();
        classDefinitions.forEach(c=>{
            const str = (c.id+' '+c.nameCN+' '+ (c.fields||[]).join(' ')+' '+ (c.methods||[]).join(' ')).toLowerCase();
            if(str.includes(searchTerm)) matched.add(c.id);
        });
        fieldNodesData.forEach(fn=>{ if(fn.fieldText.toLowerCase().includes(searchTerm)) matched.add(fn.classId); });
        nodesGroup.selectAll(".class-node").style("opacity",d=>matched.has(d.id)?1:0.2);
        fieldNodesGroup.selectAll(".field-node").style("opacity",d=>matched.has(d.classId)?0.85:0.1);
        linksGroup.selectAll(".link").style("opacity",function(){
            const s=this.getAttribute("data-source"), t=this.getAttribute("data-target");
            return (matched.has(s)||matched.has(t))?1:0.1;
        });
        linksGroup.selectAll(".ref-label").style("opacity",function(){
            const s=this.getAttribute("data-source"), t=this.getAttribute("data-target");
            return (matched.has(s)||matched.has(t))?1:0.08;
        });
    }

    console.log(`完整版可视化已加载: ${classDefinitions.length} 个类, ${inheritLinks.length} 条继承, ${refLinks.length} 条引用`);
})();
</script>
</body>
</html>
