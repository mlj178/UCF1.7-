</style></head><body><header class="top"><h1>13 · 射速变快+连狙代码解读</h1><div class="tabs" id="tabs"></div><div class="actions"><a href="../index.html">功能目录</a><button id="copy">复制源码</button></div></header><section class="summary"><strong>解决的问题：</strong>针对普通枪、半自动狙击、榴弹枪和RPG分别清除射击间隔/半自动状态，并提高武器动画倍率；同时处理后坐力状态，使连狙和高射速保持连续。</section><div class="workspace"><main class="code"><div class="code-head"><span class="file" id="file"></span><span class="count" id="count"></span><div class="source-meta" id="meta"></div><div class="legend"><span class="legend-item"><span class="swatch address"></span>蓝：定位地址</span><span class="legend-item"><span class="swatch hook"></span>红：安装或恢复 Hook</span><span class="legend-item"><span class="swatch effect"></span>绿：改变游戏行为</span><span class="legend-item"><span class="swatch risk"></span>橙：风险或副作用</span></div></div><nav class="section-strip"><span class="section-strip-title">完整代码导航</span><div class="section-tabs" id="sectionTabs"></div></nav><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><div class="toast" id="toast"></div><script type="text/plain" id="src-release">// speed_gun.js - 射速变快 + 连狙 — 终极武器修改
// 10个Hook点：动画加速10x + 清除射击间隔 + 半自动→全自动 + 狙击镜不关闭 + RPG特殊处理 + 后坐力清零 + 扩散归零

modules.speedgun = (function() {
  var enabled = false;
  var hooks = [];
  var isMyWeaponFn = null;
  var getCharAnim = null;
  var setAnimSpeed = null;
  var rpgAnimSpeedFn = null;
  var grenadeAnimSpeedFn = null;
  var classGetNameFn = null;
  var isPlayerShooting = false;
  var pendingWeaponSpeedTasks = [];
  var pendingWeaponSpeedMaxFrames = 300; // 增加到300帧，给特殊武器更多初始化时间
  var modeBaseInstance = null;
  var modeSwitchGraceUntil = 0;
  var modeSwitchGraceMs = 800;
  var roomShuttingDown = false;
  var exitingModeBaseInstance = null;
  var SPEED_RVA = {
    GameManager_TypeInfo: 0x0E2933C
  };
  var SPEED_OFF = {
    Klass_staticFields: 0x5C,
    GM_myPlayer: 0x00,
    Player_wpns: 0xA0
  };

  function safeReadPointer(basePtr, offset) {
    try {
      if (!basePtr || basePtr.isNull()) return null;
      var value = basePtr.add(offset).readPointer();
      return (value && !value.isNull()) ? value : null;
    } catch(e) {
      return null;
    }
  }

  function applyGunDataSpeed(weapon) {
    try {
      if (roomShuttingDown) return false;
      var data = safeReadPointer(weapon, 0x68);
      var realData = safeReadPointer(weapon, 0xEC);
      if (data && realData && data.equals(realData)) {
        realData.add(0xD0).writeFloat(10.0); // WeaponData_Gun.fireAnimMultiplier
        weapon.add(0xF0).writeU8(0); // WPN_Gun.isSemiGun
        weapon.add(0x108).writeS32(0); // WPN_Gun.semiGunFireLinkState
        weapon.add(0x110).writeFloat(0.0); // WPN_Gun.nextAllowedShootTime
        return true;
      }
    } catch(e) {}
    return false;
  }

  function applyGrenadeGunSpeed(weapon) {
    try {
      if (roomShuttingDown) return false;
      var data = safeReadPointer(weapon, 0x68);
      var realData = safeReadPointer(weapon, 0xEC);
      if (data && realData && data.equals(realData)) {
        realData.add(0xD0).writeFloat(10.0); // WeaponData_Gun.fireAnimMultiplier
        weapon.add(0xF0).writeU8(0); // WPN_Gun.isSemiGun
        weapon.add(0x108).writeS32(0); // WPN_Gun.semiGunFireLinkState
        weapon.add(0x110).writeFloat(0.0); // WPN_Gun.nextAllowedShootTime
        return true;
      }
    } catch(e) {}
    return false;
  }

  function applyRpgSpeed(weapon) {
    try {
      if (roomShuttingDown) return false;
      var data = safeReadPointer(weapon, 0x68);
      var realData = safeReadPointer(weapon, 0xF0); // WPN_RPG.realData
      if (data && realData && data.equals(realData)) {
        realData.add(0xEC).writeFloat(10.0); // WD_RPG.reloadAnimRate
        realData.add(0xF0).writeFloat(10.0); // WD_RPG.fireAnimRate
        weapon.add(0xF8).writeS32(1); // WPN_RPG.fireState = Try
        return true;
      }
    } catch(e) {}
    return false;
  }

  function applyWeaponSpeed(weapon) {
    if (!enabled || roomShuttingDown || !weapon || weapon.isNull()) return false;
    if (!isMyWeaponFn || !getCharAnim || !setAnimSpeed) return false;

    try {
      if (!isMyWeaponFn(weapon, ptr(0))) return false;

      var dataApplied = false;
      var anim = getCharAnim(weapon, ptr(0));
      if (anim && !anim.isNull()) {
        setAnimSpeed(anim, 10.0, ptr(0));
      }

      try {
        var data = weapon.add(0x68).readPointer();
        if (data && !data.isNull()) {
          var wpnClass = data.add(0x10).readU32();

          if (wpnClass === 5 || wpnClass === 0) {
            dataApplied = applyGrenadeGunSpeed(weapon) || dataApplied;
          }

          if (wpnClass === 1 || wpnClass === 2) {
            var realData = safeReadPointer(weapon, 0xEC);
            if (realData && !realData.isNull()) {
              realData.add(0x1BC).writeU8(0);
            }
          }
        }
      } catch(e) {}

      dataApplied = applyGunDataSpeed(weapon) || dataApplied;
      dataApplied = applyRpgSpeed(weapon) || dataApplied;

      // 动画对象可能先于特殊武器数据就绪，只有数据写入成功才结束重试。
      return dataApplied;
    } catch(e) {
      return false;
    }
  }

  function getObjectClassName(object) {
    try {
      if (!classGetNameFn || !object || object.isNull()) return null;
      var klass = object.readPointer();
      if (!klass || klass.isNull()) return null;
      var name = classGetNameFn(klass);
      return name && !name.isNull() ? name.readUtf8String() : null;
    } catch(e) {
      return null;
    }
  }

  function refreshSelectedWeapon(playerWeapons, queueRetry) {
    try {
      if (!enabled || roomShuttingDown || !playerWeapons || playerWeapons.isNull()) return false;
      var weapon = safeReadPointer(playerWeapons, 0x18);
      if (!weapon || !isMyWeaponFn(weapon, ptr(0))) return false;

      var data = safeReadPointer(weapon, 0x68);
      var dataClassName = getObjectClassName(data);
      var rpgApplied = applyRpgSpeed(weapon);
      var gunApplied = applyGunDataSpeed(weapon);

      if (rpgApplied && rpgAnimSpeedFn) {
        rpgAnimSpeedFn(weapon, ptr(0));
      } else if (gunApplied && dataClassName === 'WD_GrenadeGun' && grenadeAnimSpeedFn) {
        grenadeAnimSpeedFn(weapon, ptr(0));
      }

      var anim = getCharAnim(weapon, ptr(0));
      if (anim && !anim.isNull()) setAnimSpeed(anim, 10.0, ptr(0));

      if (!(rpgApplied || gunApplied) && queueRetry !== false) queuePendingWeaponSpeed();
      return rpgApplied || gunApplied;
    } catch(e) {
      return false;
    }
  }

  function getCurrentPlayerWeapons() {
    if (roomShuttingDown) return null;
    try {
      var mod = getGameAssembly();
      if (!mod) return null;

      var klass = safeReadPointer(mod.base.add(SPEED_RVA.GameManager_TypeInfo), 0);
      if (!klass) return null;

      var staticFields = safeReadPointer(klass, SPEED_OFF.Klass_staticFields);
      if (!staticFields) return null;

      var myPlayer = safeReadPointer(staticFields, SPEED_OFF.GM_myPlayer);
      if (!myPlayer) return null;

      return safeReadPointer(myPlayer, SPEED_OFF.Player_wpns);
    } catch(e) {
      return null;
    }
  }

  function queuePendingWeaponSpeed() {
    if (pendingWeaponSpeedTasks.length > 0) return;
    pendingWeaponSpeedTasks.push({
      framesLeft: pendingWeaponSpeedMaxFrames
    });
  }

  function clearPendingWeaponSpeed() {
    pendingWeaponSpeedTasks = [];
  }

  function clearRoomState(shuttingDown, exitingInstance) {
    clearPendingWeaponSpeed();
    isPlayerShooting = false;
    roomShuttingDown = shuttingDown === true;
    exitingModeBaseInstance = roomShuttingDown && exitingInstance ? exitingInstance : null;
    modeBaseInstance = null;
    modeSwitchGraceUntil = Date.now() + modeSwitchGraceMs;
  }

  function handleModeBaseUpdate(instance) {
    var now = Date.now();
    if (!instance || instance.isNull()) {
      clearPendingWeaponSpeed();
      modeBaseInstance = null;
      modeSwitchGraceUntil = now + modeSwitchGraceMs;
      return false;
    }

    if (roomShuttingDown) {
      if (exitingModeBaseInstance && instance.equals(exitingModeBaseInstance)) {
        return false;
      }
      roomShuttingDown = false;
      exitingModeBaseInstance = null;
      modeSwitchGraceUntil = now + modeSwitchGraceMs;
    }

    if (!modeBaseInstance) {
      modeBaseInstance = instance;
      modeSwitchGraceUntil = now + modeSwitchGraceMs;
      return false;
    }

    if (!instance.equals(modeBaseInstance)) {
      clearPendingWeaponSpeed();
      modeBaseInstance = instance;
      modeSwitchGraceUntil = now + modeSwitchGraceMs;
      return false;
    }

    return now >= modeSwitchGraceUntil;
  }

  function notifyWeaponAcquired(weapon) {
    try {
      if (!enabled || roomShuttingDown || !weapon || weapon.isNull()) return;
      if (applyWeaponSpeed(weapon) === true) return;
      queuePendingWeaponSpeed();
    } catch(e) {}
  }

  function processPendingWeaponSpeed() {
    if (roomShuttingDown || pendingWeaponSpeedTasks.length === 0) return;

    var task = pendingWeaponSpeedTasks[0];
    if (!task || task.framesLeft <= 0) {
      clearPendingWeaponSpeed();
      return;
    }

    try {
      var playerWeapons = getCurrentPlayerWeapons();
      if (playerWeapons && refreshSelectedWeapon(playerWeapons, false) === true) {
        clearPendingWeaponSpeed();
        return;
      }
    } catch(e) {}

    task.framesLeft -= 1;
    if (task.framesLeft <= 0) {
      clearPendingWeaponSpeed();
    }
  }

  return {
    enable: function() {
      if (enabled) return;
      clearRoomState(false, null);
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '射速', '未找到 GameAssembly.dll'); return; }
      var base = mod.base;

      try {
        isMyWeaponFn = new NativeFunction(base.add(0xB6E1D0), "bool", ["pointer", "pointer"]);
        getCharAnim = new NativeFunction(base.add(0xB35310), "pointer", ["pointer", "pointer"]);
        setAnimSpeed = new NativeFunction(base.add(0xAA8C30), "void", ["pointer", "float", "pointer"]);
        rpgAnimSpeedFn = new NativeFunction(base.add(0xB66CA0), "void", ["pointer", "pointer"]);
        grenadeAnimSpeedFn = new NativeFunction(base.add(0xB5F7A0), "void", ["pointer", "pointer"]);
      } catch(e) {
        sendLog('error', '射速', 'NativeFunction 初始化失败: ' + e.message);
        return;
      }

      try {
        var classGetNameAddr = mod.findExportByName('il2cpp_class_get_name');
        if (classGetNameAddr) {
          classGetNameFn = new NativeFunction(classGetNameAddr, "pointer", ["pointer"]);
        }
      } catch(e) {
        classGetNameFn = null;
      }

      // 0) ModeBase.Update — 统一处理新获得武器的射速应用时机
      try {
        hooks.push(Interceptor.attach(base.add(0xAF6A00), {
          onEnter: function(args) {
            try {
              if (handleModeBaseUpdate(args[0])) {
                processPendingWeaponSpeed();
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'ModeBase.Update Hook失败: ' + e.message); }

      try {
        hooks.push(Interceptor.attach(base.add(0xAFAA40), {
          onEnter: function() {
            clearRoomState(false, null);
          }
        }));
      } catch(e) { sendLog('warn', '射速', '回合结束清理 Hook失败: ' + e.message); }

      try {
        hooks.push(Interceptor.attach(base.add(0xAEE850), {
          onEnter: function(args) {
            clearRoomState(true, args[0]);
          }
        }));
      } catch(e) { sendLog('warn', '射速', '退出房间清理 Hook失败: ' + e.message); }

      try {
        hooks.push(Interceptor.attach(base.add(0xAFB6F0), {
          onEnter: function() {
            clearRoomState(true, modeBaseInstance);
          }
        }));
      } catch(e) { sendLog('warn', '射速', '场景销毁清理 Hook失败: ' + e.message); }

      // GiveWeapon中的Select返回时，Owner、Deploy、AnimSpeedSetting和AnimatorInit均已完成
      try {
        hooks.push(Interceptor.attach(base.add(0xB166A0), {
          onEnter: function(args) {
            this.playerWeapons = args[0];
          },
          onLeave: function(retVal) {
            if (!this.playerWeapons || roomShuttingDown || retVal.toInt32() === 0) return;
            refreshSelectedWeapon(this.playerWeapons);
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'PlayerWeapons.Select Hook失败: ' + e.message); }

      // 1) WPN_Gun.AnimSpeedSetting — 枪械(背包)动画加速（改进：onEnter立即设置）
      try {
        hooks.push(Interceptor.attach(base.add(0xB60B00), {
          onEnter: function(args) {
            this.self = args[0];
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                applyWeaponSpeed(this.self);
              }
            } catch(e) {}
          },
          onLeave: function(retVal) {
            if (!this.self) return;
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                applyWeaponSpeed(this.self);
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'WPN_Gun.AnimSpeedSetting Hook失败: ' + e.message); }

      // 1.5) WPN_RPG.AnimSpeedSetting — RPG/AT4 动画加速（改进：onEnter立即设置）
      try {
        hooks.push(Interceptor.attach(base.add(0xB66CA0), {
          onEnter: function(args) {
            this.self = args[0];
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                applyWeaponSpeed(this.self);
              }
            } catch(e) {}
          },
          onLeave: function(retVal) {
            if (!this.self) return;
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                applyWeaponSpeed(this.self);
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'WPN_RPG.AnimSpeedSetting Hook失败: ' + e.message); }

      // 1.6) WPN_GrenadeGun.AnimSpeedSetting — 榴弹枪动画加速
      try {
        hooks.push(Interceptor.attach(base.add(0xB5F7A0), {
          onEnter: function(args) {
            this.self = args[0];
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                applyWeaponSpeed(this.self);
              }
            } catch(e) {}
          },
          onLeave: function(retVal) {
            if (!this.self) return;
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                applyWeaponSpeed(this.self);
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'WPN_GrenadeGun.AnimSpeedSetting Hook失败: ' + e.message); }

      // 1.7) 武器池取出和绑定Owner后持续跟踪，覆盖第一局首次GiveWeapon
      try {
        hooks.push(Interceptor.attach(base.add(0xB6CDC0), {
          onEnter: function(args) { this.self = args[0]; },
          onLeave: function() {
            if (!this.self || roomShuttingDown) return;
            try {
              if (isMyWeaponFn(this.self, ptr(0))) notifyWeaponAcquired(this.self);
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'Weapon.OnSelectedFromWeaponPool Hook失败: ' + e.message); }

      try {
        hooks.push(Interceptor.attach(base.add(0xB6D8C0), {
          onEnter: function(args) { this.self = args[0]; },
          onLeave: function() {
            if (!this.self || roomShuttingDown) return;
            try {
              if (isMyWeaponFn(this.self, ptr(0))) notifyWeaponAcquired(this.self);
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'Weapon.SetValidOwner Hook失败: ' + e.message); }

      // 1.8) Deploy内部会读取倍率设置动画，必须在onEnter先写，onLeave再补写
      try {
        hooks.push(Interceptor.attach(base.add(0xB67030), {
          onEnter: function(args) {
            this.self = args[0];
            if (!this.self || roomShuttingDown) return;
            try {
              if (isMyWeaponFn(this.self, ptr(0))) applyRpgSpeed(this.self);
            } catch(e) {}
          },
          onLeave: function() {
            if (!this.self || roomShuttingDown) return;
            notifyWeaponAcquired(this.self);
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'WPN_RPG.Deploy Hook失败: ' + e.message); }

      try {
        hooks.push(Interceptor.attach(base.add(0xB61E60), {
          onEnter: function(args) {
            this.self = args[0];
            if (!this.self || roomShuttingDown) return;
            try {
              if (isMyWeaponFn(this.self, ptr(0))) applyGunDataSpeed(this.self);
            } catch(e) {}
          },
          onLeave: function() {
            if (!this.self || roomShuttingDown) return;
            notifyWeaponAcquired(this.self);
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'WPN_Gun.Deploy Hook失败: ' + e.message); }

      // 2) GunShoot — 清除射击间隔 + 半自动 => 全自动（改进：onEnter立即修改）
      try {
        hooks.push(Interceptor.attach(base.add(0xB624C0), {
          onEnter: function(args) {
            this.self = args[0];
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                isPlayerShooting = true;
                this.self.add(0xF0).writeU8(0);
                this.self.add(0x110).writeFloat(0.0);
                this.self.add(0x108).writeS32(0);
                applyWeaponSpeed(this.self);
              }
            } catch(e) {}
          },
          onLeave: function(retVal) {
            if (!this.self) return;
            try {
              if (roomShuttingDown) {
                isPlayerShooting = false;
                return;
              }
              if (isMyWeaponFn(this.self, ptr(0))) {
                this.self.add(0x110).writeFloat(0.0);
                this.self.add(0x108).writeS32(0);
              }
            } catch(e) {}
            isPlayerShooting = false;
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'GunShoot Hook失败: ' + e.message); }

      // 2.5) WPN_Gun.get_isSemiGun — 半自动→全自动
      try {
        hooks.push(Interceptor.attach(base.add(0xB63AD0), {
          onEnter: function(args) {
            this.self = args[0];
          },
          onLeave: function(retVal) {
            try {
              if (!roomShuttingDown && this.self && isMyWeaponFn(this.self, ptr(0))) {
                retVal.replace(0);
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'get_isSemiGun Hook失败: ' + e.message); }

      // 2.6) WPN_Gun.CloseZoom — 狙击镜不关闭（新增：连狙功能）
      try {
        hooks.push(Interceptor.attach(base.add(0xB60F00), {
          onEnter: function(args) {
            this.self = args[0];
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                args[1] = ptr(0);
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'CloseZoom Hook失败: ' + e.message); }

      // 2.7) Player.TryPickUpWeapon — 捡武器时立即设置动画速度（新增：补给箱处理）
      try {
        hooks.push(Interceptor.attach(base.add(0xB53F50), {
          onEnter: function(args) {
            this.wpn = args[1];
          },
          onLeave: function(retVal) {
            if (!this.wpn) return;
            if (retVal.toInt32() !== 1) return;
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.wpn, ptr(0))) {
                notifyWeaponAcquired(this.wpn);
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'TryPickUpWeapon Hook失败: ' + e.message); }

      // 3) WPN_Gun.OnGenerateFromOwner — 补给箱枪械创建时加速
      try {
        hooks.push(Interceptor.attach(base.add(0xB62900), {
          onEnter: function(args) { this.self = args[0]; },
          onLeave: function(retVal) {
            if (!this.self) return;
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                notifyWeaponAcquired(this.self);
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'OnGenerateFromOwner Hook失败: ' + e.message); }

      // 4) WPN_RPG.OnGenerateFromOwner — 补给箱RPG/AT4创建时加速
      try {
        hooks.push(Interceptor.attach(base.add(0xB67740), {
          onEnter: function(args) { this.self = args[0]; },
          onLeave: function(retVal) {
            if (!this.self) return;
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                notifyWeaponAcquired(this.self);
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'RPG OnGenerateFromOwner Hook失败: ' + e.message); }

      // 5) WPN_RPG.OnFireBtnPressed — RPG/AT4 半自动绕过
      try {
        hooks.push(Interceptor.attach(base.add(0xB67700), {
          onEnter: function(args) {
            this.self = args[0];
            if (!this.self || roomShuttingDown) return;
            try {
              if (isMyWeaponFn(this.self, ptr(0))) {
                this.self.add(0xF8).writeS32(1);
                applyRpgSpeed(this.self);
              }
            } catch(e) {}
          },
          onLeave: function(retVal) {
            if (!this.self) return;
            try {
              if (roomShuttingDown) return;
              if (isMyWeaponFn(this.self, ptr(0))) {
                this.self.add(0xF8).writeS32(1);
                applyRpgSpeed(this.self);
              }
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'RPG OnFireBtnPressed Hook失败: ' + e.message); }

      // 6) Recoil.OnGunShot — 清零后坐力
      try {
        hooks.push(Interceptor.attach(base.add(0xB19980), {
          onEnter: function(args) { this.self = args[0]; },
          onLeave: function(retVal) {
            if (roomShuttingDown || !isPlayerShooting || !this.self) return;
            try {
              this.self.add(0x68).writeFloat(0.0);
              this.self.add(0x6C).writeFloat(0.0);
              this.self.add(0x70).writeFloat(0.0);
              this.self.add(0x74).writeFloat(0.0);
              this.self.add(0xA8).writeS32(0);
            } catch(e) {}
          }
        }));
      } catch(e) { sendLog('warn', '射速', 'Recoil.OnGunShot Hook失败: ' + e.message); }

      // 7) Recoil.GetCurrentPerturb — 强制 0 扩散
      try {
        hooks.push(Interceptor.attach(base.add(0xB19420), {
          onLeave: function(retVal) { retVal.replace(0.0); }
        }));
      } catch(e) { sendLog('warn', '射速', 'Recoil.GetCurrentPerturb Hook失败: ' + e.message); }

      enabled = true;
      sendLog('success', '射速', '射速变快已启用');
      sendStatus('speedgun', true);
    },
    disable: function() {
      if (!enabled) return;
      for (var i = 0; i < hooks.length; i++) {
        try { hooks[i].detach(); } catch(e) {}
      }
      hooks = [];
      clearRoomState(true, modeBaseInstance);
      enabled = false;
      isMyWeaponFn = null;
      getCharAnim = null;
      setAnimSpeed = null;
      rpgAnimSpeedFn = null;
      grenadeAnimSpeedFn = null;
      classGetNameFn = null;
      sendLog('info', '射速', '射速变快已禁用');
      sendStatus('speedgun', false);
    },
    isEnabled: function() { return enabled; },
    applyToWeapon: applyWeaponSpeed,
    notifyWeaponAcquired: notifyWeaponAcquired,
    processPendingWeaponSpeed: processPendingWeaponSpeed,
    clearRoomState: clearRoomState
  };
})();
</script><script type="text/plain" id="src-main">(function() {
    console.log("[*] speed_gun_final (Player Only)");

    var mod = Process.findModuleByName("GameAssembly.dll");
    if (!mod) { console.log("[-] GameAssembly.dll not found!"); return; }
    var base = mod.base;

    var isMyWeaponFn = new NativeFunction(base.add(0xB6E1D0), "bool", ["pointer", "pointer"]);
    var getCharAnim  = new NativeFunction(base.add(0xB35310), "pointer", ["pointer", "pointer"]);
    var setAnimSpeed = new NativeFunction(base.add(0xAA8C30), "void", ["pointer", "float", "pointer"]);

    var shootCount = 0;

    var weaponSet = {};
    var weaponSetMaxSize = 100;

    function logWpn(self, tag) {
        var addr = self.toString();
        if (!weaponSet[addr]) {
            if (Object.keys(weaponSet).length >= weaponSetMaxSize) {
                weaponSet = {};
            }
            weaponSet[addr] = true;
            var dataPtr = self.add(0x68).readPointer();
            console.log("[DBG " + tag + "] NEW weapon @" + addr + " data=" + dataPtr);
        }
    }

    // ====== 1) WPN_Gun.AnimSpeedSetting — 枪械(背包)动画加速 ======
    // 方案一：在onEnter中立即设置，确保第一发就生效
    Interceptor.attach(base.add(0xB60B00), {
        onEnter: function(args) {
            this.self = args[0];
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    // 立即设置动画速度（在函数执行前）
                    var anim = getCharAnim(this.self, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                }
            } catch(e) {}
        },
        onLeave: function(retVal) {
            // onLeave也设置一次，确保覆盖
            if (!this.self) return;
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    var anim = getCharAnim(this.self, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                }
            } catch(e) {}
        }
    });

    // ====== 1.5) WPN_RPG.AnimSpeedSetting — RPG/AT4 动画加速 ======
    // 方案一：在onEnter中立即设置，确保第一发就生效
    Interceptor.attach(base.add(0xB66CA0), {
        onEnter: function(args) {
            this.self = args[0];
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    // 立即设置动画速度（在函数执行前）
                    var anim = getCharAnim(this.self, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                }
            } catch(e) {}
        },
        onLeave: function(retVal) {
            // onLeave也设置一次，确保覆盖
            if (!this.self) return;
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    var anim = getCharAnim(this.self, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                }
            } catch(e) {}
        }
    });

    // ====== 1.6) WPN_GrenadeGun.AnimSpeedSetting — 榴弹枪动画加速 ======
    // 方案一：在onEnter中立即设置，确保第一发就生效
    Interceptor.attach(base.add(0xB5F7A0), {
        onEnter: function(args) {
            this.self = args[0];
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    // 立即设置realData中的动画速度
                    var realData = this.self.add(0xEC).readPointer();
                    if (!realData.isNull()) {
                        realData.add(0xD0).writeFloat(10.0);
                    }
                    
                    // 立即设置动画速度（在函数执行前）
                    var anim = getCharAnim(this.self, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                }
            } catch(e) {}
        },
        onLeave: function(retVal) {
            // onLeave也设置一次，确保覆盖
            if (!this.self) return;
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    var anim = getCharAnim(this.self, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                }
            } catch(e) {}
        }
    });

    // ====== 2) GunShoot — 清除射击间隔 + 半自动 => 全自动 + 狙击镜不关闭 ======
    // 方案一：在onEnter中立即修改，确保第一发就生效
    Interceptor.attach(base.add(0xB624C0), {
        onEnter: function(args) {
            this.self = args[0];
            this.isMyWeapon = false;
            try {
                this.isMyWeapon = isMyWeaponFn(this.self, ptr(0));
                if (this.isMyWeapon) {
                    shootCount++;
                    logWpn(this.self, "GunShoot.onEnter");
                    
                    // 立即清除射击间隔（在射击前）
                    this.self.add(0xF0).writeU8(0);        // 清除某个标志
                    this.self.add(0x110).writeFloat(0.0);  // 清除射击间隔时间
                    this.self.add(0x108).writeS32(0);      // 清除射击计数
                    
                    // 立即设置动画速度（在射击前）
                    var anim = getCharAnim(this.self, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                    
                    // 立即清除realData中的半自动标志
                    var realData = this.self.add(0xEC).readPointer();
                    if (!realData.isNull()) {
                        realData.add(0x1BC).writeU8(0);    // 清除半自动标志
                    }
                }
            } catch(e) {}
        },
        onLeave: function(retVal) {
            // onLeave保持为空，所有修改已在onEnter完成
        }
    });

    // ====== 2.5) WPN_Gun.get_isSemiGun — 半自动→全自动（返回false欺骗游戏）======
    Interceptor.attach(base.add(0xB63AD0), {
        onEnter: function(args) {
            logWpn(args[0], "get_isSemiGun");
        },
        onLeave: function(retVal) {
            retVal.replace(0);
        }
    });

    // ====== 2.6) WPN_Gun.CloseZoom — 狙击镜不关闭（阻止关闭瞄准镜函数执行）======
    Interceptor.attach(base.add(0xB60F00), {
        onEnter: function(args) {
            this.self = args[0];
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    args[1] = ptr(0);
                }
            } catch(e) {}
        }
    });

    // ====== 3) Player.TryPickUpWeapon — 补给箱捡武器时立即设置动画速度 ======
    Interceptor.attach(base.add(0xB53F50), {
        onEnter: function(args) {
            this.wpn = args[1];
        },
        onLeave: function(retVal) {
            if (!this.wpn) return;
            if (retVal.toInt32() !== 1) return;
            try {
                if (isMyWeaponFn(this.wpn, ptr(0))) {
                    logWpn(this.wpn, "TryPickUpWeapon");
                    
                    var anim = getCharAnim(this.wpn, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                    
                    var data = this.wpn.add(0x68).readPointer();
                    if (!data.isNull()) {
                        var wpnClass = data.add(0x10).readU32();
                        
                        if (wpnClass === 5) {
                            var realData = this.wpn.add(0xEC).readPointer();
                            if (!realData.isNull()) {
                                realData.add(0xD0).writeFloat(10.0);
                            }
                        }
                        
                        if (wpnClass === 1 || wpnClass === 2) {
                            var realData = this.wpn.add(0xEC).readPointer();
                            if (!realData.isNull()) {
                                realData.add(0x1BC).writeU8(0);
                            }
                        }
                    }
                }
            } catch(e) {}
        }
    });

    // ====== 4) WPN_Gun.OnGenerateFromOwner — 补给箱枪械创建时加速 ======
    Interceptor.attach(base.add(0xB62900), {
        onEnter: function(args) {
            this.self = args[0];
        },
        onLeave: function(retVal) {
            if (!this.self) return;
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    var anim = getCharAnim(this.self, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                }
            } catch(e) {}
        }
    });

    // ====== 5) WPN_RPG.OnGenerateFromOwner — 补给箱RPG/AT4创建时加速 ======
    Interceptor.attach(base.add(0xB67740), {
        onEnter: function(args) {
            this.self = args[0];
        },
        onLeave: function(retVal) {
            if (!this.self) return;
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    var anim = getCharAnim(this.self, ptr(0));
                    if (!anim.isNull()) {
                        setAnimSpeed(anim, 10.0, ptr(0));
                    }
                    var realData = this.self.add(0xF0).readPointer();
                    if (!realData.isNull()) {
                        realData.add(0xF0).writeFloat(10.0);
                        realData.add(0xEC).writeFloat(10.0);
                    }
                }
            } catch(e) {}
        }
    });

    // ====== 6) WPN_RPG.OnFireBtnPressed — RPG/AT4 半自动绕过 ======
    Interceptor.attach(base.add(0xB67700), {
        onEnter: function(args) {
            this.self = args[0];
        },
        onLeave: function(retVal) {
            if (!this.self) return;
            try {
                if (isMyWeaponFn(this.self, ptr(0))) {
                    this.self.add(0xF8).writeS32(1);
                    var realData = this.self.add(0xF0).readPointer();
                    if (!realData.isNull()) {
                        realData.add(0xF0).writeFloat(10.0);
                        realData.add(0xEC).writeFloat(10.0);
                    }
                }
            } catch(e) {}
        }
    });

    // ====== 7) Recoil.OnGunShot — 清零后坐力 ======
    Interceptor.attach(base.add(0xB19980), {
        onEnter: function(args) {
            this.self = args[0];
            this.shootId = shootCount;
        },
        onLeave: function(retVal) {
            if (!this.self) return;
            if (this.shootId !== shootCount) return;
            try {
                this.self.add(0x68).writeFloat(0.0);
                this.self.add(0x6C).writeFloat(0.0);
                this.self.add(0x70).writeFloat(0.0);
                this.self.add(0x74).writeFloat(0.0);
                this.self.add(0xA8).writeS32(0);
            } catch(e) {}
        }
    });

    // ====== 8) Recoil.GetCurrentPerturb — 强制 0 扩散 ======
    Interceptor.attach(base.add(0xB19420), {
        onLeave: function(retVal) {
            retVal.replace(0.0);
        }
    });

    console.log("[+] Loaded:");
    console.log("    - Anim speed x10 (player only)");
    console.log("    - Infinite fire rate (player only)");
    console.log("    - Semi-auto -> full-auto (sniper/pistol/RPG, player only)");
    console.log("    - Keep zoom (sniper scope stays open after shooting)");
    console.log("    - Supply box weapons instant effect (fix slotType)");
    console.log("    - No recoil (player only)");
    console.log("    - No spread (all)");
})();
