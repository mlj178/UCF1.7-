source-meta" id="meta"></div><div class="code-highlight-legend"><span class="highlight-legend-item"><span class="highlight-swatch address"></span>蓝：定位地址</span><span class="highlight-legend-item"><span class="highlight-swatch hook"></span>红：安装或恢复 Hook</span><span class="highlight-legend-item"><span class="highlight-swatch effect"></span>绿：改变游戏行为</span><span class="highlight-legend-item"><span class="highlight-swatch risk"></span>橙：风险或依赖</span></div></div><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><script type="text/plain" id="src-manager">#include "game_manager.h"
#include "../stdafx.h"
#include <algorithm>

namespace esp {

static void* s_gameManagerInstance = nullptr;
static bool s_initialized = false;
static bool s_hasActiveSession = false;

// Static member initialization
std::unordered_map<void*, BotPlayerEntry> GameManager::s_BotPlayers;
bool GameManager::s_BotHookInitialized = false;
CRITICAL_SECTION GameManager::s_BotPlayersCS;
bool GameManager::s_CritSecInitialized = false;
constexpr DWORD GameManager::BOT_ENTRY_TIMEOUT_MS;
constexpr DWORD GameManager::ROUND_CHANGE_COOLDOWN_MS;
DWORD GameManager::s_SessionEpoch = 0;
DWORD GameManager::s_LastRoundChangeTime = 0;

typedef void (__cdecl *BotUpdateFunc)(void* bot, void* methodInfo);
typedef bool (__cdecl *GetIsDeadFn)(void* entity, void* methodInfo);

static BotUpdateFunc s_OriginalBotUpdate = nullptr;

void GameManager::ClearRuntimeCaches(const char* reason) {
    if (s_gameManagerInstance || !s_BotPlayers.empty()) {
        DebugLog("[GameManager] Clearing session state: %s\n", reason ? reason : "unknown");
    }
    s_gameManagerInstance = nullptr;
    s_hasActiveSession = false;
    
    if (s_CritSecInitialized) {
        EnterCriticalSection(&s_BotPlayersCS);
    }
    s_BotPlayers.clear();
    if (s_CritSecInitialized) {
        LeaveCriticalSection(&s_BotPlayersCS);
    }
    
    IL2CPPBridge::ResetSessionState();
}

static bool IsSaneCount(int count, int maxCount) {
    return count >= 0 && count <= maxCount;
}

static void AddUniquePlayer(std::vector<void*>& players, void* player) {
    if (!player) return;

    if (!GameManager::IsValidPlayer(player)) {
        static int invalidCounter = 0;
        if (invalidCounter++ % 120 == 0) {
            DebugLog("[GameManager] AddUniquePlayer: Invalid player 0x%p\n", player);
        }
        return;
    }

    players.push_back(player);
}

static void ReadArrayPlayers(void* arrayPtr, std::vector<void*>& players, int maxCount, const char* label) {
    if (!arrayPtr || !IsValidPointer(arrayPtr)) return;

    int length = 0;
    if (!SafeReadValue<int>((char*)arrayPtr + OffsetConstants::Arr_len, &length)) return;
    if (!IsSaneCount(length, maxCount)) {
        DebugLog("[GameManager] Ignoring %s with invalid length: %d\n", label, length);
        return;
    }

    for (int i = 0; i < length; ++i) {
        void* player = nullptr;
        if (SafeReadValue<void*>((char*)arrayPtr + OffsetConstants::Arr_data + i * sizeof(void*), &player)) {
            AddUniquePlayer(players, player);
        }
    }
}

static void ReadListPlayers(void* listPtr, std::vector<void*>& players, int maxCount, const char* label) {
    if (!listPtr || !IsValidPointer(listPtr)) return;

    void* items = nullptr;
    int count = 0;
    if (!SafeReadValue<void*>((char*)listPtr + OffsetConstants::List_items, &items)) return;
    if (!SafeReadValue<int>((char*)listPtr + OffsetConstants::List_size, &count)) return;
    if (!IsSaneCount(count, maxCount)) {
        DebugLog("[GameManager] Ignoring %s with invalid size: %d\n", label, count);
        return;
    }
    if (count == 0 || !items || !IsValidPointer(items)) return;

    for (int i = 0; i < count; ++i) {
        void* player = nullptr;
        if (SafeReadValue<void*>((char*)items + OffsetConstants::Arr_data + i * sizeof(void*), &player)) {
            AddUniquePlayer(players, player);
        }
    }
}

static bool SafeCallIsDead(GetIsDeadFn fn, void* player, bool* outValue) {
    if (!fn || !player || !outValue) return false;

#if defined(_MSC_VER)
    __try {
        *outValue = fn(player, nullptr);
        return true;
    } __except(EXCEPTION_EXECUTE_HANDLER) {
        return false;
    }
#else
    SAFE_TRY {
        *outValue = fn(player, nullptr);
        return true;
    } SAFE_EXCEPT_RET(false)
#endif
}

static void __cdecl HookedBotUpdate(void* botInstance, void* methodInfo) {
    if (s_OriginalBotUpdate) {
#if defined(_MSC_VER)
        __try {
            s_OriginalBotUpdate(botInstance, methodInfo);
        } __except(EXCEPTION_EXECUTE_HANDLER) {
            return;
        }
#else
        SAFE_TRY {
            s_OriginalBotUpdate(botInstance, methodInfo);
        } SAFE_EXCEPT_NOP
#endif
    }

    GameManager::OnBotUpdate(botInstance);
}

bool GameManager::Initialize() {
    if (s_initialized) return true;
    if (!IL2CPPBridge::IsInitialized()) return false;

    DebugLog("[GameManager] ===== Initialize =====\n");
    
    // 初始化临界区（用于线程同步）
    if (!s_CritSecInitialized) {
        InitializeCriticalSection(&s_BotPlayersCS);
        s_CritSecInitialized = true;
        DebugLog("[GameManager] Critical section initialized\n");
    }
    
    s_initialized = true;
    RefreshSession();
    return true;
}

bool GameManager::IsInitialized() {
    return s_initialized;
}

void GameManager::ResetSessionState() {
    ClearRuntimeCaches("explicit reset");
}

void GameManager::Cleanup() {
    DebugLog("[GameManager] Cleanup called.\n");
    
    // Clear caches first
    ClearRuntimeCaches("cleanup");
    
    // Delete critical section
    if (s_CritSecInitialized) {
        DeleteCriticalSection(&s_BotPlayersCS);
        s_CritSecInitialized = false;
        DebugLog("[GameManager] Critical section deleted.\n");
    }
    
    s_initialized = false;
}

bool GameManager::RefreshSession() {
    if (!s_initialized || !IL2CPPBridge::IsInitialized() || !IL2CPPBridge::IsGameAssemblyReady()) {
        ClearRuntimeCaches("bridge unavailable");
        return false;
    }

    void* newInstance = IL2CPPBridge::GetGameManagerInstance();
    if (!newInstance) {
        if (s_hasActiveSession || s_gameManagerInstance) {
            ClearRuntimeCaches("GameManager unavailable");
        }
        return false;
    }

    if (newInstance != s_gameManagerInstance) {
        DebugLog("[GameManager] GameManager instance changed: 0x%p -> 0x%p\n",
                 s_gameManagerInstance, newInstance);
        s_gameManagerInstance = newInstance;
        
        // 线程安全清理 s_BotPlayers
        if (s_CritSecInitialized) {
            EnterCriticalSection(&s_BotPlayersCS);
        }
        s_BotPlayers.clear();
        if (s_CritSecInitialized) {
            LeaveCriticalSection(&s_BotPlayersCS);
        }
    }

    s_hasActiveSession = true;
    return true;
}

bool GameManager::HasActiveSession() {
    return s_hasActiveSession && s_gameManagerInstance && IsValidPointer(s_gameManagerInstance);
}

void* GameManager::GetInstance() {
    return HasActiveSession() ? s_gameManagerInstance : nullptr;
}

void* GameManager::GetLocalPlayer() {
    if (!HasActiveSession()) return nullptr;

    void* gameAssembly = IL2CPPBridge::GetBase();
    if (!gameAssembly) return nullptr;

    void* typeInfoSlot = (void*)((char*)gameAssembly + RVAConstants::GameManager_TypeInfo);
    void* klass = nullptr;
    if (SafeReadValue<void*>(typeInfoSlot, &klass) && klass && IsValidPointer(klass)) {
        void* staticFields = nullptr;
        if (SafeReadValue<void*>((char*)klass + OffsetConstants::Klass_staticFields, &staticFields)
            && staticFields && IsValidPointer(staticFields)) {
            void* myPlayer = nullptr;
            if (SafeReadValue<void*>(staticFields, &myPlayer) && IsValidPlayer(myPlayer)) {
                return myPlayer;
            }
        }
    }

    return nullptr;
}

std::vector<void*> GameManager::GetAllPlayers() {
    std::vector<void*> result;
    if (!RefreshSession()) return result;

    void* instance = s_gameManagerInstance;
    if (!instance) return result;

    // Primary source: playersBL_Alive + playersGR_Alive (only alive players)
    void* playersBL_Alive = nullptr;
    if (SafeReadValue<void*>((char*)instance + OffsetConstants::GM_playersBL_Alive, &playersBL_Alive)) {
        ReadListPlayers(playersBL_Alive, result, 32, "playersBL_Alive");
    }

    void* playersGR_Alive = nullptr;
    if (SafeReadValue<void*>((char*)instance + OffsetConstants::GM_playersGR_Alive, &playersGR_Alive)) {
        ReadListPlayers(playersGR_Alive, result, 32, "playersGR_Alive");
    }

    // Fallback: if alive lists are empty, try allPlayers
    if (result.empty()) {
        void* allPlayersArr = nullptr;
        if (SafeReadValue<void*>((char*)instance + OffsetConstants::GM_allPlayers, &allPlayersArr)) {
            ReadArrayPlayers(allPlayersArr, result, 64, "allPlayers");
        }
    }

    std::sort(result.begin(), result.end());
    result.erase(std::unique(result.begin(), result.end()), result.end());

    static int logCounter = 0;
    if (logCounter++ % 120 == 0) {
        DebugLog("[GameManager] Got %zu unique players\n", result.size());
    }

    return result;
}

bool GameManager::IsValidPlayer(void* player) {
    if (!player || !IsValidPointer(player)) return false;

    // 1. Check object's klass pointer (IL2CPP object header, offset 0x00)
    // If object is GC collected, klass pointer may be invalid
    void* klass = nullptr;
    if (!SafeReadValue<void*>(player, &klass)) {
        static int logCounter = 0;
        if (logCounter++ % 120 == 0) {
            DebugLog("[GameManager] IsValidPlayer: Failed to read klass for 0x%p\n", player);
        }
        return false;
    }
    if (!klass || !IsValidPointer(klass)) {
        static int logCounter = 0;
        if (logCounter++ % 120 == 0) {
            DebugLog("[GameManager] IsValidPlayer: Invalid klass 0x%p for player 0x%p\n", klass, player);
        }
        return false;
    }

    // 2. Check team field (Entity.team, offset 0x20)
    int team = -1;
    if (!SafeReadValue<int>((char*)player + OffsetConstants::E_team, &team)) return false;
    if (team < 0 || team > 2) return false;

    // 3. Check characterContainer (Player.characterContainer, offset 0x58)
    void* container = nullptr;
    if (SafeReadValue<void*>((char*)player + OffsetConstants::P_characterContainer, &container)) {
        if (container && !IsValidPointer(container)) return false;
    }

    return true;
}

bool GameManager::IsPlayerDead(void* player) {
    // 1. Basic validation: session and pointer validity
    if (!HasActiveSession()) return true;
    if (!player || !IsValidPointer(player)) return true;

    // 2. Quick validation: check object's klass pointer (avoid accessing recycled objects)
    void* klass = nullptr;
    if (!SafeReadValue<void*>(player, &klass) || !klass || !IsValidPointer(klass)) {
        // Object has been GC collected, treat as dead
        static int logCounter = 0;
        if (logCounter++ % 120 == 0) {
            DebugLog("[GameManager] IsPlayerDead: Object recycled, klass invalid for 0x%p\n", player);
        }
        return true;
    }

    // 3. Full validation: use IsValidPlayer
    if (!IsValidPlayer(player)) return true;

    // 4. Get get_isDead function address
    void* gameAssembly = IL2CPPBridge::GetBase();
    if (!gameAssembly) return true;

    GetIsDeadFn getIsDead = (GetIsDeadFn)((char*)gameAssembly + RVAConstants::Entity_get_isDead);
    if (!IsExecutableAddress((void*)getIsDead)) {
        DebugLog("[GameManager] get_isDead address is not executable: 0x%p\n", getIsDead);
        return true;
    }

    // 5. Call get_isDead (with SEH protection)
    bool isDead = true;
    if (!SafeCallIsDead(getIsDead, player, &isDead)) {
        // SEH caught exception, object may have been GC collected
        static int failCounter = 0;
        if (failCounter++ % 60 == 0) {
            DebugLog("[GameManager] get_isDead SEH exception for player 0x%p, treating as dead (count: %d)\n",
                     player, failCounter);
        }
        return true;
    }

    static int logCounter = 0;
    if (logCounter++ % 600 == 0) {
        DebugLog("[GameManager] IsPlayerDead(0x%p) = %d\n", player, isDead ? 1 : 0);
    }

    return isDead;
}

int GameManager::GetPlayerTeam(void* player) {
    if (!IsValidPlayer(player)) return -1;

    int team = -1;
    if (SafeReadValue<int>((char*)player + OffsetConstants::E_team, &team)) {
        return team;
    }
    return -1;
}

void GameManager::InitializeBotHook() {
    if (s_BotHookInitialized) {
        DebugLog("[GameManager] BotHook already initialized\n");
        return;
    }

    HMODULE gameModule = GetModuleHandleA("GameAssembly.dll");
    if (!gameModule) {
        DebugLog("[GameManager] BotHook: GameAssembly not loaded\n");
        return;
    }

    void* botUpdateAddr = (void*)((uintptr_t)gameModule + 0xB33370);
    if (!IsExecutableAddress(botUpdateAddr)) {
        DebugLog("[GameManager] BotHook: Bot.Update address is not executable: 0x%p\n", botUpdateAddr);
        return;
    }

    DebugLog("[GameManager] BotHook: Bot.Update at 0x%p (RVA+0xB33370)\n", botUpdateAddr);

    MH_STATUS createStatus = MH_CreateHook(botUpdateAddr, &HookedBotUpdate, reinterpret_cast<LPVOID*>(&s_OriginalBotUpdate));
    if (createStatus != MH_OK) {
        DebugLog("[GameManager] BotHook: Failed to create hook: %s\n", MH_StatusToString(createStatus));
        return;
    }

    MH_STATUS enableStatus = MH_EnableHook(botUpdateAddr);
    if (enableStatus != MH_OK) {
        DebugLog("[GameManager] BotHook: Failed to enable hook: %s\n", MH_StatusToString(enableStatus));
        MH_RemoveHook(botUpdateAddr);
        s_OriginalBotUpdate = nullptr;
        return;
    }

    s_BotHookInitialized = true;
    DebugLog("[GameManager] BotHook: Bot.Update hooked successfully\n");
}

// Room/Round change detection - Key RVA addresses
static constexpr uintptr_t RVA_ModeBase_OnStartNewGameRound = 0xAF5B30;
static constexpr uintptr_t RVA_GameManager_OnDestroy = 0xAFB6F0;

typedef void (__cdecl *RoundStartFunc)(void* modeBase, void* methodInfo);
typedef void (__cdecl *GameDestroyFunc)(void* gm, void* methodInfo);

static RoundStartFunc s_OriginalRoundStart = nullptr;
static GameDestroyFunc s_OriginalGameDestroy = nullptr;

static void __cdecl HookedRoundStart(void* modeBase, void* methodInfo) {
    GameManager::OnRoundStart();
    
    if (s_OriginalRoundStart) {
#if defined(_MSC_VER)
        __try {
            s_OriginalRoundStart(modeBase, methodInfo);
        } __except(EXCEPTION_EXECUTE_HANDLER) {
            return;
        }
#else
        SAFE_TRY {
            s_OriginalRoundStart(modeBase, methodInfo);
        } SAFE_EXCEPT_NOP
#endif
    }
}

static void __cdecl HookedGameDestroy(void* gm, void* methodInfo) {
    GameManager::OnGameDestroy();
    
    if (s_OriginalGameDestroy) {
#if defined(_MSC_VER)
        __try {
            s_OriginalGameDestroy(gm, methodInfo);
        } __except(EXCEPTION_EXECUTE_HANDLER) {
            return;
        }
#else
        SAFE_TRY {
            s_OriginalGameDestroy(gm, methodInfo);
        } SAFE_EXCEPT_NOP
#endif
    }
}

void GameManager::InitializeRoomHooks() {
    HMODULE gameModule = GetModuleHandleA("GameAssembly.dll");
    if (!gameModule) {
        DebugLog("[GameManager] RoomHooks: GameAssembly not loaded\n");
        return;
    }
    
    // Hook 1: ModeBase$$OnStartNewGameRound (0xAF5B30)
    void* addr1 = (void*)((uintptr_t)gameModule + RVA_ModeBase_OnStartNewGameRound);
    if (IsExecutableAddress(addr1)) {
        MH_STATUS status = MH_CreateHook(addr1, &HookedRoundStart, 
                                         reinterpret_cast<LPVOID*>(&s_OriginalRoundStart));
        if (status == MH_OK) {
            MH_EnableHook(addr1);
            DebugLog("[GameManager] RoomHooks: ModeBase$$OnStartNewGameRound hooked at 0x%p\n", addr1);
        } else {
            DebugLog("[GameManager] RoomHooks: Failed to hook OnStartNewGameRound: %s\n", MH_StatusToString(status));
        }
    }
    
    // Hook 2: GameManager$$OnDestroy (0xAFB6F0)
    void* addr2 = (void*)((uintptr_t)gameModule + RVA_GameManager_OnDestroy);
    if (IsExecutableAddress(addr2)) {
        MH_STATUS status = MH_CreateHook(addr2, &HookedGameDestroy,
                                         reinterpret_cast<LPVOID*>(&s_OriginalGameDestroy));
        if (status == MH_OK) {
            MH_EnableHook(addr2);
            DebugLog("[GameManager] RoomHooks: GameManager$$OnDestroy hooked at 0x%p\n", addr2);
        } else {
            DebugLog("[GameManager] RoomHooks: Failed to hook OnDestroy: %s\n", MH_StatusToString(status));
        }
    }
}

void GameManager::OnRoundStart() {
    DWORD currentTime = GetTickCount();
    
    // Increment session epoch
    s_SessionEpoch++;
    s_LastRoundChangeTime = currentTime;
    
    DebugLog("[GameManager] OnRoundStart: New round started, epoch=%lu, clearing bot cache\n", s_SessionEpoch);
    
    // Clear bot cache
    if (s_CritSecInitialized) {
        EnterCriticalSection(&s_BotPlayersCS);
    }
    size_t count = s_BotPlayers.size();
    s_BotPlayers.clear();
    if (s_CritSecInitialized) {
        LeaveCriticalSection(&s_BotPlayersCS);
    }
    
    DebugLog("[GameManager] OnRoundStart: Cleared %zu bot entries, cooldown 2s\n", count);
}

void GameManager::OnGameDestroy() {
    DebugLog("[GameManager] OnGameDestroy: GameManager destroyed, epoch=%lu\n", s_SessionEpoch);
    
    // Increment session epoch
    s_SessionEpoch++;
    
    // Clear all runtime caches
    ClearRuntimeCaches("GameManager destroyed");
}

void GameManager::OnRoomChanged() {
    // Keep for compatibility, but delegate to OnRoundStart
    OnRoundStart();
}

// Check if player is in current GM's alive player lists
bool GameManager::IsPlayerInCurrentRoom(void* player) {
    if (!player || !s_gameManagerInstance) return false;
    
    // Check playersBL_Alive (List<Player> at +0x24)
    void* listBL = nullptr;
    if (SafeReadValue<void*>((char*)s_gameManagerInstance + OffsetConstants::GM_playersBL_Alive, &listBL)
        && listBL && IsValidPointer(listBL)) {
        void* items = nullptr;
        int count = 0;
        if (SafeReadValue<void*>((char*)listBL + OffsetConstants::List_items, &items)
            && SafeReadValue<int>((char*)listBL + OffsetConstants::List_size, &count)
            && count > 0 && count <= 32 && items && IsValidPointer(items)) {
            for (int i = 0; i < count; i++) {
                void* p = nullptr;
                if (SafeReadValue<void*>((char*)items + OffsetConstants::Arr_data + i * sizeof(void*), &p)) {
                    if (p == player) return true;
                }
            }
        }
    }
    
    // Check playersGR_Alive (List<Player> at +0x2C)
    void* listGR = nullptr;
    if (SafeReadValue<void*>((char*)s_gameManagerInstance + OffsetConstants::GM_playersGR_Alive, &listGR)
        && listGR && IsValidPointer(listGR)) {
        void* items = nullptr;
        int count = 0;
        if (SafeReadValue<void*>((char*)listGR + OffsetConstants::List_items, &items)
            && SafeReadValue<int>((char*)listGR + OffsetConstants::List_size, &count)
            && count > 0 && count <= 32 && items && IsValidPointer(items)) {
            for (int i = 0; i < count; i++) {
                void* p = nullptr;
                if (SafeReadValue<void*>((char*)items + OffsetConstants::Arr_data + i * sizeof(void*), &p)) {
                    if (p == player) return true;
                }
            }
        }
    }
    
    // Fallback: check allPlayers array (Player[] at +0x1C)
    void* allPlayersPtr = nullptr;
    if (SafeReadValue<void*>((char*)s_gameManagerInstance + OffsetConstants::GM_allPlayers, &allPlayersPtr)
        && allPlayersPtr && IsValidPointer(allPlayersPtr)) {
        int count = 0;
        if (SafeReadValue<int>((char*)allPlayersPtr + OffsetConstants::Arr_len, &count)
            && count > 0 && count <= 64) {
            for (int i = 0; i < count; i++) {
                void* p = nullptr;
                if (SafeReadValue<void*>((char*)allPlayersPtr + OffsetConstants::Arr_data + i * sizeof(void*), &p)) {
                    if (p == player) return true;
                }
            }
        }
    }
    
    return false;
}

void GameManager::OnBotUpdate(void* botInstance) {
    if (!HasActiveSession() || !botInstance || !IsValidPointer(botInstance)) return;
    
    DWORD currentTime = GetTickCount();
    
    // Skip Bot.Update during round change cooldown (2 seconds)
    if (currentTime - s_LastRoundChangeTime < ROUND_CHANGE_COOLDOWN_MS) {
        return;
    }

    void* player = nullptr;
    if (!SafeReadValue<void*>((char*)botInstance + 0x24, &player) || !player) return;
    
    // Validate player pointer
    if (!IsValidPointer(player) || !IsValidPlayer(player)) return;
    
    // CRITICAL: Check if player is in current room's allPlayers
    if (!IsPlayerInCurrentRoom(player)) {
        static int rejectCount = 0;
        if (rejectCount++ % 60 == 0) {
            DebugLog("[GameManager] OnBotUpdate: Rejected player 0x%p (not in current room)\n", player);
        }
        return;
    }
    
    // Thread-safe write with current epoch
    if (s_CritSecInitialized) {
        EnterCriticalSection(&s_BotPlayersCS);
    }
    
    BotPlayerEntry entry;
    entry.player = player;
    entry.timestamp = currentTime;
    entry.epoch = s_SessionEpoch;  // Use current epoch
    s_BotPlayers[player] = entry;
    
    if (s_CritSecInitialized) {
        LeaveCriticalSection(&s_BotPlayersCS);
    }
}

std::vector<void*> GameManager::GetBotPlayers() {
    std::vector<void*> players;
    
    if (!HasActiveSession()) {
        if (s_CritSecInitialized) {
            EnterCriticalSection(&s_BotPlayersCS);
        }
        size_t count = s_BotPlayers.size();
        if (count > 0) {
            DebugLog("[GameManager] GetBotPlayers: Clearing %zu bot players (no session)\n", count);
        }
        s_BotPlayers.clear();
        if (s_CritSecInitialized) {
            LeaveCriticalSection(&s_BotPlayersCS);
        }
        return players;
    }

    DWORD currentTime = GetTickCount();
    DWORD currentEpoch = s_SessionEpoch;
    int expiredCount = 0;
    int invalidCount = 0;
    int epochMismatchCount = 0;
    
    if (s_CritSecInitialized) {
        EnterCriticalSection(&s_BotPlayersCS);
    }
    
    for (auto it = s_BotPlayers.begin(); it != s_BotPlayers.end();) {
        void* player = it->first;
        DWORD timestamp = it->second.timestamp;
        DWORD epoch = it->second.epoch;
        
        // Check epoch mismatch (cross-round protection)
        if (epoch != currentEpoch) {
            it = s_BotPlayers.erase(it);
            epochMismatchCount++;
            continue;
        }
        
        // Check timestamp expiration
        if (currentTime - timestamp > BOT_ENTRY_TIMEOUT_MS) {
            it = s_BotPlayers.erase(it);
            expiredCount++;
            continue;
        }
        
        // Check pointer validity
        void* klass = nullptr;
        bool isValid = player && IsValidPointer(player) &&
                       SafeReadValue<void*>(player, &klass) && 
                       klass && IsValidPointer(klass) &&
                       IsValidPlayer(player);
        
        if (isValid) {
            players.push_back(player);
            ++it;
        } else {
            it = s_BotPlayers.erase(it);
            invalidCount++;
        }
    }
    
    if (s_CritSecInitialized) {
        LeaveCriticalSection(&s_BotPlayersCS);
    }
    
    static int logCounter = 0;
    if (logCounter++ % 60 == 0) {
        DebugLog("[GameManager] GetBotPlayers: total=%zu, epochMismatch=%d, expired=%d, invalid=%d, valid=%zu, epoch=%lu\n",
                 s_BotPlayers.size(), epochMismatchCount, expiredCount, invalidCount, players.size(), currentEpoch);
    }
    
    return players;
}

}

#include "esp_state.h"

namespace esp {

bool ESPRenderer::s_Enabled = true;
bool ESPRenderer::s_Initialized = false;
int ESPRenderer::s_FrameCounter = 0;

static bool SafeDrawPlayer(void* player, void* localPlayer) {
    if (!player || player == localPlayer) return false;
    if (GameManager::IsPlayerDead(player)) return false;

#if defined(_MSC_VER)
    __try {
        ESPRenderer::DrawPlayerESP(player, localPlayer);
        return true;
    } __except(EXCEPTION_EXECUTE_HANDLER) {
        DebugLog("[ESP] DrawPlayerESP access violation for player 0x%p\n", player);
        return false;
    }
#else
    SAFE_TRY {
        ESPRenderer::DrawPlayerESP(player, localPlayer);
        return true;
    } SAFE_EXCEPT_RET(false)
#endif
}

bool ESPRenderer::Initialize() {
    if (s_Initialized) return true;

    // Install Bot hook and Room change hooks
    GameManager::InitializeBotHook();
    GameManager::InitializeRoomHooks();

    // Wait a bit for hooks to capture instances
    Sleep(100);

    // Priority 2: Initialize GameManager (will use hooked instance if available)
    if (!GameManager::Initialize()) {
        DebugLog("[ESPRenderer] GameManager init failed\n");
        return false;
    }

    if (!TransformHelper::Initialize()) {
        DebugLog("[ESPRenderer] TransformHelper init failed\n");
        return false;
    }

    if (!CoordConverter::Initialize()) {
        DebugLog("[ESPRenderer] CoordConverter init failed\n");
        return false;
    }

    s_Initialized = true;
    DebugLog("[ESPRenderer] Initialized successfully\n");
    return true;
}

void ESPRenderer::Render() {
    // Check if ESP box is enabled via external control
    if (!ESPState::Instance().IsBoxEnabled()) return;
    if (!s_Enabled || !s_Initialized) return;

    if (!GameManager::RefreshSession()) {
        return;
    }

    void* localPlayer = GameManager::GetLocalPlayer();
    if (!localPlayer) {
        return;
    }

    auto playersFromList = GameManager::GetAllPlayers();
    auto playersFromBot = GameManager::GetBotPlayers();
    if (playersFromList.empty() && playersFromBot.empty()) {
        return;
    }

    std::vector<void*> allPlayers;
    std::unordered_set<void*> seenPlayers;

    // Primary source: players from GameManager alive lists
    for (size_t i = 0; i < playersFromList.size(); i++) {
        void* player = playersFromList[i];
        if (player && IsValidPointer(player) && seenPlayers.find(player) == seenPlayers.end()) {
            allPlayers.push_back(player);
            seenPlayers.insert(player);
        }
    }

    // Bot.Update is supplementary: only add players NOT already in the alive lists
    for (size_t i = 0; i < playersFromBot.size(); i++) {
        void* player = playersFromBot[i];
        if (player && IsValidPointer(player) && seenPlayers.find(player) == seenPlayers.end()) {
            allPlayers.push_back(player);
            seenPlayers.insert(player);
        }
    }

    int drawnCount = 0;
    for (void* player : allPlayers) {
        // Per-player guard keeps one bad entity from breaking the frame.
        if (SafeDrawPlayer(player, localPlayer)) {
            drawnCount++;
        }
    }

    s_FrameCounter++;
    if (s_FrameCounter % config::LOG_INTERVAL == 0) {
        DebugLog("[ESP] Players: fromList=%zu, fromBot=%zu, total=%zu, Drawn: %d\n",
                 playersFromList.size(), playersFromBot.size(), allPlayers.size(), drawnCount);
    }
}

void ESPRenderer::DrawPlayerESP(void* player, void* localPlayer) {
    if (!player) return;

    static int debugCounter = 0;
    bool shouldLog = (debugCounter++ % 600 == 0);

    // === Primary: Bounds/Hitbox ESP ===
    HitboxESPData hitbox = TransformHelper::GetHitboxData(player);

    if (hitbox.valid) {
        // Reject off-screen
        if (std::abs(hitbox.centerX) > 5000.f || std::abs(hitbox.centerY) > 5000.f) {
            if (shouldLog) DebugLog("[ESP] off-screen center (%.1f, %.1f)\n", hitbox.centerX, hitbox.centerY);
            return;
        }

        Vector2 center = { hitbox.centerX, hitbox.centerY };
        if (!CoordConverter::IsOnScreen(center, hitbox.width, hitbox.height)) return;

        if (shouldLog) {
            const char* methodName = (hitbox.method == 1) ? "Bounds" : "Hitbox";
            DebugLog("[ESP] %s: player=0x%p box=%.1fx%.1f center=(%.1f,%.1f) screen=%d\n",
                     methodName, player, hitbox.width, hitbox.height, hitbox.centerX, hitbox.centerY,
                     hitbox.validScreenCount);
        }

        ImVec4 color = GetPlayerColor(player, localPlayer);
        DrawBox(center, hitbox.width, hitbox.height, color, config::BOX_THICKNESS);
        return;
    }

    // === Fallback (characterContainer + fixed height) ===
    DrawPlayerESPFallback(player, localPlayer, shouldLog);
}

void ESPRenderer::DrawPlayerESPFallback(void* player, void* localPlayer, bool shouldLog) {
    Vector3 feetPos = TransformHelper::GetPlayerPosition(player);
    if (feetPos.x == 0.f && feetPos.y == 0.f && feetPos.z == 0.f) {
        if (shouldLog) DebugLog("[ESP] Fallback: GetPlayerPosition failed for 0x%p\n", player);
        return;
    }

    Vector3 headPos = feetPos;
    headPos.y += config::PLAYER_HEAD_HEIGHT;

    Vector2 screenFeet, screenHead;
    if (!CoordConverter::WorldToScreen(feetPos, &screenFeet)) return;
    if (!CoordConverter::WorldToScreen(headPos, &screenHead)) return;

    float topY = (std::min)(screenHead.y, screenFeet.y);
    float bottomY = (std::max)(screenHead.y, screenFeet.y);
    float boxHeight = bottomY - topY;
    if (boxHeight < 4.0f || boxHeight > 800.0f) return;

    float boxWidth = boxHeight * 0.42f;
    Vector2 center;
    center.x = (screenFeet.x + screenHead.x) * 0.5f;
    center.y = (topY + bottomY) * 0.5f;

    if (std::abs(center.x) > 5000.f || std::abs(center.y) > 5000.f) return;
    if (!CoordConverter::IsOnScreen(center, boxWidth, boxHeight)) return;

    if (shouldLog) {
        DebugLog("[ESP] Fallback: player=0x%p feet=(%.1f,%.1f) head=(%.1f,%.1f)\n",
                 player, screenFeet.x, screenFeet.y, screenHead.x, screenHead.y);
    }

    ImVec4 color = GetPlayerColor(player, localPlayer);
    DrawBox(center, boxWidth, boxHeight, color, config::BOX_THICKNESS);
}

void ESPRenderer::DrawBox(const Vector2& center, float w, float h, 
                          const ImVec4& color, float thickness) {
    ImDrawList* drawList = ImGui::GetBackgroundDrawList();
    
    ImVec2 p1(center.x - w/2, center.y - h/2);
    ImVec2 p2(center.x + w/2, center.y + h/2);
    
    ImU32 col = ImGui::ColorConvertFloat4ToU32(color);
    drawList->AddRect(p1, p2, col, 0.0f, 0, thickness);
}

ImVec4 ESPRenderer::GetPlayerColor(void* player, void* localPlayer) {
    if (!player) return ImVec4(1.0f, 1.0f, 1.0f, 1.0f);

    int playerTeam = GameManager::GetPlayerTeam(player);
    int localTeam = -1;

    if (localPlayer) {
        localTeam = GameManager::GetPlayerTeam(localPlayer);
    }

    // Compare teams to decide ally/enemy color.
    bool isEnemy = (playerTeam != localTeam);

    // Team enum: BlackList=0, GlobalRisk=1.


    if (isEnemy) {
        // Enemy colors.
        if (playerTeam == 0) {
            // BlackList enemy.
            return ImVec4(1.0f, 0.2f, 0.2f, 1.0f);
        } else if (playerTeam == 1) {
            // GlobalRisk enemy.
            return ImVec4(0.8f, 0.0f, 0.0f, 1.0f);
        } else {
            // Unknown enemy.
            return ImVec4(1.0f, 0.5f, 0.0f, 1.0f);
        }
    } else {
        // Ally colors.
        if (playerTeam == 0) {
            // BlackList ally.
            return ImVec4(0.2f, 0.4f, 1.0f, 1.0f);
        } else if (playerTeam == 1) {
            // GlobalRisk ally.
            return ImVec4(0.0f, 0.2f, 0.8f, 1.0f);
        } else {
            // Unknown ally.
            return ImVec4(0.0f, 0.8f, 0.8f, 1.0f);
        }
    }
}

namespace esp {

void* IL2CPPBridge::s_GameAssemblyBase = nullptr;
bool IL2CPPBridge::s_Initialized = false;
IL2CPPBridge::SingletonGetFn IL2CPPBridge::s_SingletonGet = nullptr;
void* IL2CPPBridge::s_CachedInstance = nullptr;

static bool ValidateArray(void* arrayPtr, int maxLength) {
    if (!arrayPtr || !IsValidPointer(arrayPtr)) return false;

    int length = -1;
    if (!SafeReadValue<int>((char*)arrayPtr + OffsetConstants::Arr_len, &length)) return false;
    if (length < 0 || length > maxLength) return false;
    if (length > 0) {
        void* first = nullptr;
        if (!SafeReadValue<void*>((char*)arrayPtr + OffsetConstants::Arr_data, &first)) return false;
    }
    return true;
}

static bool ValidateList(void* listPtr, int maxLength) {
    if (!listPtr || !IsValidPointer(listPtr)) return false;

    void* items = nullptr;
    int size = -1;
    if (!SafeReadValue<void*>((char*)listPtr + OffsetConstants::List_items, &items)) return false;
    if (!SafeReadValue<int>((char*)listPtr + OffsetConstants::List_size, &size)) return false;
    if (size < 0 || size > maxLength) return false;
    if (size > 0 && (!items || !ValidateArray(items, maxLength))) return false;
    return true;
}

bool IL2CPPBridge::ValidateGameManagerInstance(void* instance) {
    if (!instance || !IsValidPointer(instance)) return false;

    void* allPlayers = nullptr;
    void* playersBL = nullptr;
    void* playersGR = nullptr;
    if (!SafeReadValue<void*>((char*)instance + OffsetConstants::GM_allPlayers, &allPlayers)) return false;
    if (!SafeReadValue<void*>((char*)instance + OffsetConstants::GM_playersBL, &playersBL)) return false;
    if (!SafeReadValue<void*>((char*)instance + OffsetConstants::GM_playersGR, &playersGR)) return false;

    bool hasValidContainer = false;
    if (allPlayers) hasValidContainer = ValidateArray(allPlayers, 64) || hasValidContainer;
    if (playersBL) hasValidContainer = ValidateList(playersBL, 32) || hasValidContainer;
    if (playersGR) hasValidContainer = ValidateList(playersGR, 32) || hasValidContainer;

    return hasValidContainer;
}

bool IL2CPPBridge::Initialize(HMODULE gameAssembly) {
    if (s_Initialized) return true;

    if (!gameAssembly) {
        DebugLog("[IL2CPPBridge] ERROR: gameAssembly is null\n");
        return false;
    }

    s_GameAssemblyBase = (void*)gameAssembly;
    s_SingletonGet = (SingletonGetFn)((char*)gameAssembly + RVAConstants::SingletonGet);
    if (!IsExecutableAddress((void*)s_SingletonGet)) {
        DebugLog("[IL2CPPBridge] ERROR: SingletonGet address is not executable: 0x%p\n", s_SingletonGet);
        s_GameAssemblyBase = nullptr;
        s_SingletonGet = nullptr;
        return false;
    }

    s_Initialized = true;
    DebugLog("[IL2CPPBridge] Initialized successfully (Singleton method)\n");
    DebugLog("  GameAssembly: 0x%p\n", gameAssembly);
    DebugLog("  SingletonGet: 0x%p (RVA+0x%lX)\n", s_SingletonGet, RVAConstants::SingletonGet);

    void* methodInfoPtr = (void*)((char*)gameAssembly + RVAConstants::GM_Singleton_MethodInfo);
    DebugLog("  GM_Singleton_MethodInfo address: 0x%p\n", methodInfoPtr);

    void* methodInfo = nullptr;
    if (SafeReadValue<void*>(methodInfoPtr, &methodInfo)) {
        DebugLog("  GM_Singleton_MethodInfo content: 0x%p\n", methodInfo);
    }

    return true;
}

bool IL2CPPBridge::IsGameAssemblyReady() {
    if (!s_GameAssemblyBase) return false;
    HMODULE current = GetModuleHandleA("GameAssembly.dll");
    return current && (void*)current == s_GameAssemblyBase && IsExecutableAddress((void*)s_SingletonGet);
}

void IL2CPPBridge::ResetSessionState() {
    if (s_CachedInstance) {
        DebugLog("[IL2CPPBridge] Resetting cached GameManager instance: 0x%p\n", s_CachedInstance);
    }
    s_CachedInstance = nullptr;
}

static void* CallSingletonGet(IL2CPPBridge::SingletonGetFn fn, void* methodInfo) {
    if (!fn) return nullptr;
#if defined(_MSC_VER)
    __try {
        return fn(methodInfo);
    } __except(EXCEPTION_EXECUTE_HANDLER) {
        return nullptr;
    }
#else
    SAFE_TRY {
        return fn(methodInfo);
    } SAFE_EXCEPT_RET(nullptr)
#endif
}

void* IL2CPPBridge::TryGetGameManagerInstance() {
    if (!IsGameAssemblyReady()) {
        return nullptr;
    }

    static int retryCount = 0;
    const bool shouldLog = (retryCount++ % 120 == 0);
    if (shouldLog) {
        DebugLog("[IL2CPPBridge] Getting GameManager instance (retry %d)...\n", retryCount);
    }

    void* methodInfo = nullptr;
    void* methodInfoPtr = (void*)((char*)s_GameAssemblyBase + RVAConstants::GM_Singleton_MethodInfo);
    SafeReadValue<void*>(methodInfoPtr, &methodInfo);

    void* instance = nullptr;

    if (methodInfo && IsValidPointer(methodInfo)) {
        instance = CallSingletonGet(s_SingletonGet, methodInfo);
        if (shouldLog) {
            DebugLog("[IL2CPPBridge] [Method 1] SingletonGet(MI=0x%p) => 0x%p\n", methodInfo, instance);
        }
    }

    if (ValidateGameManagerInstance(instance)) {
        if (shouldLog) {
            DebugLog("[IL2CPPBridge] [OK] GameManager instance: 0x%p\n", instance);
        }
        return instance;
    }

    if (shouldLog) {
        DebugLog("[IL2CPPBridge] [X] GameManager not available yet (retry %d)\n", retryCount);
    }
    return nullptr;
}

void* IL2CPPBridge::GetGameManagerInstance() {
    if (s_CachedInstance) {
        if (ValidateGameManagerInstance(s_CachedInstance)) {
            return s_CachedInstance;
        }
        DebugLog("[IL2CPPBridge] Cached GM instance invalid, clearing cache\n");
        s_CachedInstance = nullptr;
    }

    void* instance = TryGetGameManagerInstance();
    if (instance) {
        s_CachedInstance = instance;
    }
    return instance;
}

}

#include "coord_converter.h"
#include "../stdafx.h"
#include <cmath>
#include <algorithm>

namespace esp {

// Function pointer types
// Component.get_transform: Transform*(Component*, MethodInfo*)
// Transform.get_position: void(Vector3* ret, Transform* transform, MethodInfo*)
typedef void* (__cdecl *GetTransformFn)(void* component, void* methodInfo);
typedef void (__cdecl *GetPositionFn)(void* result, void* transform, void* methodInfo);

static GetTransformFn s_GetTransformFunc = nullptr;
static GetPositionFn s_GetPositionFunc = nullptr;
TransformHelper::GetBoundsInjectedFn TransformHelper::s_GetBoundsFunc = nullptr;
bool TransformHelper::s_Initialized = false;

// Unity Bounds struct layout (24 bytes): m_Center(12) + m_Extents(12)
struct UnityBounds {
    Vector3 center;   // offset 0x00
    Vector3 extents;  // offset 0x0C
};

static void* SafeCallGetTransform(GetTransformFn fn, void* component) {
    if (!fn || !component) return nullptr;
#if defined(_MSC_VER)
    __try {
        return fn(component, nullptr);
    } __except(EXCEPTION_EXECUTE_HANDLER) {
        return nullptr;
    }
#else
    SAFE_TRY {
        return fn(component, nullptr);
    } SAFE_EXCEPT_RET(nullptr)
#endif
}

static bool SafeCallGetPosition(GetPositionFn fn, void* transform, Vector3* outPos) {
    if (!fn || !transform || !outPos) return false;
#if defined(_MSC_VER)
    __try {
        fn(outPos, transform, nullptr);
        return true;
    } __except(EXCEPTION_EXECUTE_HANDLER) {
        return false;
    }
#else
    SAFE_TRY {
        fn(outPos, transform, nullptr);
        return true;
    } SAFE_EXCEPT_RET(false)
#endif
}

static bool SafeCallGetBounds(TransformHelper::GetBoundsInjectedFn fn, void* collider, UnityBounds* outBounds) {
    if (!fn || !collider || !outBounds) return false;
#if defined(_MSC_VER)
    __try {
        fn(collider, outBounds, nullptr);
        return true;
    } __except(EXCEPTION_EXECUTE_HANDLER) {
        return false;
    }
#else
    SAFE_TRY {
        fn(collider, outBounds, nullptr);
        return true;
    } SAFE_EXCEPT_RET(false)
#endif
}

static bool IsSanePosition(const Vector3& pos) {
    if (std::abs(pos.x) < 0.001f && std::abs(pos.y) < 0.001f && std::abs(pos.z) < 0.001f) {
        return false;
    }
    if (std::abs(pos.x) > 1000.f || std::abs(pos.y) > 1000.f || std::abs(pos.z) > 1000.f) {
        return false;
    }
    if (std::abs(pos.x) > 500.f && std::abs(pos.y) < 0.001f && std::abs(pos.z) < 0.001f) {
        return false;
    }
    return true;
}

static void LogRejectedPosition(const char* source, const Vector3& pos) {
    static int rejectLogCounter = 0;
    if (rejectLogCounter++ % 120 == 0) {
        DebugLog("[TransformHelper] Rejected %s position: (%.2f, %.2f, %.2f)\n",
                 source ? source : "unknown", pos.x, pos.y, pos.z);
    }
}

bool TransformHelper::Initialize() {
    if (s_Initialized) return true;
    if (!IL2CPPBridge::IsInitialized()) {
        DebugLog("[TransformHelper] ERROR: IL2CPPBridge not initialized\n");
        return false;
    }

    void* gameAssemblyBase = IL2CPPBridge::GetBase();
    if (!gameAssemblyBase) {
        DebugLog("[TransformHelper] ERROR: GameAssembly base is null\n");
        return false;
    }

    // Get function addresses
    s_GetTransformFunc = (GetTransformFn)((char*)gameAssemblyBase + RVAConstants::Component_get_transform);
    s_GetPositionFunc = (GetPositionFn)((char*)gameAssemblyBase + RVAConstants::Transform_get_position);
    s_GetBoundsFunc = (GetBoundsInjectedFn)((char*)gameAssemblyBase + RVAConstants::Collider_get_bounds_Injected);

    if (!IsExecutableAddress((void*)s_GetTransformFunc) || !IsExecutableAddress((void*)s_GetPositionFunc)) {
        DebugLog("[TransformHelper] ERROR: transform function address is not executable\n");
        s_GetTransformFunc = nullptr;
        s_GetPositionFunc = nullptr;
        return false;
    }

    if (!IsExecutableAddress((void*)s_GetBoundsFunc)) {
        DebugLog("[TransformHelper] WARNING: get_bounds_Injected address is not executable, Bounds method disabled\n");
        s_GetBoundsFunc = nullptr;
    }

    DebugLog("[TransformHelper] get_transform func at 0x%p (RVA+0x%lX)\n",
             s_GetTransformFunc, RVAConstants::Component_get_transform);
    DebugLog("[TransformHelper] get_position func at 0x%p (RVA+0x%lX)\n",
             s_GetPositionFunc, RVAConstants::Transform_get_position);
    if (s_GetBoundsFunc) {
        DebugLog("[TransformHelper] get_bounds_Injected at 0x%p (RVA+0x%lX)\n",
                 s_GetBoundsFunc, RVAConstants::Collider_get_bounds_Injected);
    }

    s_Initialized = true;
    DebugLog("[TransformHelper] Initialized successfully\n");
    return true;
}

void* TransformHelper::GetTransform(void* player) {
    if (!s_GetTransformFunc || !player) return nullptr;
    if (!IsValidPointer(player)) {
        DebugLog("[TransformHelper] GetTransform: Invalid player pointer\n");
        return nullptr;
    }
    void* transform = SafeCallGetTransform(s_GetTransformFunc, player);
    if (transform && !IsValidPointer(transform)) {
        DebugLog("[TransformHelper] GetTransform returned invalid pointer: 0x%p\n", transform);
        return nullptr;
    }
    return transform;
}

Vector3 TransformHelper::GetPlayerPosition(void* player) {
    if (!player || !IsValidPointer(player)) return Vector3();

    void* container = nullptr;
    if (SafeReadValue<void*>((char*)player + OffsetConstants::P_characterContainer, &container)
        && container && IsValidPointer(container)) {
        Vector3 pos = GetPosition(container);
        if (IsSanePosition(pos)) {
            return pos;
        }
        LogRejectedPosition("characterContainer", pos);
    }

    void* transform = GetTransform(player);
    if (transform) {
        Vector3 pos = GetPosition(transform);
        if (IsSanePosition(pos)) {
            return pos;
        }
        LogRejectedPosition("transform", pos);
    }

    return Vector3();
}

Vector3 TransformHelper::GetPosition(void* transform) {
    if (!s_GetPositionFunc || !transform) return Vector3();
    if (!IsValidPointer(transform)) {
        DebugLog("[TransformHelper] GetPosition: Invalid transform pointer\n");
        return Vector3();
    }
    Vector3 result;
    if (SafeCallGetPosition(s_GetPositionFunc, transform, &result)) {
        return result;
    }
    return Vector3();
}

// ============================================================================
// Primary method: CharacterController Bounds
// Uses Entity.characterController (offset 0x2C) -> Collider.get_bounds_Injected
// Returns 8 corner points of the AABB in world space, projected to screen
// ============================================================================
HitboxESPData TransformHelper::GetBoundsData(void* player) {
    HitboxESPData data = {};
    data.valid = false;
    data.method = 0;
    data.validScreenCount = 0;
    data.left = 99999.f;
    data.right = -99999.f;
    data.top = 99999.f;
    data.bottom = -99999.f;

    if (!s_GetBoundsFunc || !player || !IsValidPointer(player)) return data;

    // Step 1: Read CharacterController from Entity+0x2C
    void* controller = nullptr;
    if (!SafeReadValue<void*>((char*)player + OffsetConstants::E_characterController, &controller)
        || !controller || !IsValidPointer(controller)) {
        return data;
    }

    // Step 2: Call Collider.get_bounds_Injected(controller, &bounds, nullptr)
    UnityBounds bounds;
    memset(&bounds, 0, sizeof(bounds));
    if (!SafeCallGetBounds(s_GetBoundsFunc, controller, &bounds)) {
        return data;
    }

    // Step 3: Validate bounds data
    // extents should be positive and reasonable (character size ~0.3-2.0m)
    if (bounds.extents.x < 0.01f || bounds.extents.y < 0.01f || bounds.extents.z < 0.01f) {
        return data;
    }
    if (bounds.extents.x > 10.f || bounds.extents.y > 10.f || bounds.extents.z > 10.f) {
        return data;
    }
    if (!IsSanePosition(bounds.center)) {
        return data;
    }

    // Step 4: Calculate 8 corner points of the AABB
    // min = center - extents, max = center + extents
    Vector3 bmin, bmax;
    bmin.x = bounds.center.x - bounds.extents.x;
    bmin.y = bounds.center.y - bounds.extents.y;
    bmin.z = bounds.center.z - bounds.extents.z;
    bmax.x = bounds.center.x + bounds.extents.x;
    bmax.y = bounds.center.y + bounds.extents.y;
    bmax.z = bounds.center.z + bounds.extents.z;

    // 8 corners of the AABB
    Vector3 corners[8] = {
        {bmin.x, bmin.y, bmin.z},
        {bmax.x, bmin.y, bmin.z},
        {bmin.x, bmax.y, bmin.z},
        {bmax.x, bmax.y, bmin.z},
        {bmin.x, bmin.y, bmax.z},
        {bmax.x, bmin.y, bmax.z},
        {bmin.x, bmax.y, bmax.z},
        {bmax.x, bmax.y, bmax.z},
    };

    // Step 5: Project all 8 corners to screen space
    int screenCount = 0;
    for (int i = 0; i < 8; i++) {
        Vector2 screen;
        if (CoordConverter::WorldToScreen(corners[i], &screen)) {
            data.left = (std::min)(data.left, screen.x);
            data.right = (std::max)(data.right, screen.x);
            data.top = (std::min)(data.top, screen.y);
            data.bottom = (std::max)(data.bottom, screen.y);
            screenCount++;
        }
    }

    data.validScreenCount = screenCount;

    if (screenCount < 2 || data.left >= data.right || data.top >= data.bottom) {
        return data;
    }

    // Step 6: Calculate final box
    data.width = data.right - data.left;
    data.height = data.bottom - data.top;
    data.centerX = (data.left + data.right) * 0.5f;
    data.centerY = (data.top + data.bottom) * 0.5f;

    // Handle too-narrow boxes
    if (data.width < data.height * 0.30f) {
        data.width = data.height * 0.40f;
    }

    // Validate final box size
    if (data.width > config::BOX_MAX_WIDTH || data.height > config::BOX_MAX_HEIGHT) {
        return data;
    }
    float aspect = data.width / data.height;
    if (aspect < config::BOX_MIN_ASPECT || aspect > config::BOX_MAX_ASPECT) {
        return data;
    }
    if (data.height < 4.0f) {
        return data;
    }

    data.valid = true;
    data.method = 1;
    return data;
}

// ============================================================================
// Fallback method: hitbox transforms (original method, used when Bounds fails)
// ============================================================================
HitboxESPData TransformHelper::GetHitboxFallbackData(void* player) {
    HitboxESPData data = {};
    data.valid = false;
    data.method = 0;
    data.validScreenCount = 0;
    data.left = 99999.f;
    data.right = -99999.f;
    data.top = 99999.f;
    data.bottom = -99999.f;

    if (!player || !IsValidPointer(player)) return data;

    static int diagCounter = 0;
    int diagIdx = diagCounter++;
    bool shouldDiag = (diagIdx < 3) || (diagIdx % 600 == 0);

    // Get currentCharacter
    void* currentCharacter = nullptr;
    if (!SafeReadValue<void*>((char*)player + OffsetConstants::P_currentCharacter, &currentCharacter)
        || !currentCharacter || !IsValidPointer(currentCharacter)) {
        return data;
    }

    // Get player reference position for outlier filtering
    Vector3 refPos = Vector3();
    bool hasRefPos = false;
    void* container = nullptr;
    if (SafeReadValue<void*>((char*)player + OffsetConstants::P_characterContainer, &container)
        && container && IsValidPointer(container)) {
        refPos = GetPosition(container);
        hasRefPos = IsSanePosition(refPos);
    }

    // Helper lambda to add a transform point
    auto addTransformPoint = [&](uintptr_t offset) -> bool {
        void* tf = nullptr;
        if (SafeReadValue<void*>((char*)currentCharacter + offset, &tf)
            && tf && IsValidPointer(tf)) {
            Vector3 world = GetPosition(tf);
            if (IsSanePosition(world)) {
                if (hasRefPos) {
                    float dx = world.x - refPos.x;
                    float dy = world.y - refPos.y;
                    float dz = world.z - refPos.z;
                    if (dx*dx + dy*dy + dz*dz > config::HITBOX_MAX_REF_DIST_SQ) {
                        return false;
                    }
                }
                Vector2 screen;
                if (CoordConverter::WorldToScreen(world, &screen)) {
                    data.left = (std::min)(data.left, screen.x);
                    data.right = (std::max)(data.right, screen.x);
                    data.top = (std::min)(data.top, screen.y);
                    data.bottom = (std::max)(data.bottom, screen.y);
                    data.validScreenCount++;
                    return true;
                }
            }
        }
        return false;
    };

    // Get hitboxes array (Transform[] at +0x74)
    void* hitboxesArr = nullptr;
    if (SafeReadValue<void*>((char*)currentCharacter + OffsetConstants::CM_hitboxes, &hitboxesArr)
        && hitboxesArr && IsValidPointer(hitboxesArr)) {
        int count = 0;
        if (SafeReadValue<int>((char*)hitboxesArr + OffsetConstants::Arr_len, &count)
            && count > 0 && count <= 64) {
            for (int i = 0; i < count; i++) {
                void* tf = nullptr;
                if (!SafeReadValue<void*>((char*)hitboxesArr + OffsetConstants::Arr_data + i * sizeof(void*), &tf)
                    || !tf || !IsValidPointer(tf)) {
                    continue;
                }
                Vector3 world = GetPosition(tf);
                if (!IsSanePosition(world)) continue;
                if (hasRefPos) {
                    float dx = world.x - refPos.x;
                    float dy = world.y - refPos.y;
                    float dz = world.z - refPos.z;
                    if (dx*dx + dy*dy + dz*dz > config::HITBOX_MAX_REF_DIST_SQ) {
                        continue;
                    }
                }
                Vector2 screen;
                if (!CoordConverter::WorldToScreen(world, &screen)) continue;
                data.validScreenCount++;
                data.left = (std::min)(data.left, screen.x);
                data.right = (std::max)(data.right, screen.x);
                data.top = (std::min)(data.top, screen.y);
                data.bottom = (std::max)(data.bottom, screen.y);
            }
        }
    }

    // Add neck/spine/spine1 as supplement points
    addTransformPoint(OffsetConstants::CM_neck);
    addTransformPoint(OffsetConstants::CM_spine);
    addTransformPoint(OffsetConstants::CM_spine1);

    // Add helmet collider
    void* helmet = nullptr;
    if (SafeReadValue<void*>((char*)currentCharacter + OffsetConstants::CM_helmet, &helmet)
        && helmet && IsValidPointer(helmet)) {
        void* helmetCollider = nullptr;
        if (SafeReadValue<void*>((char*)helmet + OffsetConstants::Helmet_collider, &helmetCollider)
            && helmetCollider && IsValidPointer(helmetCollider)) {
            void* helmetTf = GetTransform(helmetCollider);
            if (helmetTf && IsValidPointer(helmetTf)) {
                Vector3 world = GetPosition(helmetTf);
                if (IsSanePosition(world)) {
                    bool tooFar = false;
                    if (hasRefPos) {
                        float dx = world.x - refPos.x;
                        float dy = world.y - refPos.y;
                        float dz = world.z - refPos.z;
                        tooFar = (dx*dx + dy*dy + dz*dz > config::HITBOX_MAX_REF_DIST_SQ);
                    }
                    if (!tooFar) {
                        Vector2 screen;
                        if (CoordConverter::WorldToScreen(world, &screen)) {
                            data.left = (std::min)(data.left, screen.x);
                            data.right = (std::max)(data.right, screen.x);
                            data.top = (std::min)(data.top, screen.y);
                            data.bottom = (std::max)(data.bottom, screen.y);
                            data.validScreenCount++;
                        }
                    }
                }
            }
        }
    }

    if (data.validScreenCount < 2 || data.left >= data.right || data.top >= data.bottom) {
        return data;
    }

    data.width = data.right - data.left;
    data.height = data.bottom - data.top;
    data.centerX = (data.left + data.right) * 0.5f;
    data.centerY = (data.top + data.bottom) * 0.5f;

    if (data.width < data.height * 0.30f) {
        data.width = data.height * 0.40f;
    }

    if (data.width > config::BOX_MAX_WIDTH || data.height > config::BOX_MAX_HEIGHT) {
        if (shouldDiag) DebugLog("[HitboxFallback] player=0x%p box too large: %.1fx%.1f\n", player, data.width, data.height);
        return data;
    }
    float aspect = data.width / data.height;
    if (aspect < config::BOX_MIN_ASPECT || aspect > config::BOX_MAX_ASPECT) {
        return data;
    }
    if (data.height < 4.0f) {
        return data;
    }

    data.valid = true;
    data.method = 2;

    if (shouldDiag) {
        DebugLog("[HitboxFallback] player=0x%p screen=%d box=%.1fx%.1f\n",
                 player, data.validScreenCount, data.width, data.height);
    }

    return data;
}

// ============================================================================
// Main entry: try Bounds first, fallback to hitbox
// ============================================================================
HitboxESPData TransformHelper::GetHitboxData(void* player) {
    static int diagCounter = 0;
    int diagIdx = diagCounter++;
    bool shouldDiag = (diagIdx < 5) || (diagIdx % 600 == 0);

    // Primary: CharacterController Bounds
    if (s_GetBoundsFunc) {
        HitboxESPData data = GetBoundsData(player);
        if (data.valid) {
            if (shouldDiag) {
                DebugLog("[ESPData] player=0x%p method=Bounds box=%.1fx%.1f center=(%.1f,%.1f)\n",
                         player, data.width, data.height, data.centerX, data.centerY);
            }
            return data;
        }
    }

    // Fallback: hitbox transforms
    HitboxESPData data = GetHitboxFallbackData(player);
    if (data.valid && shouldDiag) {
        DebugLog("[ESPData] player=0x%p method=Hitbox box=%.1fx%.1f center=(%.1f,%.1f)\n",
                 player, data.width, data.height, data.centerX, data.centerY);
    }
    return data;
}
