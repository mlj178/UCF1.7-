</style></head><body><header class="top"><h1>10 · 跳过回合代码解读</h1><div class="tabs" id="tabs"></div><div class="actions"><a href="../index.html">功能目录</a><button id="copy">复制源码</button></div></header><section class="summary"><strong>解决的问题：</strong>把当前 ModeBase.restGameTime 的分钟和秒写成 0:00，让游戏沿原生超时流程结束当前回合。整合版会先暂停“无限时间”1秒，避免两个功能互相覆盖。</section><div class="workspace"><main class="code"><div class="code-head"><span class="file" id="file"></span><span class="count" id="count"></span><div class="source-meta" id="meta"></div><div class="legend"><span class="legend-item"><span class="swatch address"></span>蓝：定位地址</span><span class="legend-item"><span class="swatch hook"></span>红：安装或恢复 Hook</span><span class="legend-item"><span class="swatch effect"></span>绿：改变游戏行为</span><span class="legend-item"><span class="swatch risk"></span>橙：风险或副作用</span></div></div><nav class="section-strip"><span class="section-strip-title">完整代码导航</span><div class="section-tabs" id="sectionTabs"></div></nav><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><div class="toast" id="toast"></div><script type="text/plain" id="src-release">// round_skip.js - 回合跳过 (Round Skip)
// 将 ModeBase.restGameTime 设为 0:00 触发回合结束
// 冲突处理: 写入 0:00 前调用 timeModule.pauseFor(1000) 暂停无限时间 1 秒

modules.roundskip = (function() {
  var modeBaseInstance = null;
  var skipCount = 0, skipErrorCount = 0, roundActive = false, currentRound = 0;
  var inHook = false, skipGuard = false;
  var hooks = [];

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function addLog(level, message) { sendLog(level, '回合跳过', message); }

  function isValidInstance(instance) {
    try { if (!instance || instance.equals(ptr(0))) return false; if (instance.compare(ptr(0x10000)) < 0) return false; instance.readU8(); return true; } catch (e) { return false; }
  }

  function skipRound() {
    if (skipGuard) return { ok: false, reason: 'guard_active' };
    var instance = modeBaseInstance;
    if (!isValidInstance(instance)) { skipErrorCount++; return { ok: false, reason: 'no_instance' }; }
    var minute = 0, second = 0;
    try { minute = instance.add(0x34).readS32(); second = instance.add(0x38).readS32(); } catch (e) { return { ok: false, reason: 'read_failed' }; }
    if (minute === 0 && second === 0) return { ok: false, reason: 'already_zero' };
    try {
      skipGuard = true;
      try { if (modules.time) modules.time.pauseFor(1000); } catch(e) {}
      instance.add(0x34).writeS32(0); instance.add(0x38).writeS32(0);
      skipCount++; roundActive = false;
      addLog('info', 'SKIP! ' + minute + ':' + pad2(second) + ' -> 0:00 (total:' + skipCount + ')');
      send({ type: 'round_skipped', from: minute + ':' + pad2(second), count: skipCount });
      skipGuard = false;
      return { ok: true };
    } catch (e) { skipGuard = false; skipErrorCount++; return { ok: false, reason: 'write_failed' }; }
  }

  function installHooks() {
    var mod = getGameAssembly();
    if (!mod) { addLog('error', '无 GameAssembly.dll'); return false; }
    var base = mod.base;
    try { var h1 = Interceptor.attach(base.add(0xAF6930), { onEnter: function(args) { if (inHook) return; inHook = true; var instance = args[0]; if (!isValidInstance(instance)) { inHook = false; return; } if (!modeBaseInstance || !instance.equals(modeBaseInstance)) { modeBaseInstance = instance; try { currentRound = instance.add(0x14).readS32(); } catch(e) {} roundActive = true; addLog('info', '新回合 #' + currentRound); } inHook = false; }, onLeave: function(retval) { inHook = false; } }); hooks.push(h1); } catch(e) {}
    try { var h2 = Interceptor.attach(base.add(0xAFAA40), { onEnter: function() { addLog('info', 'GameRoundEnd'); modeBaseInstance = null; roundActive = false; } }); hooks.push(h2); } catch(e) {}
    try { var h3 = Interceptor.attach(base.add(0xAF1920), { onEnter: function() { addLog('info', 'OnTimeOut'); roundActive = false; } }); hooks.push(h3); } catch(e) {}
    return true;
  }

  return {
    enable: function() { if (hooks.length > 0) return; installHooks(); },
    disable: function() { for (var i = 0; i < hooks.length; i++) { try { hooks[i].detach(); } catch(e) {} } hooks = []; modeBaseInstance = null; roundActive = false; addLog('info', '已卸载'); },
    skipround: function() { var result = skipRound(); return { ok: result.ok, reason: result.reason }; },
    getstatus: function() {
      var timeStr = null;
      if (isValidInstance(modeBaseInstance)) { try { var m = modeBaseInstance.add(0x34).readS32(); var s = modeBaseInstance.add(0x38).readS32(); if (m >= 0 && m <= 200 && s >= 0 && s <= 59) timeStr = m + ":" + pad2(s); } catch(e) {} }
      return { ok: true, roundActive: roundActive, currentRound: currentRound, skipCount: skipCount, skipErrorCount: skipErrorCount, hasInstance: !!modeBaseInstance, restGameTime: timeStr };
    },
    reset: function() { modeBaseInstance = null; roundActive = false; currentRound = 0; skipCount = 0; skipErrorCount = 0; skipGuard = false; inHook = false; return { ok: true }; }
  };
})();
</script><script type="text/plain" id="src-main">// skip_round.js - 全模式通用回合跳过脚本
// 原理：将 ModeBase.restGameTime 设为 0:00，所有模式时间耗尽都会触发原生结束流程
// 适用：生化模式 / 团队竞技 / 个人竞技 / 特殊战
// 不需要模式检测，所有模式共用同一策略

console.log("[*] === Skip Round Script ===\n");

var gameAssembly = Process.findModuleByName("GameAssembly.dll");
if (!gameAssembly) {
    console.log("[-] GameAssembly.dll not found!");
}

var base = gameAssembly ? gameAssembly.base : ptr(0);

var state = {
    modeBaseInstance: null,
    skipCount: 0,
    skipErrorCount: 0,
    roundActive: false,
    currentRound: 0,

    // 防重入：防止 Hook 回调自递归导致卡死
    inHook: false,
    skipGuard: false,

    hookCounts: {
        updateTimeUI: 0,
        checkRoundOver: 0,
        gameRoundEnd: 0,
        onTimeOut: 0
    },

    rpcReady: false,
    scriptLog: null
};

function pad2(n) { return n < 10 ? "0" + n : "" + n; }

function log(level, message) {
    var ts = new Date();
    var timestamp = ts.getFullYear() + "-" + pad2(ts.getMonth()+1) + "-" + pad2(ts.getDate()) +
        " " + pad2(ts.getHours()) + ":" + pad2(ts.getMinutes()) + ":" + pad2(ts.getSeconds());
    var prefixMap = {"INFO": "[+]", "WARN": "[!]", "ERROR": "[-]", "DEBUG": "[*]", "ACTION": "[>]"};
    var prefix = prefixMap[level] || "[*]";
    var line = timestamp + " " + prefix + " " + message;
    console.log(line);
    if (state.scriptLog) {
        try { state.scriptLog.write(line + "\n"); state.scriptLog.flush(); } catch (e) {}
    }
}

function openLogFile() {
    try {
        var logPath = "D:\\trae_project\\skip_round_log.txt";
        state.scriptLog = new File(logPath, "w");
        state.scriptLog.write("=== Skip Round Script Log ===\n");
        state.scriptLog.write("Start: " + new Date().toISOString() + "\n");
        state.scriptLog.write("Base: " + base + "\n\n");
        state.scriptLog.flush();
        log("INFO", "Log: " + logPath);
    } catch (e) {
        console.log("[-] Log file error: " + e);
    }
}

function sendToUI(type, data) {
    var payload = { type: type };
    for (var key in data) payload[key] = data[key];
    send(payload);
}

function isValidInstance(instance) {
    try {
        if (!instance || instance.equals(ptr(0))) return false;
        if (instance.compare(ptr(0x10000)) < 0) return false;
        instance.readU8();
        return true;
    } catch (e) {
        return false;
    }
}

// ============================================
// 核心：跳过当前回合
// 全模式通用策略：restGameTime = 0:00
// ============================================
function skipRound() {
    if (state.skipGuard) {
        log("WARN", "skipGuard active, skipping");
        return { ok: false, reason: "guard_active" };
    }

    var instance = state.modeBaseInstance;
    if (!isValidInstance(instance)) {
        state.skipErrorCount++;
        log("ERROR", "skipRound: no valid instance (err:" + state.skipErrorCount + ")");
        return { ok: false, reason: "no_instance" };
    }

    var minute = 0, second = 0;
    try {
        minute = instance.add(0x34).readS32();
        second = instance.add(0x38).readS32();
    } catch (e) {
        state.skipErrorCount++;
        log("ERROR", "skipRound: read failed (err:" + state.skipErrorCount + ")");
        return { ok: false, reason: "read_failed" };
    }

    if (minute === 0 && second === 0) {
        log("WARN", "skipRound: time already 0:00");
        return { ok: false, reason: "already_zero" };
    }

    try {
        state.skipGuard = true;
        instance.add(0x34).writeS32(0);
        instance.add(0x38).writeS32(0);
        state.skipCount++;
        state.roundActive = false;
        log("ACTION", "SKIP! " + minute + ":" + pad2(second) + " -> 0:00 (total:" + state.skipCount + ")");
        sendToUI("round_skipped", { from: minute + ":" + pad2(second), count: state.skipCount });
        state.skipGuard = false;
        return { ok: true };
    } catch (e) {
        state.skipGuard = false;
        state.skipErrorCount++;
        log("ERROR", "skipRound: write failed " + e + " (err:" + state.skipErrorCount + ")");
        return { ok: false, reason: "write_failed" };
    }
}

// ============================================
// Hook
// ============================================

function installHooks() {
    log("INFO", "Installing hooks...");
    log("INFO", "Base: " + base);
    sendToUI("status", { message: "Installing hooks..." });

    // Hook 1: ModeBase.UpdateTimeUI - 获取 ModeBase 实例
    // RVA: 0xAF6930
    log("DEBUG", "Hooking ModeBase.UpdateTimeUI at 0xAF6930...");
    try {
        Interceptor.attach(base.add(0xAF6930), {
            onEnter: function(args) {
                if (state.inHook) return;
                state.inHook = true;

                state.hookCounts.updateTimeUI++;
                var instance = args[0];
                if (!isValidInstance(instance)) { state.inHook = false; return; }

                var isNew = !state.modeBaseInstance || !instance.equals(state.modeBaseInstance);
                if (isNew) {
                    state.modeBaseInstance = instance;
                    try { state.currentRound = instance.add(0x14).readS32(); } catch(e) {}
                    state.roundActive = true;
                    log("DEBUG", "New instance, Round=" + state.currentRound);
                }

                state.inHook = false;
            },
            onLeave: function(retval) { state.inHook = false; }
        });
        log("INFO", "Hooked UpdateTimeUI (0xAF6930)");
    } catch (e) {
        log("ERROR", "Hook UpdateTimeUI failed: " + e);
    }

    // Hook 2: GameManager.GameRoundEnd - 回合结束清理
    // RVA: 0xAFAA40
    log("DEBUG", "Hooking GameManager.GameRoundEnd at 0xAFAA40...");
    try {
        Interceptor.attach(base.add(0xAFAA40), {
            onEnter: function(args) {
                state.hookCounts.gameRoundEnd++;
                log("INFO", "GameRoundEnd(#" + state.hookCounts.gameRoundEnd + ")");
                sendToUI("round_end", { count: state.hookCounts.gameRoundEnd });
                state.modeBaseInstance = null;
                state.roundActive = false;
            },
            onLeave: function(retval) {}
        });
        log("INFO", "Hooked GameRoundEnd (0xAFAA40)");
    } catch (e) {
        log("ERROR", "Hook GameRoundEnd failed: " + e);
    }

    // Hook 3: ModeBase.OnTimeOut - 监控超时
    // RVA: 0xAF1920
    log("DEBUG", "Hooking ModeBase.OnTimeOut at 0xAF1920...");
    try {
        Interceptor.attach(base.add(0xAF1920), {
            onEnter: function(args) {
                state.hookCounts.onTimeOut++;
                log("INFO", "OnTimeOut(#" + state.hookCounts.onTimeOut + ")");
                sendToUI("timeout", { count: state.hookCounts.onTimeOut });
                state.roundActive = false;
            },
            onLeave: function(retval) {}
        });
        log("INFO", "Hooked OnTimeOut (0xAF1920)");
    } catch (e) {
        log("ERROR", "Hook OnTimeOut failed: " + e);
    }

    state.rpcReady = true;
    log("INFO", "All hooks installed");
    sendToUI("ready", { message: "Hooks installed" });
}

// ============================================
// RPC
// ============================================

rpc.exports = {

    install: function() {
        log("INFO", "RPC: install()");
        if (!gameAssembly) return { ok: false, error: "GameAssembly.dll not found" };
        if (state.rpcReady) return { ok: true, message: "Already installed" };
        try { openLogFile(); installHooks(); return { ok: true, message: "Hooks installed" }; }
        catch (e) { log("ERROR", "install: " + e); return { ok: false, error: String(e) }; }
    },

    skipround: function() {
        log("INFO", "RPC: skipround()");
        var result = skipRound();
        return { ok: result.ok, reason: result.reason };
    },

    getstatus: function() {
        var timeStr = null;
        if (isValidInstance(state.modeBaseInstance)) {
            try {
                var m = state.modeBaseInstance.add(0x34).readS32();
                var s = state.modeBaseInstance.add(0x38).readS32();
                if (m >= 0 && m <= 200 && s >= 0 && s <= 59) timeStr = m + ":" + pad2(s);
            } catch(e) {}
        }
        return {
            ok: true,
            connected: !!gameAssembly,
            rpcReady: state.rpcReady,
            roundActive: state.roundActive,
            currentRound: state.currentRound,
            skipCount: state.skipCount,
            skipErrorCount: state.skipErrorCount,
            hasInstance: !!state.modeBaseInstance,
            restGameTime: timeStr
        };
    },

    reset: function() {
        log("INFO", "RPC: reset()");
        state.modeBaseInstance = null;
        state.roundActive = false;
        state.currentRound = 0;
        state.skipCount = 0;
        state.skipErrorCount = 0;
        state.skipGuard = false;
        state.inHook = false;
        for (var k in state.hookCounts) state.hookCounts[k] = 0;
        return { ok: true };
    }
};

console.log("\n========================================");
console.log("  Skip Round Script (全模式通用)");
console.log("  生化 / 团队 / 个人 / 特殊战 均可用");
console.log("========================================");
if (gameAssembly) {
    console.log("[+] Base: " + gameAssembly.base);
    console.log("[+] RPC: install, skipround, getstatus, reset");
} else {
    console.log("[-] GameAssembly.dll not found");
}
console.log("[*] Use Python UI to control this script\n");
