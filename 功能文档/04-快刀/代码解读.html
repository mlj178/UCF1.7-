em"><span class="highlight-swatch address"></span>蓝：定位地址</span><span class="highlight-legend-item"><span class="highlight-swatch hook"></span>红：安装或恢复 Hook</span><span class="highlight-legend-item"><span class="highlight-swatch effect"></span>绿：改变游戏行为</span><span class="highlight-legend-item"><span class="highlight-swatch risk"></span>橙：风险或副作用</span></div></div><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><script type="text/plain" id="src-release">// knife.js - 快刀模块 v16 (NativeCallback Replace)
// 替换 PlayerWeapons.get_KnifeSpeed，为本地玩家返回指定的速度倍数

modules.knife = (function() {
  var enabled = false;
  var currentSpeed = 5.0;
  var isMyPlayer = null;
  var originalGetKnifeSpeed = null;
  var getKnifeSpeedAddr = null;
  var logCount = 0;

  return {
    setSpeed: function(speed) {
      currentSpeed = speed;
      if (enabled) {
        sendLog('info', '快刀', '速度已切换: ' + speed + 'x（实时生效）');
      } else {
        sendLog('info', '快刀', '速度已预选: ' + speed + 'x（开启后生效）');
      }
    },
    enable: function() {
      if (enabled) return;
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '快刀', '无 GameAssembly.dll'); return; }

      var base = mod.base;
      var isMyPlayerAddr = base.add(0xB55FD0);
      getKnifeSpeedAddr = base.add(0xB170A0);

      sendLog('info', '快刀', 'isMyPlayer @ ' + isMyPlayerAddr);
      sendLog('info', '快刀', 'get_KnifeSpeed @ ' + getKnifeSpeedAddr);

      isMyPlayer = new NativeFunction(isMyPlayerAddr, 'bool', ['pointer']);
      originalGetKnifeSpeed = new NativeFunction(getKnifeSpeedAddr, 'float', ['pointer']);

      logCount = 0;

      Interceptor.replace(getKnifeSpeedAddr, new NativeCallback(function(self) {
        try {
          var owner = self.add(0x8).readPointer();
          if (!owner || owner.isNull()) {
            return originalGetKnifeSpeed(self);
          }

          if (isMyPlayer(owner)) {
            logCount++;
            if (logCount <= 10) {
              sendLog('info', '快刀', '[KnifeSpeed] Player detected, returning ' + currentSpeed);
            }
            return currentSpeed;
          }

          return originalGetKnifeSpeed(self);
        } catch(e) {
          sendLog('error', '快刀', 'Error: ' + e.message);
          return originalGetKnifeSpeed(self);
        }
      }, 'float', ['pointer']));

      enabled = true;
      sendLog('success', '快刀', '已启用 (v16, Speed=' + currentSpeed + 'x) — 仅对玩家生效');
      sendStatus('knife', true);
    },
    disable: function() {
      if (!enabled) return;
      if (getKnifeSpeedAddr) {
        try { Interceptor.revert(getKnifeSpeedAddr); } catch(e) {}
      }
      isMyPlayer = null;
      originalGetKnifeSpeed = null;
      getKnifeSpeedAddr = null;
      enabled = false;
      sendLog('info', '快刀', '已禁用');
      sendStatus('knife', false);
    }
  };
})();</script>
<script type="text/plain" id="src-main">// speed_knife_v16.js - 方案5修复版：使用 NativeCallback 替换 get_KnifeSpeed
// 直接替换函数实现

(function() {
    var SPEED = 10.0;

    console.log("[*] SPEED KNIFE V16 (NativeCallback Replace)");

    var mod = Process.findModuleByName("GameAssembly.dll");
    if (!mod) {
        console.log("[-] GameAssembly.dll not found!");
        return;
    }

    var base = mod.base;

    // Player.get_isMyPlayer (RVA 0xB55FD0)
    var isMyPlayerAddr = base.add(0xB55FD0);
    var isMyPlayer = new NativeFunction(isMyPlayerAddr, "bool", ["pointer"]);

    // 获取原始的 get_KnifeSpeed 函数
    var getKnifeSpeedAddr = base.add(0xB170A0);
    var originalGetKnifeSpeed = new NativeFunction(getKnifeSpeedAddr, "float", ["pointer"]);

    console.log("[+] isMyPlayer @ " + isMyPlayerAddr);
    console.log("[+] get_KnifeSpeed @ " + getKnifeSpeedAddr);

    var logCount = 0;

    // 替换 get_KnifeSpeed 实现
    Interceptor.replace(getKnifeSpeedAddr, new NativeCallback(function(self) {
        try {
            // PlayerWeapons + 0x8 = owner (Player)
            var owner = self.add(0x8).readPointer();
            if (!owner || owner.isNull()) {
                return originalGetKnifeSpeed(self);
            }

            // 判断是否是本地玩家
            if (isMyPlayer(owner)) {
                logCount++;
                if (logCount <= 10) {
                    console.log("[KnifeSpeed] Player detected, returning " + SPEED);
                }
                return SPEED;
            }

            // 不是本地玩家，调用原始函数
            return originalGetKnifeSpeed(self);
        } catch(e) {
            console.log("[ERROR] " + e.message);
            return originalGetKnifeSpeed(self);
        }
    }, "float", ["pointer"]));

    console.log("[+] V16 Loaded. All knife attacks accelerated (Player Only)!");
    console.log("[+] Speed: " + SPEED + "x");
    console.log("[*] 挥刀测试...");

})();</script><script>(function () {

      button.setAttribute('aria-selected', index === activeSource ? 'true' : 'false');
      button.onclick = function () {
        activeSource = index;
        activeSection = 0;
        render();
      };
      tabs.appendChild(button);
    });

    document.getElementById('file').textContent = definition.file;
    document.getElementById('count').textContent = lines.length + ' 行';
    var meta = sourceMeta[definition.id];
    document.getElementById('meta').innerHTML = '<strong>文档生成时间：</strong>' + generatedAt + '　<strong>源码修改时间：</strong>' + meta.modified + '　<strong>文件大小：</strong>' + meta.size + ' bytes<br><strong>SHA-256：</strong><code>' + meta.hash + '</code><span class="sync-note">此指纹对应当前解读版本；JS 更新后哈希会变化。</span>';
    code.innerHTML = '';
    definition.sections.forEach(function (section, index) {
      var element = document.createElement('section');
      element.className = 'block';
      var html = '<div class="label">' + escapeHtml(section.title) + ' · L' + section.start + '-' + Math.min(section.end, lines.length) + '</div>';
      for (var lineNumber = section.start; lineNumber <= Math.min(section.end, lines.length); lineNumber++) {
        var addressNote = (addressNotes[definition.id] || {})[lineNumber];
        var addressNoteHtml = addressNote ? '<span class="address-note ' + addressNote.type + '">' + escapeHtml(addressNote.label) + '</span>' : '';
        var criticalType = (criticalLineStyles[definition.id] || {})[lineNumber];
        var criticalClass = criticalType ? ' key-line key-' + criticalType : '';
        html += '<div class="line' + criticalClass + '"><span class="no">' + lineNumber + '</span><span class="txt">' + escapeHtml(lines[lineNumber - 1] || ' ') + addressNoteHtml + '</span></div>';
      }
      element.innerHTML = html;
      element.onclick = function () { select(index); };
      code.appendChild(element);
    });
    select(0);
  }

  function select(index) {
    activeSection = index;
    document.querySelectorAll('.block').forEach(function (element, blockIndex) {
      element.classList.toggle('active', blockIndex === index);
    });
    var section = defs[activeSource].sections[index];
    document.getElementById('cat').textContent = section.category;
    document.getElementById('title').textContent = section.title;
    var definition = defs[activeSource];
    var business = (businessDetails[definition.id] || {})[section.id] || { scene: '这一段主要负责脚本控制或诊断。', original: ['游戏按原逻辑运行。'], modified: ['脚本维护状态或输出信息。'], result: '没有直接修改具体游戏对象。' };
    var lineRefs = (businessLineRefs[definition.id] || {})[section.id] || [];
    function renderBusinessPath(items, finalType, refs) {
      return items.map(function (item, itemIndex) {
        var type = itemIndex === items.length - 1 && finalType ? finalType : 'original';
        var ref = refs && refs[itemIndex] ? '<span class="logic-line-ref">' + escapeHtml(refs[itemIndex]) + '</span>' : '';
        return '<div class="business-step ' + type + '">' + escapeHtml(item) + ref + '</div>' + (itemIndex < items.length - 1 ? '<div class="business-arrow">↓</div>' : '');
      }).join('');
    }
    var originalPath = renderBusinessPath(business.original, 'hook', []);
    var modifiedPath = renderBusinessPath(business.modified, 'modify', lineRefs);
    document.getElementById('body').innerHTML =
      '<div class="card business-card"><h3>业务流程对应</h3><p class="business-scene"><strong>游戏场景：</strong>' + escapeHtml(business.scene) + '</p>' +
      '<p class="eyebrow">原始游戏逻辑</p><div class="business-path">' + originalPath + '</div>' +
      '<p class="eyebrow">修改后游戏逻辑</p><div class="business-path">' + modifiedPath + '</div>' +
      '<p class="business-result"><strong>游戏表现：</strong>' + escapeHtml(business.result) + '</p></div>';
  }

  document.getElementById('copy').onclick = function () {
    var button = this;
    var text = defs[activeSource].text;
    var copy = navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject();
    copy.then(function () { button.textContent = '已复制'; }, function () { button.textContent = '复制失败'; });
    setTimeout(function () { button.textContent = '复制源码'; }, 1200);
  };

  render();
})();
</script></body></html>
