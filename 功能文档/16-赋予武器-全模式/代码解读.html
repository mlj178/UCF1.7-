#fff;border-left:1px solid #d8dee2}.eyebrow{margin:10px 0 6px;color:#28715f;font-size:12px;font-weight:700}.explain h2{margin:3px 0 13px;font-size:20px}.card{margin:11px 0;padding:14px;background:#f7f9fa;border:1px solid #d8dee2;border-radius:6px}.card h3{margin:0 0 8px;font-size:14px}.business-card{border-left:4px solid #39779f}.business-scene{margin:0 0 12px;color:#34414b}.business-path{display:grid}.business-step{padding:8px 10px;border:1px solid;border-radius:5px}.business-step.original{color:#1f5b80;background:#edf5fa;border-color:#b8d1e0}.business-step.hook{color:#8f3030;background:#fbeeee;border-color:#e0b6b6}.business-step.modify{color:#17634f;background:#e9f5f0;border-color:#afd2c6}.business-arrow{height:20px;text-align:center;color:#74808a;font-weight:800}.business-result{margin:12px 0 0;padding:9px 10px;color:#73420f;background:#fff3e3;border-left:3px solid #bd742c}.logic-line-ref{float:right;margin-left:10px;padding:1px 6px;color:#17634f;background:#d7ede5;border:1px solid #9bc9ba;border-radius:4px;font:700 11px Consolas,monospace}.address-note.gather,.address-note.gravity,.address-note.time{color:#9fd5f3;background:#17384c;border-color:#397da5}.address-note.transform{color:#ffd18d;background:#49331a;border-color:#a97634}.address-note.bot{color:#ffb3b3;background:#492425;border-color:#a95357}.address-note.aim,.address-note.hp,.address-note.weapon{color:#9fd5f3;background:#17384c;border-color:#397da5}.address-note.risk{color:#ffd18d;background:#49331a;border-color:#a97634}</style></head><body><header class="top"><h1>16 · 赋予武器-全模式代码解读</h1><div class="tabs" id="tabs"></div><div class="actions"><a href="../index.html">功能目录</a><button id="copy">复制源码</button></div></header><section class="summary"><strong>解决的问题：</strong>绕过正常拾取、购买或武器箱流程，取得本地 Player 后在 ModeBase.Update 主线程中调用 GameManager.GiveWeapon；同时处理死亡、复活和离开房间。</section><div class="workspace"><main class="code"><div class="code-head"><span id="file"></span><span id="count"></span><div class="source-meta" id="meta"></div><div class="code-highlight-legend"><span class="highlight-legend-item"><span class="highlight-swatch address"></span>蓝：定位地址</span><span class="highlight-legend-item"><span class="highlight-swatch hook"></span>红：安装或恢复 Hook</span><span class="highlight-legend-item"><span class="highlight-swatch effect"></span>绿：改变游戏行为</span><span class="highlight-legend-item"><span class="highlight-swatch risk"></span>橙：风险或依赖</span></div></div><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><script type="text/plain" id="src-release">// weapon_giver.js - 武器赋予（主线程调度）
// 核心功能：赋予武器、复活自动装备武器
// 关键技术：Hook ModeBase.Update实现主线程调度（GiveWeapon必须在主线程执行）

modules.weapon_giver = (function() {
  var enabled = false;
  var hooks = [];

  var RVA = {
    GameManager_TypeInfo: 0x0E2933C,
    ModeBase_TypeInfo: 0x0E2CC54,
    GiveWeapon: 0xAFB390,
    GetWpnName: 0xAFB1F0,
    ModeBase_Update: 0xAF6A00,
    ModeBase_ExitGame: 0xAEE850,
    GameManager_GameRoundEnd: 0xAFAA40,
    GameManager_OnDestroy: 0xAFB6F0,
    Player_OnEntityDeath: 0xB51210,
    Player_OnDestroy: 0xB511C0,
    Player_Spawn: 0xB53760,
    Entity_get_isDead: 0xB400E0,
    Player_get_isMyPlayer: 0xB55FD0,
  };

  var OFF = {
    Klass_staticFields: 0x5C,
    GM_myPlayer: 0x00,
  };

  var _giveWeaponFunc = null;
  var _isDeadFunc = null;
  var _isMyPlayerFunc = null;
  var _initialized = false;
  var _hookInstalled = false;
  var _respawnHookInstalled = false;
  var _spawnHookInstalled = false;

  var _pendingTasks = [];
  var _taskIdCounter = 0;
  var _taskTtlMs = 5000;

  var _isPlayerDead = false;
  var _lastCheckFrame = 0;
  var _cachedMyPlayer = null;
  var _checkAliveInterval = 30;
  var _waitingForRespawnWeaponId = null;
  var _waitingForRespawnWeaponName = null;
  var _modeBaseInstance = null;  // 当前ModeBase实例（用于检测模式切换）
  var _lastModeUpdateTime = 0;
  var _modeSwitchGraceUntil = 0;
  var _roomActiveWindowMs = 1200;
  var _modeSwitchGraceMs = 800;
  var _roomShuttingDown = false;
  var _exitingModeBaseInstance = null;
  var _specialDoubleGiveWeaponIds = {
    2978: true,
    3494: true
  };
  var _firstRoomSpecialGiveDoneByWeaponId = {};

  function isSpecialDoubleGiveWeapon(wpnId) {
    return _specialDoubleGiveWeaponIds[wpnId] === true;
  }

  function resetFirstRoomSpecialGiveState() {
    _firstRoomSpecialGiveDoneByWeaponId = {};
  }

  function resetRoomState(reason, shuttingDown, exitingInstance) {
    _roomShuttingDown = shuttingDown === true;
    _exitingModeBaseInstance = _roomShuttingDown && exitingInstance ? exitingInstance : null;
    _modeBaseInstance = null;
    _pendingTasks = [];
    _cachedMyPlayer = null;
    _isPlayerDead = false;
    _lastCheckFrame = 0;
    _lastModeUpdateTime = 0;
    _modeSwitchGraceUntil = Date.now() + _modeSwitchGraceMs;
    if (_roomShuttingDown) {
      resetFirstRoomSpecialGiveState();
    }
    try {
      if (modules.speedgun && modules.speedgun.clearRoomState) {
        modules.speedgun.clearRoomState(_roomShuttingDown, _exitingModeBaseInstance);
      }
    } catch(e) {}
    if (reason) {
      sendLog('info', '武器赋予', reason);
    }
  }

  function isRoomActive() {
    var now = Date.now();
    if (_roomShuttingDown) return false;
    if (!_modeBaseInstance) return false;
    if (now < _modeSwitchGraceUntil) return false;
    return _lastModeUpdateTime > 0 && (now - _lastModeUpdateTime) <= _roomActiveWindowMs;
  }

  function notifySpeedgunWeaponAcquired(weapon) {
    try {
      if (!weapon || weapon.isNull()) return;
      if (!modules.speedgun || !modules.speedgun.notifyWeaponAcquired) return;
      modules.speedgun.notifyWeaponAcquired(weapon);
    } catch(e) {
      sendLog('warn', '武器赋予', '联动射速失败: ' + e.message);
    }
  }

  function rollbackHooks(startIndex) {
    while (hooks.length > startIndex) {
      var hook = hooks.pop();
      try { hook.detach(); } catch(e) {}
    }
  }

  function readPtr(addr) {
    try {
      if (!addr || addr.isNull()) return null;
      var v = addr.readPointer();
      return (v && !v.isNull()) ? v : null;
    } catch(e) {
      return null;
    }
  }

  function initNativeFunctions() {
    if (_initialized) return true;

    var mod = getGameAssembly();
    if (!mod) {
      sendLog('error', '武器赋予', '无法获取 GameAssembly.dll');
      return false;
    }
    var base = mod.base;

    try {
      _giveWeaponFunc = new NativeFunction(
        base.add(RVA.GiveWeapon),
        'pointer',
        ['pointer', 'int', 'int', 'int', 'pointer'],
        'mscdecl'
      );
      _isDeadFunc = new NativeFunction(
        base.add(RVA.Entity_get_isDead),
        'int',
        ['pointer', 'pointer'],
        'mscdecl'
      );
      _isMyPlayerFunc = new NativeFunction(
        base.add(RVA.Player_get_isMyPlayer),
        'int',
        ['pointer', 'pointer'],
        'mscdecl'
      );
      sendLog('success', '武器赋予', 'GiveWeapon NativeFunction 初始化成功 (mscdecl)');
    } catch(e) {
      sendLog('error', '武器赋予', 'GiveWeapon 直接调用初始化失败: ' + e.message);
      _giveWeaponFunc = null;
      _isDeadFunc = null;
      _isMyPlayerFunc = null;
      return false;
    }

    _initialized = true;
    return true;
  }

  function getMyPlayer() {
    try {
      var mod = getGameAssembly();
      if (!mod) return null;
      var base = mod.base;

      var typeInfoSlot = base.add(RVA.GameManager_TypeInfo);
      var klass = readPtr(typeInfoSlot);
      if (!klass) return null;

      var staticFields = readPtr(klass.add(OFF.Klass_staticFields));
      if (!staticFields) return null;

      var myPlayer = readPtr(staticFields.add(OFF.GM_myPlayer));
      if (!myPlayer) return null;

      return myPlayer;

    } catch(e) {
      sendLog('error', '武器赋予', '获取玩家异常: ' + e.message);
      return null;
    }
  }

  function checkGameManagerInit() {
    try {
      var mod = getGameAssembly();
      if (!mod) return false;

      var typeInfoSlot = mod.base.add(RVA.GameManager_TypeInfo);
      var klass = readPtr(typeInfoSlot);
      if (!klass) return false;

      var staticFields = readPtr(klass.add(OFF.Klass_staticFields));
      if (!staticFields) return false;

      return true;

    } catch(e) {
      return false;
    }
  }

  function isPlayerDead(player) {
    try {
      if (!_isDeadFunc || !player || player.isNull()) return true;
      var result = _isDeadFunc(player, ptr(0));
      return result !== 0;
    } catch(e) {
      return true;
    }
  }

  function isPlayerValid(player) {
    /**检查玩家实例是否有效
     * 1. 地址不为null且在合理范围内
     * 2. 地址可读
     * 3. 玩家未死亡
     */
    try {
      // 检查地址是否有效
      if (!player || player.isNull()) {
        return false;
      }
      
      // 检查地址是否在合理范围内（避免访问无效内存）
      if (player.compare(ptr(0x10000)) < 0) {
        return false;
      }
      
      // 尝试读取地址（检查是否可读）
      player.readU8();

      // IDA: Player.wpns 位于 +0xA0，GiveWeapon 内部会立即访问它。
      var playerWeapons = readPtr(player.add(0xA0));
      if (!playerWeapons) {
        return false;
      }

      if (!isMyPlayer(player)) {
        return false;
      }
      
      // 检查玩家是否已死亡
      if (isPlayerDead(player)) {
        return false;
      }
      
      return true;
    } catch(e) {
      return false;
    }
  }

  function isMyPlayer(player) {
    try {
      if (!_isMyPlayerFunc || !player || player.isNull()) return false;
      var result = _isMyPlayerFunc(player, ptr(0));
      return result !== 0;
    } catch(e) {
      return false;
    }
  }

  function executeGiveWeaponOnMainThread(wpnId, giveUpInt, selectInt) {
    if (!isRoomActive()) {
      sendLog('warn', '武器赋予', '当前不在稳定房间内，已忽略赋予任务');
      return false;
    }

    var myPlayer = getMyPlayer();
    if (!myPlayer) {
      sendLog('error', '武器赋予', '主线程: 无法获取玩家实例');
      return false;
    }
    
    // 检查玩家实例有效性
    if (!isPlayerValid(myPlayer)) {
      sendLog('error', '武器赋予', '主线程: 玩家实例无效（可能已死亡或地址无效）');
      return false;
    }

    if (!_giveWeaponFunc) {
      sendLog('error', '武器赋予', 'GiveWeapon函数未初始化');
      return false;
    }

    try {
      // 与 HUD_Cheat / HUD_ChatBox 的游戏内部调用完全一致：
      // GiveWeapon(player, weaponId, false, autoSelect, NULL)
      var weapon = _giveWeaponFunc(myPlayer, wpnId, 0, selectInt, ptr(0));
      if (!weapon || weapon.isNull()) {
        sendLog('error', '武器赋予', 'GiveWeapon返回null，weaponId=' + wpnId);
        return false;
      }

      notifySpeedgunWeaponAcquired(weapon);
      sendLog('success', '武器赋予', '赋予武器成功! weaponId=' + wpnId);
      return true;
    } catch(e) {
      _giveWeaponFunc = null;
      _isDeadFunc = null;
      _isMyPlayerFunc = null;
      _initialized = false;
      sendLog('error', '武器赋予', 'GiveWeapon直接调用异常: ' + e.message);
      return false;
    }
  }

  function handleModeBaseUpdate(instance) {
    if (!instance || instance.isNull()) return false;

    var now = Date.now();
    if (_roomShuttingDown) {
      if (_exitingModeBaseInstance && instance.equals(_exitingModeBaseInstance)) {
        return false;
      }
      _roomShuttingDown = false;
      _exitingModeBaseInstance = null;
      _modeSwitchGraceUntil = now + _modeSwitchGraceMs;
    }

    if (!_modeBaseInstance) {
      _modeBaseInstance = instance;
      _lastCheckFrame = 0;
      _modeSwitchGraceUntil = now + _modeSwitchGraceMs;
      sendLog('info', '武器赋予', '检测到ModeBase实例: ' + instance);
    } else if (!instance.equals(_modeBaseInstance)) {
      _modeBaseInstance = instance;
      resetFirstRoomSpecialGiveState();
      _pendingTasks = [];
      _cachedMyPlayer = null;
      _isPlayerDead = false;
      _lastCheckFrame = 0;
      _modeSwitchGraceUntil = now + _modeSwitchGraceMs;
      sendLog('info', '武器赋予', '检测到新ModeBase实例，已清理旧任务和旧玩家缓存: ' + instance);
    }

    _lastModeUpdateTime = now;
    return now >= _modeSwitchGraceUntil;
  }

  function installMainThreadHook() {
    if (_hookInstalled) return true;

    var mod = getGameAssembly();
    if (!mod) {
      sendLog('error', '武器赋予', '无法获取 GameAssembly.dll');
      return false;
    }

    var updateAddr = mod.base.add(RVA.ModeBase_Update);
    var hookStartIndex = hooks.length;

    try {
      // Hook ModeBase.Update（主线程调度）
      hooks.push(Interceptor.attach(updateAddr, {
        onEnter: function(args) {
          try {
            var instance = args[0];
            var roomStable = handleModeBaseUpdate(instance);
            
            var currentFrame = _lastCheckFrame + 1;
            _lastCheckFrame = currentFrame;

            // 限制每帧最多处理1个任务，避免阻塞游戏主线程
            if (roomStable && _pendingTasks.length > 0) {
              var task = _pendingTasks.shift();
              try {
                if (task.expiresAt && Date.now() > task.expiresAt) {
                  send({
                    type: 'giveWeaponResult',
                    taskId: task.id,
                    success: false
                  });
                  sendLog('warn', '武器赋予', '赋予任务已过期，已丢弃: taskId=' + task.id);
                } else {
                  var result = executeGiveWeaponOnMainThread(task.wpnId, task.giveUp, task.select);

                  send({
                    type: 'giveWeaponResult',
                    taskId: task.id,
                    success: result
                  });
                }
              } catch(e) {
                sendLog('error', '武器赋予', '执行赋予任务异常: ' + e.message);
                send({
                  type: 'giveWeaponResult',
                  taskId: task.id,
                  success: false
                });
              }
            }

            if (roomStable && _cachedMyPlayer && currentFrame % _checkAliveInterval === 0) {
              try {
                checkPlayerRespawn();
              } catch(e) {
                sendLog('error', '武器赋予', '检查玩家复活异常: ' + e.message);
              }
            }
          } catch(e) {
            sendLog('error', '武器赋予', 'ModeBase.Update Hook 异常: ' + e.message);
          }
        }
      }));

      // 回合结束只清理缓存，不进入退出状态。
      hooks.push(Interceptor.attach(mod.base.add(RVA.GameManager_GameRoundEnd), {
        onEnter: function() {
          resetRoomState('检测到回合结束，已清空赋予任务和玩家缓存', false, null);
        }
      }));

      // 退出房间开始时立即封锁全部旧指针和新任务。
      hooks.push(Interceptor.attach(mod.base.add(RVA.ModeBase_ExitGame), {
        onEnter: function(args) {
          resetRoomState('检测到退出房间，已停止武器赋予', true, args[0]);
        }
      }));

      // 场景销毁的最终保险。
      hooks.push(Interceptor.attach(mod.base.add(RVA.GameManager_OnDestroy), {
        onEnter: function() {
          resetRoomState('检测到游戏场景销毁，已清理武器状态', true, _modeBaseInstance);
        }
      }));

      _hookInstalled = true;
      sendLog('success', '武器赋予', '主线程调度及退出清理 Hook 安装成功');
      return true;

    } catch(e) {
      rollbackHooks(hookStartIndex);
      sendLog('error', '武器赋予', 'Hook 安装失败: ' + e.message);
      return false;
    }
  }

  function checkPlayerRespawn() {
    if (!isRoomActive()) return;
    if (!_cachedMyPlayer) return;

    var currentDead = isPlayerDead(_cachedMyPlayer);

    if (_isPlayerDead && !currentDead) {
      sendLog('success', '武器赋予', '检测到玩家复活!');
      _isPlayerDead = false;

      try {
        send({ type: 'playerRespawned' });
      } catch(e) {
        sendLog('error', '武器赋予', '发送复活事件失败: ' + e.message);
      }
    } else if (!_isPlayerDead && currentDead) {
      sendLog('info', '武器赋予', '检测到玩家死亡');
      _isPlayerDead = true;
    }
  }

  function installRespawnHook() {
    if (_respawnHookInstalled) return true;

    var mod = getGameAssembly();
    if (!mod) {
      sendLog('error', '武器赋予', '无法获取 GameAssembly.dll');
      return false;
    }

    var deathAddr = mod.base.add(RVA.Player_OnEntityDeath);
    var hookStartIndex = hooks.length;

    try {
      hooks.push(Interceptor.attach(deathAddr, {
        onEnter: function(args) {
          try {
            if (_roomShuttingDown || !isRoomActive()) return;
            var player = args[0];
            var myPlayer = getMyPlayer();

            if (player && myPlayer && player.equals(myPlayer)) {
              sendLog('info', '武器赋予', '检测到本地玩家死亡');
              _isPlayerDead = true;
              _cachedMyPlayer = player;
            }
          } catch(e) {
            sendLog('error', '武器赋予', 'OnEntityDeath Hook 异常: ' + e.message);
          }
        }
      }));

      hooks.push(Interceptor.attach(mod.base.add(RVA.Player_OnDestroy), {
        onEnter: function(args) {
          try {
            var player = args[0];
            if (_cachedMyPlayer && player && player.equals(_cachedMyPlayer)) {
              _pendingTasks = [];
              _cachedMyPlayer = null;
              _isPlayerDead = false;
              try {
                if (modules.speedgun && modules.speedgun.clearRoomState) {
                  modules.speedgun.clearRoomState(_roomShuttingDown, _exitingModeBaseInstance);
                }
              } catch(e) {}
            }
          } catch(e) {
            _cachedMyPlayer = null;
            _pendingTasks = [];
          }
        }
      }));

      _respawnHookInstalled = true;
      sendLog('success', '武器赋予', 'Player.OnEntityDeath Hook 安装成功');

      var myPlayer = isRoomActive() ? getMyPlayer() : null;
      if (myPlayer && isPlayerValid(myPlayer)) {
        _cachedMyPlayer = myPlayer;
        _isPlayerDead = isPlayerDead(myPlayer);
      }

      return true;

    } catch (e) {
      rollbackHooks(hookStartIndex);
      sendLog('error', '武器赋予', 'Hook 安装失败: ' + e.message);
      return false;
    }
  }

  function installSpawnHook() {
    if (_spawnHookInstalled) return true;

    var mod = getGameAssembly();
    if (!mod) {
      sendLog('error', '武器赋予', '无法获取 GameAssembly.dll');
      return false;
    }

    var spawnAddr = mod.base.add(RVA.Player_Spawn);
    var hookStartIndex = hooks.length;

    try {
      hooks.push(Interceptor.attach(spawnAddr, {
        onEnter: function(args) {
          this.player = args[0];
        },
        onLeave: function() {
          try {
            if (_roomShuttingDown || !isRoomActive()) return;
            var player = this.player;
            var myPlayer = getMyPlayer();

            if (player && myPlayer && player.equals(myPlayer)) {
              sendLog('info', '武器赋予', '检测到本地玩家复活');
              _isPlayerDead = false;
              _cachedMyPlayer = player;

              if (_waitingForRespawnWeaponId !== null) {
                sendLog('success', '武器赋予', '检测到复活，准备自动赋予武器: ' + _waitingForRespawnWeaponId);

                try {
                  if (initNativeFunctions() && installMainThreadHook()) {
                    var taskId = ++_taskIdCounter;
                    _pendingTasks.push({
                      id: taskId,
                      wpnId: parseInt(_waitingForRespawnWeaponId) || 0,
                      giveUp: 1,
                      select: 1,
                      expiresAt: Date.now() + _taskTtlMs
                    });
                    sendLog('success', '武器赋予', '复活自动赋予任务已入队: taskId=' + taskId + ', weaponId=' + _waitingForRespawnWeaponId);
                  } else {
                    sendLog('error', '武器赋予', '复活自动赋予失败: 初始化未完成');
                  }

                  send({
                    type: 'playerRespawnedWithWeapon',
                    weaponId: _waitingForRespawnWeaponId,
                    weaponName: _waitingForRespawnWeaponName
                  });
                } catch(e) {
                  sendLog('error', '武器赋予', '复活自动赋予异常: ' + e.message);
                }
              } else {
                send({ type: 'playerRespawned' });
              }
            }
          } catch(e) {
            sendLog('error', '武器赋予', 'Spawn Hook 异常: ' + e.message);
          }
        }
      }));

      _spawnHookInstalled = true;
      sendLog('success', '武器赋予', 'Player.Spawn Hook 安装成功');

      return true;

    } catch (e) {
      rollbackHooks(hookStartIndex);
      sendLog('error', '武器赋予', 'Hook 安装失败: ' + e.message);
      return false;
    }
  }

  function giveWeapon(weaponIndex, autoGiveUp, autoSelect) {
    try {
      if (_roomShuttingDown) {
        sendLog('warn', '武器赋予', '正在退出房间，已忽略赋予请求');
        return false;
      }

      var wpnId = parseInt(weaponIndex) || 0;
      var giveUpInt = (autoGiveUp === true || autoGiveUp === 1 || autoGiveUp === 'true') ? 1 : 0;
      var selectInt = (autoSelect === true || autoSelect === 1 || autoSelect === 'true') ? 1 : 0;

      if (!initNativeFunctions()) {
        sendLog('error', '武器赋予', 'NativeFunction 初始化失败');
        return false;
      }

      if (!checkGameManagerInit()) {
        sendLog('error', '武器赋予', 'GameManager 未初始化!请确保已进入游戏房间');
        return false;
      }

      if (!installMainThreadHook()) {
        sendLog('error', '武器赋予', '主线程 Hook 安装失败');
        return false;
      }

      if (!installRespawnHook()) {
        sendLog('warn', '武器赋予', '复活 Hook 安装失败，但功能可用');
      }

      if (!installSpawnHook()) {
        sendLog('warn', '武器赋予', 'Spawn Hook 安装失败，但功能可用');
      }

      var repeatCount = 1;
      if (isSpecialDoubleGiveWeapon(wpnId) && !_firstRoomSpecialGiveDoneByWeaponId[wpnId]) {
        repeatCount = 2;
        _firstRoomSpecialGiveDoneByWeaponId[wpnId] = true;
      }

      var firstTaskId = null;
      for (var i = 0; i < repeatCount; i++) {
        var taskId = ++_taskIdCounter;
        if (firstTaskId === null) firstTaskId = taskId;
        _pendingTasks.push({
          id: taskId,
          wpnId: wpnId,
          giveUp: giveUpInt,
          select: selectInt,
          expiresAt: Date.now() + _taskTtlMs
        });
      }

      if (repeatCount > 1) {
        sendLog('info', '武器赋予', '首次进入房间特殊武器，已入队2次赋予任务: weaponId=' + wpnId + ', firstTaskId=' + firstTaskId);
      } else {
        sendLog('info', '武器赋予', '任务已入队: taskId=' + firstTaskId + '，等待主线程执行...');
      }

      return 'pending:' + firstTaskId;

    } catch(e) {
      sendLog('error', '武器赋予', '异常: ' + e.message);
      return false;
    }
  }

  return {
    enable: function() {
      if (enabled) return;
      resetRoomState(null, false, null);
      enabled = true;
      sendLog('success', '武器赋予', '武器赋予功能已启用');
      sendStatus('weapon_giver', true);
    },
    disable: function() {
      for (var i = 0; i < hooks.length; i++) {
        try { hooks[i].detach(); } catch(e) {}
      }
      hooks = [];
      _hookInstalled = false;
      _respawnHookInstalled = false;
      _spawnHookInstalled = false;
      resetRoomState(null, true, _modeBaseInstance);
      _giveWeaponFunc = null;
      _isDeadFunc = null;
      _isMyPlayerFunc = null;
      _initialized = false;
      enabled = false;
      sendLog('info', '武器赋予', '武器赋予功能已禁用');
      sendStatus('weapon_giver', false);
    },
    giveweapon: giveWeapon,
    getmyplayer: getMyPlayer,
    setrespawnweapon: function(weaponId, weaponName) {
      try {
        _waitingForRespawnWeaponId = weaponId;
        _waitingForRespawnWeaponName = weaponName;
        sendLog('success', '武器赋予', '设置复活自动武器: ' + weaponId + ' - ' + weaponName);
        return true;
      } catch (e) {
        sendLog('error', '武器赋予', '设置复活武器失败: ' + e.message);
        return false;
      }
    },
    clearrespawnweapon: function() {
      try {
        _waitingForRespawnWeaponId = null;
        _waitingForRespawnWeaponName = null;
        sendLog('info', '武器赋予', '清除复活自动武器');
        return true;
      } catch (e) {
        sendLog('error', '武器赋予', '清除复活武器失败: ' + e.message);
        return false;
      }
    },
    isEnabled: function() { return enabled; }
  };
})();
</script><script type="text/plain" id="src-main">// ============================================================
// weapon-hero-giver-fixed-v2.js - 武器赋予脚本（修复版v6）
//
// 修复历史:
//   v2: 使用有效的 MethodInfo 指针
//   v3: 改用直接原生调用，但缺少 cdecl 声明导致崩溃
//   v4: 修复 ABI 名称 cdecl->mscdecl，但仍然 access violation 0x8
//   v5: 根因修复 - GiveWeapon 必须在游戏主线程执行
//       原因: GiveWeapon 内部调用 Unity API（Instantiate/GetComponent）
//       这些 API 只能在主线程调用，Frida RPC 运行在独立线程
//       方案: Hook ModeBase$$Update（主线程每帧调用），通过任务队列
//       将 GiveWeapon 调度到主线程执行
//   v6: 添加复活自动恢复武器功能
//
// IDA确认的函数签名:
//   Weapon_o *__cdecl GameManager__GiveWeapon(
//       Player_o *player, int32_t weaponIndex,
//       bool autoGiveUp, bool autoSelect,
//       const MethodInfo *method)
//   void __cdecl ModeBase__Update(
//       ModeBase_o *__this, const MethodInfo *method)
// ============================================================

(function() {
  'use strict';

  var MAX_LOGS_PER_MODULE = 100;
  var moduleLogCounts = {};

  function log(level, module, message) {
    if (!moduleLogCounts[module]) moduleLogCounts[module] = 0;
    if (moduleLogCounts[module] >= MAX_LOGS_PER_MODULE) return;
    moduleLogCounts[module]++;
    var fullMsg = '[' + module + '] ' + message;
    console.log('[' + level + '] ' + fullMsg);
    try {
      send({ type: 'log', level: level, module: module, message: message });
    } catch(e) {}
  }

  var _gameAssembly = null;

  function getGameAssembly() {
    if (_gameAssembly) return _gameAssembly;
    try {
      var mod = Process.findModuleByName('GameAssembly.dll');
      if (!mod) {
        log('error', '系统', '未找到 GameAssembly.dll');
        return null;
      }
      _gameAssembly = mod;
      log('success', '系统', 'GameAssembly.dll 基址: ' + mod.base);
      return mod;
    } catch(e) {
      log('error', '系统', '获取模块失败: ' + e.message);
      return null;
    }
  }

  var RVA = {
    GameManager_TypeInfo: 0x0E2933C,
    ModeBase_TypeInfo: 0x0E2CC54,
    GiveWeapon: 0xAFB390,
    GetWpnName: 0xAFB1F0,
    ModeBase_Update: 0xAF6A00,
    Player_OnEntityDeath: 0xB51210,
    Player_Spawn: 0xB53760,
    Entity_get_isDead: 0xB400E0,
    Player_get_isMyPlayer: 0xB55FD0,
};

  var OFF = {
    Klass_staticFields: 0x5C,
    GM_myPlayer: 0x00,
  };

  function readPtr(addr) {
    try {
      if (!addr || addr.isNull()) return null;
      var v = addr.readPointer();
      return (v && !v.isNull()) ? v : null;
    } catch(e) {
      return null;
    }
  }

  var _giveWeaponFunc = null;
  var _il2cpp_runtime_invoke = null;
  var _giveWeaponMethodInfo = null;
  var _initialized = false;
  var _hookInstalled = false;
  var _respawnHookInstalled = false;
  var _spawnHookInstalled = false;

  var _pendingTasks = [];
  var _taskResults = {};
  var _taskIdCounter = 0;

  var _isPlayerDead = false;
  var _lastCheckFrame = 0;
  var _cachedMyPlayer = null;
  var _checkAliveInterval = 30;
  var _waitingForRespawnWeaponId = null;
  var _waitingForRespawnWeaponName = null;

  function getGameManagerKlass() {
    try {
      var mod = getGameAssembly();
      if (!mod) return null;
      var typeInfoSlot = mod.base.add(RVA.GameManager_TypeInfo);
      return readPtr(typeInfoSlot);
    } catch(e) {
      log('error', 'MethodInfo', '获取GameManager klass失败: ' + e.message);
      return null;
    }
  }

  function getGiveWeaponMethodInfo() {
    if (_giveWeaponMethodInfo) return _giveWeaponMethodInfo;

    var mod = getGameAssembly();
    if (!mod) return null;

    var klass = getGameManagerKlass();
    if (!klass) {
      log('error', 'MethodInfo', '无法获取GameManager klass');
      return null;
    }

    try {
      var exportAddr = mod.getExportByName('il2cpp_class_get_method_from_name');
      if (!exportAddr) {
        log('error', 'MethodInfo', '未找到il2cpp_class_get_method_from_name导出');
        return null;
      }

      var getClassMethod = new NativeFunction(exportAddr, 'pointer', ['pointer', 'pointer', 'uint32']);
      var methodName = Memory.allocUtf8String('GiveWeapon');
      var methodInfo = getClassMethod(klass, methodName, 4);

      if (methodInfo && !methodInfo.isNull()) {
        _giveWeaponMethodInfo = methodInfo;
        log('success', 'MethodInfo', '成功获取GiveWeapon MethodInfo: ' + methodInfo);
        return methodInfo;
      }

      log('error', 'MethodInfo', 'il2cpp_class_get_method_from_name返回null');
      return null;

    } catch(e) {
      log('error', 'MethodInfo', '获取MethodInfo失败: ' + e.message);
      return null;
    }
  }

  function initNativeFunctions() {
    if (_initialized) return true;

    var mod = getGameAssembly();
    if (!mod) {
      log('error', 'Init', '无法获取 GameAssembly.dll');
      return false;
    }
    var base = mod.base;

    try {
      var exportInvoke = mod.getExportByName('il2cpp_runtime_invoke');
      if (!exportInvoke) {
        log('error', 'Init', '未找到 il2cpp_runtime_invoke');
        return false;
      }
      _il2cpp_runtime_invoke = new NativeFunction(
        exportInvoke,
        'pointer',
        ['pointer', 'pointer', 'pointer', 'pointer']
      );
      log('success', 'Init', 'il2cpp_runtime_invoke 初始化成功');
    } catch(e) {
      log('error', 'Init', 'il2cpp_runtime_invoke 初始化失败: ' + e.message);
      return false;
    }

    try {
      _giveWeaponFunc = new NativeFunction(
        base.add(RVA.GiveWeapon),
        'pointer',
        ['pointer', 'int', 'int', 'int', 'pointer'],
        'mscdecl'
      );
      log('success', 'Init', 'GiveWeapon NativeFunction 初始化成功 (mscdecl)');
    } catch(e) {
      log('warn', 'Init', 'GiveWeapon 直接调用初始化失败: ' + e.message);
      _giveWeaponFunc = null;
    }

    _initialized = true;
    return true;
  }

  function getMyPlayer() {
    try {
      var mod = getGameAssembly();
      if (!mod) return null;
      var base = mod.base;

      var typeInfoSlot = base.add(RVA.GameManager_TypeInfo);
      var klass = readPtr(typeInfoSlot);
      if (!klass) return null;

      var staticFields = readPtr(klass.add(OFF.Klass_staticFields));
      if (!staticFields) return null;

      var myPlayer = readPtr(staticFields.add(OFF.GM_myPlayer));
      if (!myPlayer) return null;

      return myPlayer;

    } catch(e) {
      log('error', 'Player', '异常: ' + e.message);
      return null;
    }
  }

  function checkGameManagerInit() {
    try {
      var mod = getGameAssembly();
      if (!mod) return false;

      var typeInfoSlot = mod.base.add(RVA.GameManager_TypeInfo);
      var klass = readPtr(typeInfoSlot);
      if (!klass) return false;

      var staticFields = readPtr(klass.add(OFF.Klass_staticFields));
      if (!staticFields) return false;

      return true;

    } catch(e) {
      return false;
    }
  }

  function isPlayerDead(player) {
    try {
      var mod = getGameAssembly();
      if (!mod) return false;

      var funcAddr = mod.base.add(RVA.Entity_get_isDead);
      var isDeadFunc = new NativeFunction(funcAddr, 'int', ['pointer', 'pointer'], 'mscdecl');
      var result = isDeadFunc(player, ptr(0));
      return result !== 0;
    } catch(e) {
      return false;
    }
  }

  function isMyPlayer(player) {
    try {
      var mod = getGameAssembly();
      if (!mod) return false;

      var funcAddr = mod.base.add(RVA.Player_get_isMyPlayer);
      var isMyPlayerFunc = new NativeFunction(funcAddr, 'int', ['pointer', 'pointer'], 'mscdecl');
      var result = isMyPlayerFunc(player, ptr(0));
      return result !== 0;
    } catch(e) {
      return false;
    }
  }

  function executeGiveWeaponOnMainThread(wpnId, giveUpInt, selectInt) {
    var myPlayer = getMyPlayer();
    if (!myPlayer) {
      log('error', 'Weapon', '主线程: 无法获取玩家实例');
      return false;
    }
    log('success', 'Weapon', '主线程: 获取玩家实例: ' + myPlayer);

    if (_giveWeaponFunc) {
      try {
        var methodInfo = getGiveWeaponMethodInfo();
        var methodArg = methodInfo ? methodInfo : ptr(0);

        log('info', 'Weapon', '主线程: 直接调用 GiveWeapon(player=' + myPlayer + ', wpnId=' + wpnId + ', giveUp=' + giveUpInt + ', select=' + selectInt + ', method=' + methodArg + ')');

        var weapon = _giveWeaponFunc(myPlayer, wpnId, giveUpInt, selectInt, methodArg);

        if (weapon && !weapon.isNull()) {
          log('success', 'Weapon', '主线程直接调用成功! weapon=' + weapon);
          return true;
        } else {
          log('error', 'Weapon', '主线程直接调用返回null');
          return false;
        }
      } catch(e) {
        log('error', 'Weapon', '主线程直接调用异常: ' + e.message);
      }
    }

    if (_il2cpp_runtime_invoke) {
      try {
        var methodInfo = getGiveWeaponMethodInfo();
        if (!methodInfo) {
          log('error', 'Weapon', '主线程: 无法获取MethodInfo');
          return false;
        }

        var playerBuf = Memory.alloc(Process.pointerSize);
        playerBuf.writePointer(myPlayer);

        var wpnIdBuf = Memory.alloc(4);
        wpnIdBuf.writeS32(wpnId);

        var giveUpBuf = Memory.alloc(4);
        giveUpBuf.writeU8(giveUpInt);

        var selectBuf = Memory.alloc(4);
        selectBuf.writeU8(selectInt);

        var params = Memory.alloc(Process.pointerSize * 4);
        params.writePointer(playerBuf);
        params.add(Process.pointerSize).writePointer(wpnIdBuf);
        params.add(Process.pointerSize * 2).writePointer(giveUpBuf);
        params.add(Process.pointerSize * 3).writePointer(selectBuf);

        var exc = Memory.alloc(Process.pointerSize);
        exc.writePointer(ptr(0));

        log('info', 'Weapon', '主线程: il2cpp_runtime_invoke 调用中...');

        var weapon = _il2cpp_runtime_invoke(methodInfo, ptr(0), params, exc);

        var excVal = exc.readPointer();
        if (!excVal.isNull()) {
          log('error', 'Weapon', '主线程 IL2CPP 异常! exc=' + excVal);
          return false;
        }

        if (weapon && !weapon.isNull()) {
          log('success', 'Weapon', '主线程 invoke 成功! weapon=' + weapon);
          return true;
        } else {
          log('error', 'Weapon', '主线程 invoke 返回null');
          return false;
        }
      } catch(e) {
        log('error', 'Weapon', '主线程 invoke 异常: ' + e.message);
        return false;
      }
    }

    log('error', 'Weapon', '无可用的调用方式');
    return false;
  }

  function installMainThreadHook() {
    if (_hookInstalled) return true;

    var mod = getGameAssembly();
    if (!mod) {
      log('error', 'Hook', '无法获取 GameAssembly.dll');
      return false;
    }

    var updateAddr = mod.base.add(RVA.ModeBase_Update);

    try {
      Interceptor.attach(updateAddr, {
        onEnter: function(args) {
          var currentFrame = _lastCheckFrame + 1;
          _lastCheckFrame = currentFrame;

          while (_pendingTasks.length > 0) {
            var task = _pendingTasks.shift();
            log('info', 'Hook', '主线程拾取任务: taskId=' + task.id + ', wpnId=' + task.wpnId);

            var result = executeGiveWeaponOnMainThread(task.wpnId, task.giveUp, task.select);
            _taskResults[task.id] = result;

            send({
              type: 'giveWeaponResult',
              taskId: task.id,
              success: result
            });
          }

          if (_cachedMyPlayer && currentFrame % _checkAliveInterval === 0) {
            checkPlayerRespawn();
          }
        }
      });

      _hookInstalled = true;
      log('success', 'Hook', 'ModeBase$$Update Hook 安装成功（主线程调度）');
      return true;

    } catch(e) {
      log('error', 'Hook', 'Hook 安装失败: ' + e.message);
      return false;
    }
  }

  function checkPlayerRespawn() {
    if (!_cachedMyPlayer) return;

    var currentDead = isPlayerDead(_cachedMyPlayer);

    if (_isPlayerDead && !currentDead) {
      log('success', 'Respawn', '检测到玩家复活!');
      _isPlayerDead = false;

      try {
        send({ type: 'playerRespawned' });
      } catch(e) {
        log('error', 'Respawn', '发送复活事件失败: ' + e.message);
      }
    } else if (!_isPlayerDead && currentDead) {
      log('info', 'Respawn', '检测到玩家死亡');
      _isPlayerDead = true;
    }
  }

  function installRespawnHook() {
    if (_respawnHookInstalled) return true;

    var mod = getGameAssembly();
    if (!mod) {
      log('error', 'RespawnHook', '无法获取 GameAssembly.dll');
      return false;
    }

    var deathAddr = mod.base.add(RVA.Player_OnEntityDeath);

    try {
      Interceptor.attach(deathAddr, {
        onEnter: function(args) {
          var player = args[0];
          var myPlayer = getMyPlayer();

          if (player && myPlayer && player.equals(myPlayer)) {
            log('info', 'RespawnHook', '检测到本地玩家死亡');
            _isPlayerDead = true;
            _cachedMyPlayer = player;
          }
        }
      });

      _respawnHookInstalled = true;
      log('success', 'RespawnHook', 'Player_OnEntityDeath Hook 安装成功');

      var myPlayer = getMyPlayer();
      if (myPlayer) {
        _cachedMyPlayer = myPlayer;
        _isPlayerDead = isPlayerDead(myPlayer);
        log('info', 'RespawnHook', '初始玩家状态: ' + (_isPlayerDead ? '死亡' : '存活'));
      }

      return true;

    } catch (e) {
      log('error', 'RespawnHook', 'Hook 安装失败: ' + e.message);
      return false;
    }
  }

  function installSpawnHook() {
    if (_spawnHookInstalled) return true;

    var mod = getGameAssembly();
    if (!mod) {
      log('error', 'SpawnHook', '无法获取 GameAssembly.dll');
      return false;
    }

    var spawnAddr = mod.base.add(RVA.Player_Spawn);

    try {
      Interceptor.attach(spawnAddr, {
        onEnter: function(args) {
          var player = args[0];
          var myPlayer = getMyPlayer();

          if (player && myPlayer && player.equals(myPlayer)) {
            log('info', 'SpawnHook', '检测到本地玩家复活 (Player.Spawn)');
            _isPlayerDead = false;
            _cachedMyPlayer = player;

            if (_waitingForRespawnWeaponId !== null) {
              log('success', 'SpawnHook', '检测到复活，准备自动赋予武器: ' + _waitingForRespawnWeaponId);
              var weaponId = _waitingForRespawnWeaponId;
              var weaponName = _waitingForRespawnWeaponName;
              _waitingForRespawnWeaponId = null;
              _waitingForRespawnWeaponName = null;

              send({
                type: 'playerRespawnedWithWeapon',
                weaponId: weaponId,
                weaponName: weaponName
              });
            } else {
              send({ type: 'playerRespawned' });
            }
          }
        }
      });

      _spawnHookInstalled = true;
      log('success', 'SpawnHook', 'Player.Spawn Hook 安装成功');

      return true;

    } catch (e) {
      log('error', 'SpawnHook', 'Hook 安装失败: ' + e.message);
      return false;
    }
  }

  function giveWeapon(weaponIndex, autoGiveUp, autoSelect) {
    try {
      log('info', 'Weapon', '开始赋予武器（主线程调度）');

      var wpnId = parseInt(weaponIndex) || 0;
      var giveUpInt = (autoGiveUp === true || autoGiveUp === 1 || autoGiveUp === 'true') ? 1 : 0;
      var selectInt = (autoSelect === true || autoSelect === 1 || autoSelect === 'true') ? 1 : 0;

      log('info', 'Weapon', '参数: weaponIndex=' + wpnId + ', autoGiveUp=' + giveUpInt + ', autoSelect=' + selectInt);

      if (!initNativeFunctions()) {
        log('error', 'Weapon', 'NativeFunction 初始化失败');
        return false;
      }

      if (!checkGameManagerInit()) {
        log('error', 'Weapon', 'GameManager 未初始化!请确保已进入游戏房间');
        return false;
      }

      if (!installMainThreadHook()) {
        log('error', 'Weapon', '主线程 Hook 安装失败');
        return false;
      }

      if (!installRespawnHook()) {
        log('warn', 'Weapon', '复活 Hook 安装失败，但功能可用');
      }

      if (!installSpawnHook()) {
        log('warn', 'Weapon', 'Spawn Hook 安装失败，但功能可用');
      }

      var myPlayer = getMyPlayer();
      if (myPlayer) {
        _cachedMyPlayer = myPlayer;
        _isPlayerDead = isPlayerDead(myPlayer);
      }

      var taskId = ++_taskIdCounter;
      _pendingTasks.push({
        id: taskId,
        wpnId: wpnId,
        giveUp: giveUpInt,
        select: selectInt
      });

      log('info', 'Weapon', '任务已入队: taskId=' + taskId + '，等待主线程执行...');

      return 'pending:' + taskId;

    } catch(e) {
      log('error', 'Weapon', '异常: ' + e.message);
      return false;
    }
  }

  function getWeaponName(weaponIndex) {
    return null;
  }

  rpc.exports = {
    giveweapon: giveWeapon,
    getmyplayer: getMyPlayer,
    getweaponname: getWeaponName,
    setrespawnweapon: function(weaponId, weaponName) {
      try {
        _waitingForRespawnWeaponId = weaponId;
        _waitingForRespawnWeaponName = weaponName;
