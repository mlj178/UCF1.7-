</style></head><body><header class="top"><h1>06 · 增加移动速度代码解读</h1><div class="tabs" id="tabs"></div><div class="actions"><a href="../index.html">功能目录</a><button id="copy">复制源码</button></div></header><section class="summary"><strong>解决的问题：</strong>提高本地玩家跑动速度。脚本替换 PropertyModifier.Get，只在查询对象等于 Player.Modifier_MoveSpeedRatio 时返回设定倍率，因此不会把其他属性 Modifier 一起改掉。</section><div class="workspace"><main class="code"><div class="code-head"><span class="file" id="file"></span><span class="count" id="count"></span><div class="source-meta" id="meta"></div><div class="legend"><span class="legend-item"><span class="swatch address"></span>蓝：定位地址</span><span class="legend-item"><span class="swatch hook"></span>红：安装或恢复 Hook</span><span class="legend-item"><span class="swatch effect"></span>绿：改变游戏行为</span><span class="legend-item"><span class="swatch risk"></span>橙：风险或副作用</span></div></div><nav class="section-strip"><span class="section-strip-title">完整代码导航</span><div class="section-tabs" id="sectionTabs"></div></nav><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><div class="toast" id="toast"></div><script type="text/plain" id="src-release">// move_speed.js - 滑板鞋 (Move Speed)
// Hook PropertyModifier.Get，拦截 MoveSpeedRatio Modifier 的查询，为本地玩家返回倍数后的值

modules.movespeed = (function() {
  var enabled = false;
  var currentSpeed = 3.0;
  var hookAddr = null;
  var isMyPlayerFn = null;
  var originalFn = null;
  var logCount = 0;

  return {
    setSpeed: function(speed) {
      currentSpeed = speed;
      if (enabled) {
        sendLog('info', '滑板鞋', '速度已切换: ' + speed + 'x（实时生效）');
      } else {
        sendLog('info', '滑板鞋', '速度已预选: ' + speed + 'x（开启后生效）');
      }
    },
    enable: function() {
      if (enabled) return;
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '滑板鞋', '无 GameAssembly.dll'); return; }

      var base = mod.base;
      hookAddr = base.add(0xB17590);
      isMyPlayerFn = new NativeFunction(base.add(0xB55FD0), 'bool', ['pointer']);
      originalFn = new NativeFunction(hookAddr, 'float', ['pointer', 'pointer']);
      logCount = 0;

      Interceptor.replace(hookAddr, new NativeCallback(function(self, player) {
        var result = originalFn(self, player);
        if (player && !player.isNull() && isMyPlayerFn(player)) {
          var moveMod = player.add(0x8C).readPointer();
          if (moveMod && !moveMod.isNull() && self.equals(moveMod)) {
            logCount++;
            if (logCount <= 10)
              sendLog('info', '滑板鞋', '原值=' + result.toFixed(3) + ' 修改后=' + currentSpeed.toFixed(1) + 'x');
            return currentSpeed;
          }
        }
        return result;
      }, 'float', ['pointer', 'pointer']));

      enabled = true;
      sendLog('success', '滑板鞋', '已启用 (' + currentSpeed + 'x) — 仅对玩家生效');
      sendStatus('movespeed', true);
    },
    disable: function() {
      if (!enabled || !hookAddr) return;
      Interceptor.revert(hookAddr);
      enabled = false;
      sendLog('info', '滑板鞋', '已禁用');
      sendStatus('movespeed', false);
    }
  };
})();
</script><script type="text/plain" id="src-main">// ============================================================
// 移动速度修改器 v1（已验证可用，从 move_speed.js 拆分）
// 原理: Hook PropertyModifier.Get (RVA 0xB17590)
//       拦截 MoveSpeedRatio Modifier 的查询，返回倍数后的值
// 内存路径: player + 0x8C → Modifier_MoveSpeedRatio
// ============================================================

(function() {
    'use strict';

    var MOVE_SPEED_MULTIPLIER = 3.0;
    var gameAssembly = null;
    var isMyPlayerFn = null;

    function sendLog(level, module, msg) {
        var logMsg = '[' + module + '] ' + msg;
        if (level === 'error') console.error(logMsg);
        else if (level === 'warn') console.warn(logMsg);
        else console.log(logMsg);
        try { send(JSON.stringify({type:'log',level:level,module:module,message:msg})); } catch(e){}
    }

    function getGameAssembly() {
        if (gameAssembly) return gameAssembly;
        var mods = Process.enumerateModules();
        for (var i = 0; i < mods.length; i++) {
            if (mods[i].name.indexOf('GameAssembly') !== -1) {
                gameAssembly = mods[i];
                return gameAssembly;
            }
        }
        return null;
    }

    var enabled = false;
    var hookAddr = null;
    var originalFn = null;
    var logCount = 0;

    function enable() {
        if (enabled) return;
        var gm = getGameAssembly(); if (!gm) {
            sendLog('error', '移动速度', '未找到 GameAssembly');
            return;
        }
        var base = gm.base;
        hookAddr = base.add(0xB17590);
        isMyPlayerFn = new NativeFunction(base.add(0xB55FD0), 'bool', ['pointer']);
        originalFn = new NativeFunction(hookAddr, 'float', ['pointer', 'pointer']);
        logCount = 0;

        Interceptor.replace(hookAddr, new NativeCallback(function(self, player) {
            var result = originalFn(self, player);
            if (player && !player.isNull() && isMyPlayerFn(player)) {
                var moveMod = player.add(0x8C).readPointer();
                if (moveMod && !moveMod.isNull() && self.equals(moveMod)) {
                    logCount++;
                    if (logCount <= 10)
                        sendLog('info', '移动速度', '内存真实原值=' + result.toFixed(3) + ' 修改后=' + MOVE_SPEED_MULTIPLIER.toFixed(1) + 'x');
                    return MOVE_SPEED_MULTIPLIER;
                }
            }
            return result;
        }, 'float', ['pointer', 'pointer']));

        enabled = true;
        sendLog('info', '移动速度', 'v1 已启用 (' + MOVE_SPEED_MULTIPLIER + 'x) @ ' + hookAddr);
    }

    function disable() {
        if (!enabled || !hookAddr) return;
        Interceptor.revert(hookAddr);
        enabled = false;
        sendLog('info', '移动速度', '已禁用');
    }

    globalThis.enableMoveSpeed = enable;
    globalThis.disableMoveSpeed = disable;
    globalThis.setMoveSpeedMultiplier = function(v) {
        MOVE_SPEED_MULTIPLIER = v;
        sendLog('info', '移动速度', '倍数 → ' + v + 'x');
    };

    sendLog('info', '移动速度', 'v1 脚本已加载，自动启用中...');
    enable();

})();
</script>
