:#205e4d;border-color:#50bd99}.highlight-swatch.risk{background:#6d451f;border-color:#e49a4f}.code-scroll{overflow-x:auto;padding:8px 0 26px}.block{min-width:760px;border-left:4px solid transparent}.block:hover{background:#151d24}.block.active{background:#17231f;border-left-color:#4fa58d}.label{display:inline-block;margin:9px 0 5px 48px;padding:2px 7px;color:#8ed7c1;background:#1d302c;border:1px solid #315249;border-radius:4px;font:11px Consolas,monospace}.line{display:grid;grid-template-columns:48px 1fr;min-height:22px;font:13px/1.7 Consolas,monospace}.no{padding-right:10px;color:#64717d;text-align:right;border-right:1px solid #27313a;user-select:none}.txt{padding:0 16px;white-space:pre}.line.key-address{background:rgba(45,108,148,.13);box-shadow:inset 3px 0 #397da5}.line.key-hook{background:rgba(167,65,65,.12);box-shadow:inset 3px 0 #b75555}.line.key-effect{background:rgba(32,126,97,.16);box-shadow:inset 3px 0 #319475}.line.key-risk{background:rgba(180,104,30,.15);box-shadow:inset 3px 0 #c47b34}.block.active .line.key-address{background:rgba(45,108,148,.30);box-shadow:inset 5px 0 #56a8d6}.block.active .line.key-hook{background:rgba(167,65,65,.28);box-shadow:inset 5px 0 #dd7474}.block.active .line.key-effect{background:rgba(32,126,97,.34);box-shadow:inset 5px 0 #59caa5}.block.active .line.key-risk{background:rgba(180,104,30,.31);box-shadow:inset 5px 0 #e5a25f}.address-note{display:inline-flex;margin-left:12px;padding:1px 7px;border:1px solid;border-radius:4px;font:700 11px "Microsoft YaHei",sans-serif}.address-note.reload,.address-note.move{color:#9fd5f3;background:#17384c;border-color:#397da5}.address-note.player{color:#78dabb;background:#173d33;border-color:#30866e}.address-note.weapon{color:#ffd18d;background:#49331a;border-color:#a97634}.address-note.knife{color:#ffb3b3;background:#492425;border-color:#a95357}.address-note.round{color:#d4b5f1;background:#37264a;border-color:#79549b}.explain{position:sticky;top:0;height:100vh;overflow:auto;padding:22px;background:#fff;border-left:1px solid #d8dee2}.eyebrow{margin:10px 0 6px;color:#28715f;font-size:12px;font-weight:700}.explain h2{margin:3px 0 13px;font-size:20px}.card{margin:11px 0;padding:14px;background:#f7f9fa;border:1px solid #d8dee2;border-radius:6px}.card h3{margin:0 0 8px;font-size:14px}.business-card{border-left:4px solid #39779f}.business-scene{margin:0 0 12px;color:#34414b}.business-path{display:grid}.business-step{padding:8px 10px;border:1px solid;border-radius:5px}.business-step.original{color:#1f5b80;background:#edf5fa;border-color:#b8d1e0}.business-step.hook{color:#8f3030;background:#fbeeee;border-color:#e0b6b6}.business-step.modify{color:#17634f;background:#e9f5f0;border-color:#afd2c6}.business-arrow{height:20px;text-align:center;color:#74808a;font-weight:800}.business-result{margin:12px 0 0;padding:9px 10px;color:#73420f;background:#fff3e3;border-left:3px solid #bd742c}.logic-line-ref{float:right;margin-left:10px;padding:1px 6px;color:#17634f;background:#d7ede5;border:1px solid #9bc9ba;border-radius:4px;font:700 11px Consolas,monospace}.address-note.gather,.address-note.gravity,.address-note.time{color:#9fd5f3;background:#17384c;border-color:#397da5}.address-note.transform{color:#ffd18d;background:#49331a;border-color:#a97634}.address-note.bot{color:#ffb3b3;background:#492425;border-color:#a95357}.address-note.aim,.address-note.hp,.address-note.weapon{color:#9fd5f3;background:#17384c;border-color:#397da5}.address-note.risk{color:#ffd18d;background:#49331a;border-color:#a97634}</style></head><body><header class="top"><h1>17 · 生化模式-技能无冷却代码解读</h1><div class="tabs" id="tabs"></div><div class="actions"><a href="../index.html">功能目录</a><button id="copy">复制源码</button></div></header><section class="summary"><strong>解决的问题：</strong>锁定本地 Player，遍历 PlayerSkills 中的 Skill_Common 对象，并周期调用 EndCold，提前结束生化角色技能冷却。</section><div class="workspace"><main class="code"><div class="code-head"><span id="file"></span><span id="count"></span><div class="source-meta" id="meta"></div><div class="code-highlight-legend"><span class="highlight-legend-item"><span class="highlight-swatch address"></span>蓝：定位地址</span><span class="highlight-legend-item"><span class="highlight-swatch hook"></span>红：安装或恢复 Hook</span><span class="highlight-legend-item"><span class="highlight-swatch effect"></span>绿：改变游戏行为</span><span class="highlight-legend-item"><span class="highlight-swatch risk"></span>橙：风险或依赖</span></div></div><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><script type="text/plain" id="src-release">// skill_cd.js - 生化模式-英雄技能无冷却
// 3路Hook(isMyPlayer replace + Player.Update attach + get_nickName attach) + 200ms定时器调用 EndCold()

modules.skillcd = (function() {
  var enabled = false;
  var myPlayerPtr = null;
  var _endColdFn = null;
  var _noCdTimer = null;
  var hooks = [];

  function readPtr(addr) {
    try { if (!addr || addr.isNull()) return null; var v = addr.readPointer(); return (v && !v.isNull()) ? v : null; } catch (e) { return null; }
  }
  function readI32(addr) { try { return addr ? addr.readS32() : null; } catch (e) { return null; } }
  function readF32(addr) { try { return addr ? addr.readFloat() : null; } catch (e) { return null; } }
  function readU8(addr) { try { return addr ? addr.readU8() : null; } catch (e) { return null; } }

  function scanSkillSteps(pp) {
    var ps = readPtr(pp.add(0xB0));
    if (!ps) { sendLog('error', '技能CD', 'PlayerSkills 为空'); return; }
    var arr = readPtr(ps.add(0x08));
    if (!arr) { sendLog('error', '技能CD', 'Skill[] 为空'); return; }
    var len = readI32(arr.add(0x0C));
    if (!len || len <= 0 || len > 20) return;
    var found = 0;
    for (var i = 0; i < len; i++) {
      var sp = readPtr(arr.add(0x10 + 4 * i));
      if (!sp) continue;
      var coldFinish = readF32(sp.add(0x1C));
      var coldTime = readF32(sp.add(0x24));
      if (coldFinish !== null || coldTime !== null) {
        found++;
      }
    }
    if (found > 0) {
      sendLog('info', '技能CD', '找到 ' + found + ' 个技能');
    }
  }

  function scanAndEndCold() {
    if (!myPlayerPtr) return;
    var ps = readPtr(myPlayerPtr.add(0xB0));
    if (!ps) return;
    var arr = readPtr(ps.add(0x08));
    if (!arr) return;
    var len = readI32(arr.add(0x0C));
    if (!len || len <= 0 || len > 20) return;

    var called = 0;
    for (var i = 0; i < len; i++) {
      var sp = readPtr(arr.add(0x10 + 4 * i));
      if (!sp) continue;
      var coldFinish = readF32(sp.add(0x1C));
      var coldTime = readF32(sp.add(0x24));
      if (coldFinish !== null || coldTime !== null) {
        try {
          _endColdFn(sp);
          called++;
        } catch (e) {}
      }
    }
  }

  return {
    enable: function() {
      if (enabled) return;
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '技能CD', '未找到 GameAssembly.dll'); return; }
      var base = mod.base;

      try {
        _endColdFn = new NativeFunction(base.add(0xAE1BC0), 'void', ['pointer']);
        sendLog('info', '技能CD', 'EndCold 函数就绪 (RVA 0xAE1BC0)');
      } catch (e) {
        sendLog('error', '技能CD', 'EndCold 创建失败: ' + e);
        return;
      }

      // Hook isMyPlayer 来捕获玩家指针（支持房间切换时自动更新）
      try {
        var addrIsMy = base.add(0xB55FD0);
        var origIsMy = new NativeFunction(addrIsMy, 'bool', ['pointer', 'pointer']);
        Interceptor.replace(addrIsMy, new NativeCallback(function (playerPtr, methodInfo) {
          try {
            var result = origIsMy(playerPtr, methodInfo);
            if (result) {
              if (!myPlayerPtr || !myPlayerPtr.equals(playerPtr)) {
                myPlayerPtr = playerPtr;
                scanSkillSteps(playerPtr);
                sendLog('info', '技能CD', '玩家指针已更新: ' + playerPtr);
              }
            }
            return result;
          } catch (e) { return false; }
        }, 'bool', ['pointer', 'pointer']));
        hooks.push({ type: 'replace', addr: addrIsMy, orig: origIsMy });
        sendLog('success', '技能CD', 'isMyPlayer Hook OK');
      } catch (e) { sendLog('error', '技能CD', 'isMyPlayer Hook 失败: ' + e); }

      // 兜底 Hook Player.Update 来捕获玩家（支持房间切换时自动更新）
      try {
        var addrUpdate = base.add(0xB551D0);
        hooks.push(Interceptor.attach(addrUpdate, {
          onEnter: function (args) {
            var p = args[0];
            if (!p || p.isNull()) return;
            var cd = readPtr(p.add(0x94));
            if (!cd) return;
            if (readU8(cd.add(0x1C))) return;
            if (!myPlayerPtr || !myPlayerPtr.equals(p)) {
              myPlayerPtr = p;
              scanSkillSteps(p);
            }
          }
        }));
        sendLog('success', '技能CD', 'Player.Update Hook OK');
      } catch (e) { sendLog('warn', '技能CD', 'Player.Update Hook 失败: ' + e); }

      // 兜底 Hook get_nickName 来捕获玩家（支持房间切换时自动更新）
      try {
        var addrNick = base.add(0xB50810);
        hooks.push(Interceptor.attach(addrNick, {
          onEnter: function (args) {
            var p = args[0];
            if (!p || p.isNull()) return;
            var cd = readPtr(p.add(0x94));
            if (!cd) return;
            if (readU8(cd.add(0x1C))) return;
            if (!myPlayerPtr || !myPlayerPtr.equals(p)) {
              myPlayerPtr = p;
              scanSkillSteps(p);
            }
          }
        }));
        sendLog('success', '技能CD', 'get_nickName Hook OK');
      } catch (e) { sendLog('warn', '技能CD', 'get_nickName Hook 失败: ' + e); }

      // 立即执行一次，然后设置定时器
      scanAndEndCold();
      _noCdTimer = setInterval(scanAndEndCold, 200);

      enabled = true;
      sendLog('success', '技能CD', '已开启 — 每 200ms 调用 EndCold()');
      sendStatus('skillcd', true);
    },
    disable: function() {
      if (!enabled) return;

      for (var i = 0; i < hooks.length; i++) {
        try {
          if (hooks[i].type === 'replace') {
            Interceptor.revert(hooks[i].addr);
          } else {
            hooks[i].detach();
          }
        } catch(e) {}
      }
      hooks = [];

      if (_noCdTimer) {
        clearInterval(_noCdTimer);
        _noCdTimer = null;
      }

      myPlayerPtr = null;
      enabled = false;
      sendLog('info', '技能CD', '已关闭');
      sendStatus('skillcd', false);
    },
    isEnabled: function() { return enabled; }
  };
})();
</script><script type="text/plain" id="src-main">(function () {
    'use strict';

    function sendLog(level, module, message) {
        send({ type: 'log', level: level, module: module, message: message });
    }

    // ===== 工具函数 =====
    var _base = null;
    function initBase() {
        var mod = Process.findModuleByName("GameAssembly.dll");
        if (!mod) { sendLog('error', '初始化', 'GameAssembly.dll 未找到'); return false; }
        _base = mod.base;
        sendLog('info', '初始化', 'GameAssembly.dll base = ' + _base);
        return true;
    }
    function readPtr(addr) {
        try { if (!addr || addr.isNull()) return null; var v = addr.readPointer(); return (v && !v.isNull()) ? v : null; } catch (e) { return null; }
    }
    function readI32(addr) { try { return addr ? addr.readS32() : null; } catch (e) { return null; } }
    function readF32(addr) { try { return addr ? addr.readFloat() : null; } catch (e) { return null; } }
    function readU8(addr) { try { return addr ? addr.readU8() : null; } catch (e) { return null; } }
    function readStr(addr) {
        try {
            if (!addr || addr.isNull()) return null;
            var p = addr.readPointer();
            if (!p || p.isNull()) return null;
            var len = p.add(-4).readS32();
            if (len < 0 || len > 200) return null;
            return p.readUtf8String(len);
        } catch (e) { return null; }
    }

    // ===== 全局状态 =====
    var myPlayerPtr = null;
    var _endColdFn = null;
    var _noCdTimer = null;

    if (!initBase()) return;

    // EndCold 函数指针 (RVA 0xAE1BC0, void EndCold())
    try {
        _endColdFn = new NativeFunction(_base.add(0xAE1BC0), 'void', ['pointer']);
        sendLog('info', '初始化', 'EndCold 函数就绪 (RVA 0xAE1BC0)');
    } catch (e) {
        sendLog('error', '初始化', 'EndCold 创建失败: ' + e);
        return;
    }

    // ============================================================
    // 步骤 1: 获取 Player 实例地址
    // ============================================================
    sendLog('info', '步骤1', '===== 获取 Player 实例地址 =====');

    try {
        var addrIsMy = _base.add(0xB55FD0);
        var origIsMy = new NativeFunction(addrIsMy, 'bool', ['pointer', 'pointer']);
        Interceptor.replace(addrIsMy, new NativeCallback(function (playerPtr, methodInfo) {
            try {
                var result = origIsMy(playerPtr, methodInfo);
                if (result && !myPlayerPtr) {
                    myPlayerPtr = playerPtr;
                    sendLog('success', '步骤1-A', 'isMyPlayer: ' + playerPtr);
                    scanSkillSteps(playerPtr);
                }
                return result;
            } catch (e) { return false; }
        }, 'bool', ['pointer', 'pointer']));
        sendLog('success', '步骤1-A', 'isMyPlayer Hook OK');
    } catch (e) { sendLog('error', '步骤1-A', '失败: ' + e); }

    try {
        var addrUpdate = _base.add(0xB551D0);
        Interceptor.attach(addrUpdate, {
            onEnter: function (args) {
                if (myPlayerPtr) return;
                var p = args[0];
                if (!p || p.isNull()) return;
                var cd = readPtr(p.add(0x94));
                if (!cd) return;
                if (readU8(cd.add(0x1C))) return;
                myPlayerPtr = p;
                sendLog('success', '步骤1-B', 'Player.Update: ' + p);
                scanSkillSteps(p);
            }
        });
        sendLog('success', '步骤1-B', 'Player.Update Hook OK');
    } catch (e) { sendLog('error', '步骤1-B', '失败: ' + e); }

    try {
        var addrNick = _base.add(0xB50810);
        Interceptor.attach(addrNick, {
            onEnter: function (args) {
                if (myPlayerPtr) return;
                var p = args[0];
                if (!p || p.isNull()) return;
                var cd = readPtr(p.add(0x94));
                if (!cd) return;
                if (readU8(cd.add(0x1C))) return;
                myPlayerPtr = p;
                sendLog('success', '步骤1-C', 'get_nickName: ' + p);
                scanSkillSteps(p);
            }
        });
        sendLog('success', '步骤1-C', 'get_nickName Hook OK');
    } catch (e) { sendLog('warn', '步骤1-C', '失败: ' + e); }

    // ============================================================
    // 扫描 Skill_Common 实例
    // ============================================================
    function scanSkillSteps(pp) {
        var ps = readPtr(pp.add(0xB0));
        if (!ps) { sendLog('error', '步骤2', 'PlayerSkills 为空'); return; }
        sendLog('success', '步骤2', 'PlayerSkills: ' + ps);
        var arr = readPtr(ps.add(0x08));
        if (!arr) { sendLog('error', '步骤3', 'Skill[] 为空'); return; }
        sendLog('success', '步骤3', 'Skill[]: ' + arr);
        var len = readI32(arr.add(0x0C));
        if (!len || len <= 0 || len > 20) { sendLog('warn', '步骤3', '长度: ' + len); return; }
        sendLog('info', '步骤4', '遍历识别 Skill_Common');
        var found = 0;
        for (var i = 0; i < len; i++) {
            var sp = readPtr(arr.add(0x10 + 4 * i));
            if (!sp) continue;
            var coldFinish = readF32(sp.add(0x1C));
            var coldTime = readF32(sp.add(0x24));
            if (coldFinish !== null || coldTime !== null) {
                sendLog('success', '步骤4', 'Skill_Common: ' + sp);
                found++;
            }
        }
        if (found === 0) sendLog('warn', '步骤4', '未找到');
    }

    // ============================================================
    // 扫描 + 调用 EndCold
    // ============================================================
    function scanAndEndCold() {
        if (!myPlayerPtr) return;
        var ps = readPtr(myPlayerPtr.add(0xB0));
        if (!ps) return;
        var arr = readPtr(ps.add(0x08));
        if (!arr) return;
        var len = readI32(arr.add(0x0C));
        if (!len || len <= 0 || len > 20) return;

        var called = 0; 
        for (var i = 0; i < len; i++) {
            var sp = readPtr(arr.add(0x10 + 4 * i));
            if (!sp) continue;
            var coldFinish = readF32(sp.add(0x1C));
            var coldTime = readF32(sp.add(0x24));
            if (coldFinish !== null || coldTime !== null) {
                try {
                    _endColdFn(sp);
                    called++;
                } catch (e) { /* 忽略 */ }
            }
        }
        if (called > 0) {
            sendLog('success', '技能无冷却', '已调用 EndCold × ' + called);
        }
    }

    // ============================================================
    // 技能无冷却开关
    // ============================================================
    globalThis.noCd = function (enable) {
        if (enable) {
            if (_noCdTimer) return;
            sendLog('success', '技能无冷却', '✅ 已开启 — 每 200ms 调用 EndCold()');
            // 先立即执行一次
            scanAndEndCold();
            _noCdTimer = setInterval(scanAndEndCold, 200);
        } else {
            if (!_noCdTimer) return;
            clearInterval(_noCdTimer);
            _noCdTimer = null;
            sendLog('success', '无CD', '⏹ 已关闭');
        }
    };

    // ============================================================
    // 全局命令
    // ============================================================
    globalThis.scanSkill = function () {
        if (myPlayerPtr) scanSkillSteps(myPlayerPtr);
        else sendLog('warn', '手动', '尚无玩家实例');
    };
    globalThis.getMyPlayer = function () { return myPlayerPtr; };

    // rpc 导出，供 Python launcher 调用
    rpc.exports = {
        noCd: function (enable) {
            if (enable) {
                if (_noCdTimer) return;
                scanAndEndCold();
                _noCdTimer = setInterval(scanAndEndCold, 200);
            } else {
                if (!_noCdTimer) return;
                clearInterval(_noCdTimer);
                _noCdTimer = null;
            }
        }
    };

    sendLog('info', '系统', '✅ 已加载');
    sendLog('info', '系统', '命令: noCd(true)  — 调用 EndCold 清 CD');
