// 替换 Recoil.OnGunShot，将后座力相关字段归零

modules.recoil = (function() {
  var replacedAddr = null;
  var callbackFunc = null;
  var enabled = false;
  var suppressCount = 0;

  return {
    enable: function() {
      if (enabled) return;
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '无后座力', '无 GameAssembly.dll'); return; }

      var base = mod.base;
      replacedAddr = base.add(0xB19980);
      sendLog('info', '无后座力', 'Recoil$$OnGunShot @ ' + replacedAddr);

      suppressCount = 0;

      callbackFunc = new NativeCallback(function(recoilThis, methodInfo) {
        suppressCount++;
        try {
          recoilThis.add(0x68).writeFloat(0.0);
          recoilThis.add(0x6C).writeFloat(0.0);
          recoilThis.add(0x70).writeFloat(0.0);
          recoilThis.add(0x74).writeFloat(0.0);
        } catch (e) {}

        if (suppressCount <= 3) {
          sendLog('info', '无后座力', '[Suppress #' + suppressCount + '] ' + recoilThis);
        } else if (suppressCount === 4) {
          sendLog('info', '无后座力', '...suppressing silently');
        }
      }, 'void', ['pointer', 'pointer']);

      try {
        Interceptor.replace(replacedAddr, callbackFunc);
        sendLog('success', '无后座力', '已替换 Recoil.OnGunShot');
      } catch(e) {
        sendLog('error', '无后座力', '替换失败: ' + e.message);
        return;
      }

      enabled = true;
      sendLog('success', '无后座力', 'v14 已启用 (replace OnGunShot + zero 4 fields)');
      sendStatus('recoil', true);
    },
    disable: function() {
      if (!enabled) return;
      if (replacedAddr) { try { Interceptor.revert(replacedAddr); } catch(e) {} }
      callbackFunc = null; replacedAddr = null;
      enabled = false;
      sendLog('info', '无后座力', '已禁用');
      sendStatus('recoil', false);
    }
  };
})();</script>

    var MAX_LOGS_PER_MODULE = 10;

      button.setAttribute('aria-selected', index === activeSource ? 'true' : 'false');
      button.onclick = function () {
        activeSource = index;
        activeSection = 0;
        render();
      };
      tabs.appendChild(button);
    });

    document.getElementById('file').textContent = definition.file;
    document.getElementById('count').textContent = lines.length + ' 行';
    var meta = sourceMeta[definition.id];
    document.getElementById('meta').innerHTML = '<strong>文档生成时间：</strong>' + generatedAt + '　<strong>源码修改时间：</strong>' + meta.modified + '　<strong>文件大小：</strong>' + meta.size + ' bytes<br><strong>SHA-256：</strong><code>' + meta.hash + '</code><span class="sync-note">此指纹对应当前解读版本；JS 更新后哈希会变化。</span>';
    code.innerHTML = '';
    definition.sections.forEach(function (section, index) {
      var element = document.createElement('section');
      element.className = 'block';
      var html = '<div class="label">' + escapeHtml(section.title) + ' · L' + section.start + '-' + Math.min(section.end, lines.length) + '</div>';
      for (var lineNumber = section.start; lineNumber <= Math.min(section.end, lines.length); lineNumber++) {
        var addressNote = (addressNotes[definition.id] || {})[lineNumber];
        var addressNoteHtml = addressNote ? '<span class="address-note ' + addressNote.type + '">' + escapeHtml(addressNote.label) + '</span>' : '';
        var criticalType = (criticalLineStyles[definition.id] || {})[lineNumber];
        var criticalClass = criticalType ? ' key-line key-' + criticalType : '';
        html += '<div class="line' + criticalClass + '"><span class="no">' + lineNumber + '</span><span class="txt">' + escapeHtml(lines[lineNumber - 1] || ' ') + addressNoteHtml + '</span></div>';
      }
      element.innerHTML = html;
      element.onclick = function () { select(index); };
      code.appendChild(element);
    });
    select(0);
  }

  function select(index) {
    activeSection = index;
    document.querySelectorAll('.block').forEach(function (element, blockIndex) {
      element.classList.toggle('active', blockIndex === index);
    });
    var section = defs[activeSource].sections[index];
    document.getElementById('cat').textContent = section.category;
    document.getElementById('title').textContent = section.title;
    var definition = defs[activeSource];
    var business = (businessDetails[definition.id] || {})[section.id] || { scene: '这一段主要负责脚本控制或诊断。', original: ['游戏按原逻辑运行。'], modified: ['脚本维护状态或输出信息。'], result: '没有直接修改具体游戏对象。' };
    var lineRefs = (businessLineRefs[definition.id] || {})[section.id] || [];
    function renderBusinessPath(items, finalType, refs) {
      return items.map(function (item, itemIndex) {
        var type = itemIndex === items.length - 1 && finalType ? finalType : 'original';
        var ref = refs && refs[itemIndex] ? '<span class="logic-line-ref">' + escapeHtml(refs[itemIndex]) + '</span>' : '';
        return '<div class="business-step ' + type + '">' + escapeHtml(item) + ref + '</div>' + (itemIndex < items.length - 1 ? '<div class="business-arrow">↓</div>' : '');
      }).join('');
    }
    var originalPath = renderBusinessPath(business.original, 'hook', []);
    var modifiedPath = renderBusinessPath(business.modified, 'modify', lineRefs);
    document.getElementById('body').innerHTML =
      '<div class="card business-card"><h3>业务流程对应</h3><p class="business-scene"><strong>游戏场景：</strong>' + escapeHtml(business.scene) + '</p>' +
      '<p class="eyebrow">原始游戏逻辑</p><div class="business-path">' + originalPath + '</div>' +
      '<p class="eyebrow">修改后游戏逻辑</p><div class="business-path">' + modifiedPath + '</div>' +
      '<p class="business-result"><strong>游戏表现：</strong>' + escapeHtml(business.result) + '</p></div>';
  }

  document.getElementById('copy').onclick = function () {
    var button = this;
    var text = defs[activeSource].text;
    var copy = navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject();
    copy.then(function () { button.textContent = '已复制'; }, function () { button.textContent = '复制失败'; });
    setTimeout(function () { button.textContent = '复制源码'; }, 1200);
  };

  render();
})();
</script></body></html>
