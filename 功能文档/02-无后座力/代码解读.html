</style></head><body><header class="top"><h1>02 · 无后座力代码解读</h1><div class="tabs" id="tabs"></div><div class="actions"><a href="../index.html">功能目录</a><button id="copy">复制源码</button></div></header><section class="summary"><strong>解决的问题：</strong>消除开枪后镜头横向、纵向跳动及其目标偏移。脚本替换 Recoil.OnGunShot，不执行原后坐力累加逻辑，并把 Recoil 实例的四个浮点字段写为 0。</section><div class="workspace"><main class="code"><div class="code-head"><span class="file" id="file"></span><span class="count" id="count"></span><div class="source-meta" id="meta"></div><div class="legend"><span class="legend-item"><span class="swatch address"></span>蓝：定位地址</span><span class="legend-item"><span class="swatch hook"></span>红：安装或恢复 Hook</span><span class="legend-item"><span class="swatch effect"></span>绿：改变游戏行为</span><span class="legend-item"><span class="swatch risk"></span>橙：风险或副作用</span></div></div><nav class="section-strip"><span class="section-strip-title">完整代码导航</span><div class="section-tabs" id="sectionTabs"></div></nav><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><div class="toast" id="toast"></div><script type="text/plain" id="src-release">// recoil.js - 无后座力 v14
// 替换 Recoil.OnGunShot，将后座力相关字段归零

modules.recoil = (function() {
  var replacedAddr = null;
  var callbackFunc = null;
  var enabled = false;
  var suppressCount = 0;

  return {
    enable: function() {
      if (enabled) return;
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '无后座力', '无 GameAssembly.dll'); return; }

      var base = mod.base;
      replacedAddr = base.add(0xB19980);
      sendLog('info', '无后座力', 'Recoil$$OnGunShot @ ' + replacedAddr);

      suppressCount = 0;

      callbackFunc = new NativeCallback(function(recoilThis, methodInfo) {
        suppressCount++;
        try {
          recoilThis.add(0x68).writeFloat(0.0);
          recoilThis.add(0x6C).writeFloat(0.0);
          recoilThis.add(0x70).writeFloat(0.0);
          recoilThis.add(0x74).writeFloat(0.0);
        } catch (e) {}

        if (suppressCount <= 3) {
          sendLog('info', '无后座力', '[Suppress #' + suppressCount + '] ' + recoilThis);
        } else if (suppressCount === 4) {
          sendLog('info', '无后座力', '...suppressing silently');
        }
      }, 'void', ['pointer', 'pointer']);

      try {
        Interceptor.replace(replacedAddr, callbackFunc);
        sendLog('success', '无后座力', '已替换 Recoil.OnGunShot');
      } catch(e) {
        sendLog('error', '无后座力', '替换失败: ' + e.message);
        return;
      }

      enabled = true;
      sendLog('success', '无后座力', 'v14 已启用 (replace OnGunShot + zero 4 fields)');
      sendStatus('recoil', true);
    },
    disable: function() {
      if (!enabled) return;
      if (replacedAddr) { try { Interceptor.revert(replacedAddr); } catch(e) {} }
      callbackFunc = null; replacedAddr = null;
      enabled = false;
      sendLog('info', '无后座力', '已禁用');
      sendStatus('recoil', false);
    }
  };
})();</script><script type="text/plain" id="src-main">// no_recoil_v14.js - 无后座力 v14 (replace OnGunShot + zero 4 fields)
// 从 game_modifier.py 提取的独立版本
(function() {
    'use strict';

    var MAX_LOGS_PER_MODULE = 10;
    var moduleLogCounts = {};

    function sendLog(level, module, message) {
        if (!moduleLogCounts[module]) moduleLogCounts[module] = 0;
        if (moduleLogCounts[module] >= MAX_LOGS_PER_MODULE) return;
        if (module !== '系统' && moduleLogCounts[module] === MAX_LOGS_PER_MODULE - 1) {
            moduleLogCounts[module]++;
            send({ type: 'log', level: 'info', module: module, message: message + ' (后续日志已静默)' });
            return;
        }
        moduleLogCounts[module]++;
        send({ type: 'log', level: level, module: module, message: message });
    }

    function getGameAssembly() {
        try {
            var mod = Process.findModuleByName('GameAssembly.dll');
            if (!mod) {
                sendLog('error', '系统', '未找到 GameAssembly.dll');
                return null;
            }
            sendLog('info', '系统', 'GameAssembly.dll: base=' + mod.base + ' size=' + mod.size);
            return mod;
        } catch(e) { sendLog('error', '系统', '获取模块失败: ' + e.message); return null; }
    }

    var replacedAddr = null;
    var callbackFunc = null;
    var enabled = false;
    var suppressCount = 0;

    function enable() {
        if (enabled) return;
        var mod = getGameAssembly();
        if (!mod) { sendLog('error', '无后座力', '无 GameAssembly.dll'); return; }

        var base = mod.base;
        replacedAddr = base.add(0xB19980);
        sendLog('info', '无后座力', 'Recoil$$OnGunShot @ ' + replacedAddr);

        suppressCount = 0;

        callbackFunc = new NativeCallback(function(recoilThis, methodInfo) {
            suppressCount++;
            try {
                recoilThis.add(0x68).writeFloat(0.0);
                recoilThis.add(0x6C).writeFloat(0.0);
                recoilThis.add(0x70).writeFloat(0.0);
                recoilThis.add(0x74).writeFloat(0.0);
            } catch (e) {}

            if (suppressCount <= 3) {
                sendLog('info', '无后座力', '[Suppress #' + suppressCount + '] ' + recoilThis);
            } else if (suppressCount === 4) {
                sendLog('info', '无后座力', '...suppressing silently');
            }
        }, 'void', ['pointer', 'pointer']);

        try {
            Interceptor.replace(replacedAddr, callbackFunc);
            sendLog('success', '无后座力', '已替换 Recoil.OnGunShot');
        } catch(e) {
            sendLog('error', '无后座力', '替换失败: ' + e.message);
            return;
        }

        enabled = true;
        sendLog('success', '无后座力', 'v14 已启用 (replace OnGunShot + zero 4 fields)');
    }

    enable();
    sendLog('info', '系统', '无后座力 v14 已加载，自动启用中...');
})();</script>
