</style></head><body><header class="top"><h1>05 · 快速换弹 BUFF代码解读</h1><div class="tabs" id="tabs"></div><div class="actions"><a href="../index.html">功能目录</a><button id="copy">复制源码</button></div></header><section class="summary"><strong>解决的问题：</strong>缩短本地玩家枪械的换弹动作时间。脚本替换 PlayerWeapons.get_ReloadSpeed，通过 owner 判断本地玩家后返回更高的换弹速度倍率；它不修改弹匣容量，也不负责无限子弹。</section><div class="workspace"><main class="code"><div class="code-head"><span class="file" id="file"></span><span class="count" id="count"></span><div class="source-meta" id="meta"></div><div class="legend"><span class="legend-item"><span class="swatch address"></span>蓝：定位地址</span><span class="legend-item"><span class="swatch hook"></span>红：安装或恢复 Hook</span><span class="legend-item"><span class="swatch effect"></span>绿：改变游戏行为</span><span class="legend-item"><span class="swatch risk"></span>橙：风险或副作用</span></div></div><nav class="section-strip"><span class="section-strip-title">完整代码导航</span><div class="section-tabs" id="sectionTabs"></div></nav><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><div class="toast" id="toast"></div><script type="text/plain" id="src-release">// reload_speed.js - 快速换弹
// 替换 get_ReloadSpeed，为本地玩家返回2倍加速

modules.ammoplus = (function() {
  var enabled = false;
  var getReloadSpeedAddr = null;
  var isMyPlayer = null;
  var reloadLogCount = 0;

  return {
    enable: function() {
      if (enabled) return;
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '快速换弹', '无 GameAssembly.dll'); return; }

      var base = mod.base;
      getReloadSpeedAddr = base.add(0xB170E0);
      isMyPlayer = new NativeFunction(base.add(0xB55FD0), 'bool', ['pointer']);
      reloadLogCount = 0;

      sendLog('info', '快速换弹', 'get_ReloadSpeed @ ' + getReloadSpeedAddr);

      Interceptor.replace(getReloadSpeedAddr, new NativeCallback(function(self) {
        try {
          var owner = self.add(0x8).readPointer();
          if (!owner || owner.isNull()) return 4.0;
          if (isMyPlayer(owner)) {
            reloadLogCount++;
            if (reloadLogCount <= 5) {
              sendLog('info', '快速换弹', '本地玩家换弹加速 4.0x (#' + reloadLogCount + ')');
            }
            return 4.0;
          }
          return 1.0;
        } catch(e) {
          return 4.0;
        }
      }, 'float', ['pointer']));

      enabled = true;
      sendLog('success', '快速换弹', '已启用 — 2x快速换弹');
      sendStatus('ammoplus', true);
    },
    disable: function() {
      if (!enabled) return;
      if (getReloadSpeedAddr) { try { Interceptor.revert(getReloadSpeedAddr); } catch(e) {} }
      getReloadSpeedAddr = null;
      isMyPlayer = null;
      enabled = false;
      sendLog('info', '快速换弹', '已禁用');
      sendStatus('ammoplus', false);
    }
  };
})();
</script><script type="text/plain" id="src-main">// rapid_reload_test.js - 全模式通用快速换弹
// 基于IDA反编译分析的通用BUFF字段实现
// 
// 实现方案：
// 快速换弹：Hook get_ReloadSpeed() 函数，返回加速后的值
//
// 通用字段说明：
// - PlayerWeapons.Modifier_ReloadSpeed (偏移0x3C) - 换弹速度修改器
//
// 这些字段定义在PlayerWeapons类中，在所有游戏模式下都有效

console.log("[*] ======================================");
console.log("[*]  RAPID RELOAD (ALL MODES)");
console.log("[*]  全模式通用 - 快速换弹");
console.log("[*] ======================================");

(function () {
    var RELOAD_SPEED_MULTIPLIER = 2.0;  // 换弹速度倍数（2倍）
    
    var mod = Process.findModuleByName("GameAssembly.dll");
    if (!mod) { 
        console.log("[-] GameAssembly.dll not found!"); 
        return; 
    }
    var base = mod.base;

    // PlayerWeapons.get_ReloadSpeed (RVA 0xB170E0)
    var getReloadSpeedAddr = base.add(0xB170E0);

    console.log("[+] get_ReloadSpeed @ " + getReloadSpeedAddr);
    console.log("[+] Reload Speed Multiplier: " + RELOAD_SPEED_MULTIPLIER + "x");

    var reloadSpeedLogCount = 0;

    // Hook get_ReloadSpeed - 让本地玩家返回加速后的值
    // Player.get_isMyPlayer (RVA 0xB55FD0) - 判断是否是本地玩家
    var isMyPlayerAddr = base.add(0xB55FD0);
    var isMyPlayer = new NativeFunction(isMyPlayerAddr, "bool", ["pointer"]);

    Interceptor.replace(getReloadSpeedAddr, new NativeCallback(function(self) {
        try {
            // PlayerWeapons + 0x8 = owner (Player)
            var owner = self.add(0x8).readPointer();
            if (!owner || owner.isNull()) {
                return RELOAD_SPEED_MULTIPLIER;
            }

            // 判断是否是本地玩家
            if (isMyPlayer(owner)) {
                reloadSpeedLogCount++;
                if (reloadSpeedLogCount <= 5) {
                    console.log("[ReloadSpeed] Local player detected, returning " + RELOAD_SPEED_MULTIPLIER + "x");
                }
                return RELOAD_SPEED_MULTIPLIER;  // 快速换弹
            }

            // 不是本地玩家，返回默认值
            return 1.0;
        } catch(e) {
            return RELOAD_SPEED_MULTIPLIER;
        }
    }, "float", ["pointer"]));

    console.log("[+] Rapid Reload hook installed");

    console.log("\n[+] TEST SCRIPT ACTIVE");
    console.log("[+] 进入任意模式即可自动生效");
    console.log("[+] 快速换弹: " + RELOAD_SPEED_MULTIPLIER + "x");

})();
</script>
