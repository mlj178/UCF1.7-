order-left:1px solid #d8dee2}.eyebrow{margin:10px 0 6px;color:#28715f;font-size:12px;font-weight:700}.explain h2{margin:3px 0 13px;font-size:20px}.card{margin:11px 0;padding:14px;background:#f7f9fa;border:1px solid #d8dee2;border-radius:6px}.card h3{margin:0 0 8px;font-size:14px}.business-card{border-left:4px solid #39779f}.business-scene{margin:0 0 12px;color:#34414b}.business-path{display:grid}.business-step{padding:8px 10px;border:1px solid;border-radius:5px}.business-step.original{color:#1f5b80;background:#edf5fa;border-color:#b8d1e0}.business-step.hook{color:#8f3030;background:#fbeeee;border-color:#e0b6b6}.business-step.modify{color:#17634f;background:#e9f5f0;border-color:#afd2c6}.business-arrow{height:20px;text-align:center;color:#74808a;font-weight:800}.business-result{margin:12px 0 0;padding:9px 10px;color:#73420f;background:#fff3e3;border-left:3px solid #bd742c}.logic-line-ref{float:right;margin-left:10px;padding:1px 6px;color:#17634f;background:#d7ede5;border:1px solid #9bc9ba;border-radius:4px;font:700 11px Consolas,monospace}.address-note.gather,.address-note.gravity,.address-note.time{color:#9fd5f3;background:#17384c;border-color:#397da5}.address-note.transform{color:#ffd18d;background:#49331a;border-color:#a97634}.address-note.bot{color:#ffb3b3;background:#492425;border-color:#a95357}.address-note.aim,.address-note.hp,.address-note.weapon{color:#9fd5f3;background:#17384c;border-color:#397da5}.address-note.risk{color:#ffd18d;background:#49331a;border-color:#a97634}</style></head><body><header class="top"><h1>11 · 自瞄代码解读</h1><div class="tabs" id="tabs"></div><div class="actions"><a href="../index.html">功能目录</a><button id="copy">复制源码</button></div></header><section class="summary"><strong>解决的问题：</strong>扫描当前房间敌人，结合队伍、死亡状态、距离、视野角和可见性筛选目标，再按平滑与锁定配置写入本地玩家相机旋转。主方案通过 vischeck.dll 包装 Physics.Linecast 做遮挡检测。</section><div class="workspace"><main class="code"><div class="code-head"><span id="file"></span><span id="count"></span><div class="source-meta" id="meta"></div><div class="code-highlight-legend"><span class="highlight-legend-item"><span class="highlight-swatch address"></span>蓝：定位地址</span><span class="highlight-legend-item"><span class="highlight-swatch hook"></span>红：安装或恢复 Hook</span><span class="highlight-legend-item"><span class="highlight-swatch effect"></span>绿：改变游戏行为</span><span class="highlight-legend-item"><span class="highlight-swatch risk"></span>橙：风险或依赖</span></div></div><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><script type="text/plain" id="src-release">// aim.js - 自瞄 v2 — 基于 UnityCrossFire.dll 逆向方案
// 双定时器(aimLoop 16ms + targetScanner 30ms) + 角度计算 + FOV过滤 + 平滑插值 + 后坐力清零

modules.aim = (function() {
  var enabled = false;
  var myPlayer = null;
  var targetEnemy = null;
  var timer = null;
  var roomHooks = [];
  var frameCount = 0;

  var CONFIG = {
    aimKey:          0,
    aimBone:         7,
    smoothness:      1.0,
    maxAimDistance:  200.0,
    maxAngleFOV:     30.0,
    visibilityCheck: false,
    autoAim:         false,
    debugLog:        true,
  };

  var singletonGetter = null;
  var compGetTransform = null;
  var transformGetPos = null;
  var isMyPlayerFn = null;
  var isDeadFn = null;
  var getTeamFn = null;
  var addCamRotFn = null;
  var getMouseBtnFn = null;
  var linecastFn = null;

  var aimTimer = null;
  var scanTimer = null;
  var debugTimer = null;
  var cachedTarget = null;
  var scanYawDeg = 0;
  var scanPitchDeg = 0;

  var RVA_AIM = {
    SingletonGet:                    0x4A8170,
    GM_Singleton_MethodInfo:         0xE1CE64,
    Component_get_transform:         0x32CF40,
    Transform_get_position:          0x3F42B0,
    Player_get_isMyPlayer:           0xB55FD0,
    Entity_get_isDead:               0xB400E0,
    Entity_get_team:                 0x1E0070,
    Player_AddCameraRotation:        0xB4F790,
    Input_GetMouseButton:            0xACFB20,
    Physics_Linecast:                0xAB9B80,
  };

  var OFF_AIM = {
    GM_allPlayers:      0x1C,
    GM_playersBL:       0x20,
    GM_playersGR:       0x28,
    E_team:             0x20,
    P_cameraRotation:   0x4C,
    P_recoil:           0x54,
    P_characterContainer: 0x58,
    Arr_len:            0x0C,
    Arr_data:           0x10,
    List_items:         0x08,
    List_size:          0x0C,
    ptrSize:            4,
  };

  function getGM() {
    try {
      var base = getGameAssembly().base;
      var mi = base.add(RVA_AIM.GM_Singleton_MethodInfo).readPointer();
      if (mi.isNull()) {
        return singletonGetter(ptr(0));
      }
      var gm = singletonGetter(mi);
      if (gm.isNull()) return null;
      return gm;
    } catch(e) { return null; }
  }

  function initNativeFunctions() {
    var mod = getGameAssembly();
    if (!mod) return false;
    var base = mod.base;

    try { singletonGetter = new NativeFunction(base.add(RVA_AIM.SingletonGet), 'pointer', ['pointer']); } catch(e) { return false; }
    try { compGetTransform = new NativeFunction(base.add(RVA_AIM.Component_get_transform), 'pointer', ['pointer', 'pointer']); } catch(e) { return false; }
    try { transformGetPos = new NativeFunction(base.add(RVA_AIM.Transform_get_position), 'void', ['pointer', 'pointer', 'pointer']); } catch(e) { return false; }
    try { isMyPlayerFn = new NativeFunction(base.add(RVA_AIM.Player_get_isMyPlayer), 'bool', ['pointer', 'pointer']); } catch(e) { return false; }
    try { isDeadFn = new NativeFunction(base.add(RVA_AIM.Entity_get_isDead), 'bool', ['pointer', 'pointer']); } catch(e) { return false; }
    try { getTeamFn = new NativeFunction(base.add(RVA_AIM.Entity_get_team), 'int32', ['pointer', 'pointer']); } catch(e) { getTeamFn = null; }
    try { addCamRotFn = new NativeFunction(base.add(RVA_AIM.Player_AddCameraRotation), 'void', ['pointer', 'float', 'float', 'pointer']); } catch(e) { return false; }
    try { getMouseBtnFn = new NativeFunction(base.add(RVA_AIM.Input_GetMouseButton), 'bool', ['int32', 'pointer']); } catch(e) { getMouseBtnFn = null; }
    try { linecastFn = new NativeFunction(base.add(RVA_AIM.Physics_Linecast), 'bool', ['pointer', 'pointer', 'int32', 'pointer']); } catch(e) { linecastFn = null; }

    return true;
  }

  function isValidPlayer(pp) {
    if (!pp || pp.isNull()) return false;
    try {
      var team = pp.add(OFF_AIM.E_team).readS32();
      return (team === 0 || team === 1 || team === 2);
    } catch(e) { return false; }
  }

  function readList(listPtr) {
    var result = [];
    if (!listPtr || listPtr.isNull()) return result;
    try {
      var items = listPtr.add(OFF_AIM.List_items).readPointer();
      if (!items || items.isNull()) return result;
      var count = listPtr.add(OFF_AIM.List_size).readS32();
      for (var i = 0; i < count; i++) {
        var elem = items.add(OFF_AIM.Arr_data + i * OFF_AIM.ptrSize).readPointer();
        if (elem && !elem.isNull()) result.push(elem);
      }
    } catch(e) {}
    return result;
  }

  function readArray(arrPtr) {
    var result = [];
    if (!arrPtr || arrPtr.isNull()) return result;
    try {
      var len = arrPtr.add(OFF_AIM.Arr_len).readU32();
      for (var i = 0; i < len; i++) {
        var elem = arrPtr.add(OFF_AIM.Arr_data + i * OFF_AIM.ptrSize).readPointer();
        if (elem && !elem.isNull()) result.push(elem);
      }
    } catch(e) {}
    return result;
  }

  function getAllPlayers(gm) {
    var map = {};
    var arr = readArray(gm.add(OFF_AIM.GM_allPlayers).readPointer());
    for (var i = 0; i < arr.length; i++) {
      if (isValidPlayer(arr[i])) map[arr[i].toString()] = arr[i];
    }
    var bl = readList(gm.add(OFF_AIM.GM_playersBL).readPointer());
    for (var i = 0; i < bl.length; i++) {
      if (isValidPlayer(bl[i])) map[bl[i].toString()] = bl[i];
    }
    var gr = readList(gm.add(OFF_AIM.GM_playersGR).readPointer());
    for (var i = 0; i < gr.length; i++) {
      if (isValidPlayer(gr[i])) map[gr[i].toString()] = gr[i];
    }
    return Object.values(map);
  }

  function getPlayerPos(player) {
    if (!player || player.isNull()) return null;
    try {
      var transform = compGetTransform(player, ptr(0));
      if (transform && !transform.isNull()) {
        var posBuf = Memory.alloc(12);
        transformGetPos(posBuf, transform, ptr(0));
        var x = posBuf.readFloat();
        var y = posBuf.add(4).readFloat();
        var z = posBuf.add(8).readFloat();
        if (Math.abs(x) < 5000 && Math.abs(y) < 5000 && Math.abs(z) < 5000) {
          return { x: x, y: y, z: z };
        }
      }
      var container = player.add(OFF_AIM.P_characterContainer).readPointer();
      if (container && !container.isNull()) {
        var x = container.add(0x38).readFloat();
        var y = container.add(0x3C).readFloat();
        var z = container.add(0x40).readFloat();
        if (Math.abs(x) < 5000 && Math.abs(y) < 5000 && Math.abs(z) < 5000) {
          return { x: x, y: y, z: z };
        }
      }
    } catch(e) {}
    return null;
  }

  function getBonePos(player, boneIndex) {
    var pos = getPlayerPos(player);
    if (!pos) return null;
    var yOffsets = [1.65, 1.45, 1.05, 0.85, 0.75];
    var yOff = yOffsets[boneIndex % yOffsets.length] || 1.05;
    pos.y += yOff;
    return pos;
  }

  function checkVisibility(from, to) {
    if (!linecastFn) return true;
    try {
      var buf1 = Memory.alloc(12);
      buf1.writeFloat(from.x); buf1.add(4).writeFloat(from.y); buf1.add(8).writeFloat(from.z);
      var buf2 = Memory.alloc(12);
      buf2.writeFloat(to.x); buf2.add(4).writeFloat(to.y); buf2.add(8).writeFloat(to.z);
      return !linecastFn(buf1, buf2, -1, ptr(0));
    } catch(e) { return true; }
  }

  function targetScanner() {
    if (!enabled) return;
    var gm = getGM();
    if (!gm || gm.isNull()) return;

    if (!myPlayer || myPlayer.isNull()) {
      var all = getAllPlayers(gm);
      for (var i = 0; i < all.length; i++) {
        try { if (isMyPlayerFn(all[i], ptr(0))) { myPlayer = all[i]; break; } } catch(e) {}
      }
      if (!myPlayer) { cachedTarget = null; return; }
    }

    try { if (!isMyPlayerFn(myPlayer, ptr(0))) { myPlayer = null; cachedTarget = null; return; } } catch(e) { myPlayer = null; cachedTarget = null; return; }
    try { if (isDeadFn(myPlayer, ptr(0))) return; } catch(e) { return; }

    var myPos = getBonePos(myPlayer, CONFIG.aimBone);
    if (!myPos) return;

    scanYawDeg = myPlayer.add(OFF_AIM.P_cameraRotation).readFloat();
    scanPitchDeg = myPlayer.add(OFF_AIM.P_cameraRotation + 4).readFloat();

    var allPlayers = getAllPlayers(gm);
    var myTeam = 0;
    try {
      if (getTeamFn) myTeam = getTeamFn(myPlayer, ptr(0));
      else myTeam = myPlayer.add(OFF_AIM.E_team).readS32();
    } catch(e) {}

    var best = null;
    var bestAngleDeg = 999999;

    for (var i = 0; i < allPlayers.length; i++) {
      var p = allPlayers[i];
      try {
        if (p.equals(myPlayer)) continue;
        if (isDeadFn(p, ptr(0))) continue;
        var team = getTeamFn ? getTeamFn(p, ptr(0)) : p.add(OFF_AIM.E_team).readS32();
        var isEnemy = (myTeam === 2) || (team === 2) || (myTeam !== team);
        if (!isEnemy) continue;

        var targetPos = getBonePos(p, CONFIG.aimBone);
        if (!targetPos) continue;

        if (CONFIG.visibilityCheck) {
          if (!checkVisibility(myPos, targetPos)) continue;
        }

        var dx = targetPos.x - myPos.x;
        var dy = targetPos.y - myPos.y;
        var dz = targetPos.z - myPos.z;
        var dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist > CONFIG.maxAimDistance) continue;

        var targetYawDeg = Math.atan2(dx, dz) * 180.0 / Math.PI;
        var targetPitchDeg = Math.atan2(dy, Math.sqrt(dx*dx + dz*dz)) * 180.0 / Math.PI;

        var yawDiff = targetYawDeg - scanYawDeg;
        var pitchDiff = targetPitchDeg - scanPitchDeg;
        if (yawDiff > 180) yawDiff -= 360;
        if (yawDiff < -180) yawDiff += 360;
        if (pitchDiff > 180) pitchDiff -= 360;
        if (pitchDiff < -180) pitchDiff += 360;
        var angleDeg = Math.sqrt(yawDiff*yawDiff + pitchDiff*pitchDiff);

        if (angleDeg > CONFIG.maxAngleFOV) continue;

        if (angleDeg < bestAngleDeg) {
          bestAngleDeg = angleDeg;
          best = { player: p, pos: targetPos, targetYawDeg: targetYawDeg, targetPitchDeg: targetPitchDeg, angleDeg: angleDeg, dist: dist };
        }
      } catch(e) {}
    }

    cachedTarget = best;
  }

  function writeAimbot() {
    if (!enabled || !myPlayer || !cachedTarget) return;

    try {
      var curYawDeg = myPlayer.add(OFF_AIM.P_cameraRotation).readFloat();
      var curPitchDeg = myPlayer.add(OFF_AIM.P_cameraRotation + 4).readFloat();
      var userYawDelta = curYawDeg - scanYawDeg;
      var userPitchDelta = curPitchDeg - scanPitchDeg;
      if (userYawDelta > 180) userYawDelta -= 360;
      if (userYawDelta < -180) userYawDelta += 360;
      if (userPitchDelta > 180) userPitchDelta -= 360;
      if (userPitchDelta < -180) userPitchDelta += 360;
      var userAngleDelta = Math.sqrt(userYawDelta*userYawDelta + userPitchDelta*userPitchDelta);

      if (userAngleDelta > CONFIG.maxAngleFOV * 0.5) {
        cachedTarget = null;
        return;
      }

      var targetYawDeg = cachedTarget.targetYawDeg;
      var targetPitchDeg = cachedTarget.targetPitchDeg;

      var finalYawDeg = targetYawDeg;
      var finalPitchDeg = targetPitchDeg;
      if (CONFIG.smoothness < 1.0 && CONFIG.smoothness > 0.0) {
        var yawDiff = targetYawDeg - curYawDeg;
        var pitchDiff = targetPitchDeg - curPitchDeg;
        if (yawDiff > 180) yawDiff -= 360;
        if (yawDiff < -180) yawDiff += 360;
        if (pitchDiff > 180) pitchDiff -= 360;
        if (pitchDiff < -180) pitchDiff += 360;
        finalYawDeg = curYawDeg + yawDiff * CONFIG.smoothness;
        finalPitchDeg = curPitchDeg + pitchDiff * CONFIG.smoothness;
      }

      myPlayer.add(OFF_AIM.P_cameraRotation).writeFloat(finalYawDeg);
      myPlayer.add(OFF_AIM.P_cameraRotation + 4).writeFloat(finalPitchDeg);

      var recoil = myPlayer.add(OFF_AIM.P_recoil).readPointer();
      if (recoil && !recoil.isNull()) {
        recoil.add(0x10).writeU32(0);
        recoil.add(0x24).writeU32(0);
        recoil.add(0x40).writeU32(0);
        recoil.add(0x54).writeU32(0);
      }

      frameCount++;
    } catch(e) {}
  }

  function aimLoop() {
    if (!enabled) return;

    if (!CONFIG.autoAim) {
      if (!getMouseBtnFn) return;
      try {
        var btnDown = getMouseBtnFn(CONFIG.aimKey, ptr(0));
        if (!btnDown) return;
      } catch(e) { return; }
    }

    if (!myPlayer) return;
    if (!cachedTarget) return;

    writeAimbot();
  }

  function installRoomHooks(base) {
    var addrs = [0xAF9A90, 0xAEE370, 0xAF5B30];
    for (var i = 0; i < addrs.length; i++) {
      try {
        var h = Interceptor.attach(base.add(addrs[i]), {
          onEnter: function() {
            myPlayer = null;
            targetEnemy = null;
            frameCount = 0;
          }
        });
        roomHooks.push(h);
      } catch(e) {}
    }
  }

  return {
    enable: function() {
      if (enabled) return;
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '自瞄', '无 GameAssembly.dll'); return; }
      if (!initNativeFunctions()) { sendLog('error', '自瞄', 'NativeFunction 初始化失败'); return; }
      installRoomHooks(mod.base);
      aimTimer = setInterval(aimLoop, 16);
      scanTimer = setInterval(targetScanner, 30);
      enabled = true;
      sendLog('success', '自瞄', '已启用');
      sendStatus('aim', true);
    },
    disable: function() {
      if (!enabled) return;
      if (aimTimer) { clearInterval(aimTimer); aimTimer = null; }
      if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
      if (debugTimer) { clearInterval(debugTimer); debugTimer = null; }
      for (var i = 0; i < roomHooks.length; i++) { try { roomHooks[i].detach(); } catch(e) {} }
      roomHooks = [];
      myPlayer = null;
      targetEnemy = null;
      enabled = false;
      sendLog('info', '自瞄', '已禁用');
      sendStatus('aim', false);
    },
    isEnabled: function() { return enabled; },
    setConfig: function(cfg) {
      if (cfg.smoothness !== undefined) CONFIG.smoothness = cfg.smoothness;
      if (cfg.maxAimDistance !== undefined) CONFIG.maxAimDistance = cfg.maxAimDistance;
      if (cfg.maxAngleFOV !== undefined) CONFIG.maxAngleFOV = cfg.maxAngleFOV;
      if (cfg.visibilityCheck !== undefined) CONFIG.visibilityCheck = cfg.visibilityCheck;
      if (cfg.autoAim !== undefined) CONFIG.autoAim = cfg.autoAim;
    },
    getConfig: function() {
      return { smoothness: CONFIG.smoothness, maxAngleFOV: CONFIG.maxAngleFOV, maxAimDistance: CONFIG.maxAimDistance, autoAim: CONFIG.autoAim, visibilityCheck: CONFIG.visibilityCheck };
    }
  };
})();
</script><script type="text/plain" id="src-main">// ====================================================================
// 自瞄模块 v2 — 基于 UnityCrossFire.dll 逆向方案（BUG修复版）
// 参考: 02-小工具dll逆向分析 copy.md
//
// 核心思路（完全还原 DLL 方案）:
//   1. GetAsyncKeyState 检测热键（或 Input.GetMouseButton）
//   2. 获取 GameManager → 找到 myPlayer
//   3. 遍历 allPlayers/playersBL/playersGR
//   4. 排除: 自己(isMyPlayer) / 死亡(isDead) / 同队(team)
//   5. 获取目标位置: get_transform() → get_position()
//   6. 计算角度: yaw=atan2(dx,dz) pitch=atan2(dy,distance)  单位: 弧度

    }

    // ================================================================
    // 调试扫描（每 2 秒输出一次完整数据，无需按键）
    // 用于验证: 坐标读取是否正确、角度计算是否正确
    // ================================================================
    function debugScan() {
      if (!CONFIG.debugLog || !enabled) return;

      var gm = getGM();
      if (!gm || gm.isNull()) return;

      // 找本地玩家
      if (!myPlayer || myPlayer.isNull()) {
        var all = getAllPlayers(gm);
        for (var i = 0; i < all.length; i++) {
          try { if (isMyPlayerFn(all[i], ptr(0))) { myPlayer = all[i]; break; } } catch(e) {}
        }
        if (!myPlayer) return;
      }

      // 自己位置
      var myPos = getBonePos(myPlayer, BONE.CHEST);
      if (!myPos) return;

      var curYawDeg = myPlayer.add(OFF.P_cameraRotation).readFloat();
      var curPitchDeg = myPlayer.add(OFF.P_cameraRotation + 4).readFloat();

      console.log('');
      console.log('========== 📊 自瞄调试数据 ==========');
      console.log('[调试] 我的坐标: (' + myPos.x.toFixed(1) + ', ' + myPos.y.toFixed(1) + ', ' + myPos.z.toFixed(1) + ')');
      console.log('[调试] 当前视角: yaw=' + curYawDeg.toFixed(2) + '°  pitch=' + curPitchDeg.toFixed(2) + '°');

      // 遍历敌人
      var allPlayers = getAllPlayers(gm);
      var myTeam = 0;
      try {
        if (getTeamFn) myTeam = getTeamFn(myPlayer, ptr(0));
        else myTeam = myPlayer.add(OFF.E_team).readS32();
      } catch(e) {}

      var enemies = [];
      for (var i = 0; i < allPlayers.length; i++) {
        var p = allPlayers[i];
        try {
          if (p.equals(myPlayer)) continue;
          if (isDeadFn(p, ptr(0))) continue;
          var team = getTeamFn ? getTeamFn(p, ptr(0)) : p.add(OFF.E_team).readS32();
          if (team === myTeam) continue;
          enemies.push(p);
        } catch(e) {}
      }

      if (enemies.length === 0) {
        console.log('[调试] ❌ 没有敌人');
        console.log('========================================');
        return;
      }

      console.log('[调试] 敌人总数: ' + enemies.length);
      console.log('');

      for (var i = 0; i < enemies.length; i++) {
        try {
          var enemyPos = getBonePos(enemies[i], CONFIG.aimBone);
          if (!enemyPos) { console.log('[调试] 敌人#' + i + ' 坐标获取失败'); continue; }

          var dx = enemyPos.x - myPos.x;
          var dy = enemyPos.y - myPos.y;
          var dz = enemyPos.z - myPos.z;
          var dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

          var angles = calcAngles(myPos, enemyPos);
          if (!angles) { console.log('[调试] 敌人#' + i + ' 角度计算失败'); continue; }

          var targetYawDeg = angles.yaw * 180.0 / Math.PI;
          var targetPitchDeg = angles.pitch * 180.0 / Math.PI;

          // 当前视角直接是度, 目标角度转度后比较
          var yawDiffDeg = targetYawDeg - curYawDeg;
          var pitchDiffDeg = targetPitchDeg - curPitchDeg;
          if (yawDiffDeg > 180) yawDiffDeg -= 360;
          if (yawDiffDeg < -180) yawDiffDeg += 360;
          if (pitchDiffDeg > 180) pitchDiffDeg -= 360;
          if (pitchDiffDeg < -180) pitchDiffDeg += 360;
          var fovDeg = Math.sqrt(yawDiffDeg*yawDiffDeg + pitchDiffDeg*pitchDiffDeg);
          var targetYawRad = angles.yaw;
          var targetPitchRad = angles.pitch;
          var curYawRad = curYawDeg * Math.PI / 180.0;
          var curPitchRad = curPitchDeg * Math.PI / 180.0;
          var yawDiffRad = normalizeAngle(targetYawRad - curYawRad);
          var pitchDiffRad = normalizeAngle(targetPitchRad - curPitchRad);

          var visResult = checkVisibility(myPos, enemyPos);
          var visible = visResult ? '[可见]' : '[遮挡]';
          console.log('[调试] 敌人#' + i + ' ptr=' + enemies[i] + ' ' + visible +
            ' 坐标=(' + enemyPos.x.toFixed(1) + ', ' + enemyPos.y.toFixed(1) + ', ' + enemyPos.z.toFixed(1) + ')' +
            ' 距离=' + dist.toFixed(1) + 'm');
          console.log('[调试]   → 目标: ' + targetYawDeg.toFixed(1) + '° 当前: ' + curYawDeg.toFixed(1) + '° 差: ' + yawDiffDeg.toFixed(1) + '° FOV=' + fovDeg.toFixed(1) + '°');
          console.log('[调试]   → 验证: atan2(dx=' + dx.toFixed(1) + ', dz=' + dz.toFixed(1) + ')=' + targetYawDeg.toFixed(1) + '°' +
            '  atan2(dy=' + dy.toFixed(1) + ', hDist=' + Math.sqrt(dx*dx+dz*dz).toFixed(1) + ')=' + targetPitchDeg.toFixed(1) + '°');
        } catch(e) {
          console.log('[调试] 敌人#' + i + ' 异常: ' + e.message);
        }
      }
      console.log('========================================');
      console.log('');
    }

    // ================================================================
    // 房间切换 Hook
    // ================================================================
    function installRoomHooks(base) {
      var addrs = [0xAF9A90, 0xAEE370, 0xAF5B30];
      for (var i = 0; i < addrs.length; i++) {
        try {
          var h = Interceptor.attach(base.add(addrs[i]), {
            onEnter: function() {
              myPlayer = null;
              targetEnemy = null;
              frameCount = 0;
              console.log('[自瞄] 房间切换，状态重置');
            }
          });
          roomHooks.push(h);
        } catch(e) {}
      }
    }

    // ================================================================
    // 公开接口
    // ================================================================
    return {
      enable: function() {
        if (enabled) {
          console.log('[自瞄] 已启用，跳过');
          return;
        }
        var mod = getGameAssembly();
        if (!mod) {
          console.log('[自瞄] 无 GameAssembly.dll');
          return;
        }

        if (!initNativeFunctions()) {
          console.log('[自瞄] NativeFunction 初始化失败');
          return;
        }

        installRoomHooks(mod.base);

        aimTimer = setInterval(aimLoop, 16);         // 按键检测+写角度
        scanTimer = setInterval(targetScanner, 30); // 目标扫描
        if (CONFIG.debugLog) {
          debugTimer = setInterval(debugScan, 2000);
          console.log('[自瞄] 📊 调试扫描已启动（每2秒输出一次）');
        }
        enabled = true;
        console.log('[自瞄] ✅ 已启用 (触发键=' + CONFIG.aimKey +
          ' 平滑=' + CONFIG.smoothness +
          ' FOV=' + CONFIG.maxAngleFOV + '°' +
          ' 距离=' + CONFIG.maxAimDistance + 'm' +
          ' debugLog=' + CONFIG.debugLog + ')');
        console.log('[自瞄] 💡 按鼠标左键(开枪)触发自瞄，查看控制台输出数据验证');
        sendLog('success', '自瞄', '已启用');
        sendStatus('自瞄', true);
      },

      disable: function() {
        if (!enabled) return;
        if (aimTimer) { clearInterval(aimTimer); aimTimer = null; }
        if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
        if (debugTimer) { clearInterval(debugTimer); debugTimer = null; }
        for (var i = 0; i < roomHooks.length; i++) {
          try { roomHooks[i].detach(); } catch(e) {}
        }
        roomHooks = [];
        myPlayer = null;
        targetEnemy = null;
        enabled = false;
        console.log('[自瞄] ❌ 已禁用');
        sendLog('info', '自瞄', '已禁用');
        sendStatus('自瞄', false);
      },

      toggle: function() {
        if (enabled) this.disable();
        else this.enable();
      },

      isEnabled: function() { return enabled; },

      setConfig: function(cfg) {
        if (cfg.aimKey !== undefined) CONFIG.aimKey = cfg.aimKey;
        if (cfg.smoothness !== undefined) CONFIG.smoothness = cfg.smoothness;
        if (cfg.maxAimDistance !== undefined) CONFIG.maxAimDistance = cfg.maxAimDistance;
        if (cfg.maxAngleFOV !== undefined) CONFIG.maxAngleFOV = cfg.maxAngleFOV;
        if (cfg.visibilityCheck !== undefined) CONFIG.visibilityCheck = cfg.visibilityCheck;
        if (cfg.autoAim !== undefined) CONFIG.autoAim = cfg.autoAim;
        if (cfg.debugLog !== undefined) {
          CONFIG.debugLog = cfg.debugLog;
          if (enabled) {
            if (CONFIG.debugLog && !debugTimer) {
              debugTimer = setInterval(debugScan, 2000);
              console.log('[自瞄] 📊 调试扫描已启动');
            } else if (!CONFIG.debugLog && debugTimer) {
              clearInterval(debugTimer);
              debugTimer = null;
              console.log('[自瞄] 📊 调试扫描已关闭');
            }
          }
        }
        if (cfg.aimBone !== undefined) {
          if (cfg.aimBone === 'head') CONFIG.aimBone = BONE.HEAD;
          else if (cfg.aimBone === 'neck') CONFIG.aimBone = BONE.NECK;
          else if (cfg.aimBone === 'chest') CONFIG.aimBone = BONE.CHEST;
          else if (cfg.aimBone === 'pelvis') CONFIG.aimBone = BONE.PELVIS;
          else CONFIG.aimBone = cfg.aimBone;
        }
        console.log('[自瞄] 配置更新: ' + JSON.stringify(cfg));
      },

      getTarget: function() { return cachedTarget ? cachedTarget.player : null; },
      getConfig: function() {
        return {
          smoothness: CONFIG.smoothness,
          aimBone: CONFIG.aimBone,
          maxAngleFOV: CONFIG.maxAngleFOV,
          maxAimDistance: CONFIG.maxAimDistance,
          autoAim: CONFIG.autoAim,
          visibilityCheck: CONFIG.visibilityCheck,
          debugLog: CONFIG.debugLog,
          frameCount: frameCount,
        };
      },
    };
  })();

  // ================================================================
  // rpc.exports
  // ================================================================
  rpc.exports = {
    aimEnable: function() { aimModule.enable(); return 'ok'; },
    aim_enable: function() { aimModule.enable(); return 'ok'; },
    aimDisable: function() { aimModule.disable(); return 'ok'; },
    aim_disable: function() { aimModule.disable(); return 'ok'; },
    aimToggle: function() { aimModule.toggle(); return aimModule.isEnabled() ? 'enabled' : 'disabled'; },
    aim_toggle: function() { aimModule.toggle(); return aimModule.isEnabled() ? 'enabled' : 'disabled'; },
    aimStatus: function() { return aimModule.isEnabled() ? 'enabled' : 'disabled'; },
    aim_status: function() { return aimModule.isEnabled() ? 'enabled' : 'disabled'; },
    aimSetConfig: function(jsonStr) {
      try { aimModule.setConfig(JSON.parse(jsonStr)); return 'ok'; }
      catch(e) { return 'error: ' + e.message; }
    },
    aim_set_config: function(jsonStr) {
      try { aimModule.setConfig(JSON.parse(jsonStr)); return 'ok'; }
      catch(e) { return 'error: ' + e.message; }
    },
    aimGetStatus: function() {
      var cfg = aimModule.getConfig();
      return JSON.stringify({
        enabled: aimModule.isEnabled(),
        targetEnemy: aimModule.getTarget() ? aimModule.getTarget().toString() : null,
        smoothness: cfg.smoothness,
        aimBone: cfg.aimBone,
        maxAngleFOV: cfg.maxAngleFOV,
        maxAimDistance: cfg.maxAimDistance,
        autoAim: cfg.autoAim,
        visibilityCheck: cfg.visibilityCheck,
        debugLog: cfg.debugLog,
        frameCount: cfg.frameCount,
      });
    },
    aim_get_status: function() {
      var cfg = aimModule.getConfig();
      return JSON.stringify({
        enabled: aimModule.isEnabled(),
        targetEnemy: aimModule.getTarget() ? aimModule.getTarget().toString() : null,
        smoothness: cfg.smoothness,
        aimBone: cfg.aimBone,
        maxAngleFOV: cfg.maxAngleFOV,
        maxAimDistance: cfg.maxAimDistance,
        autoAim: cfg.autoAim,
        visibilityCheck: cfg.visibilityCheck,
        debugLog: cfg.debugLog,
        frameCount: cfg.frameCount,
      });
    },
  };

  // 自动启用
  console.log('[自瞄] 脚本加载完成，正在自动启用...');
  aimModule.enable();
})();
