<html lang="zh-CN">
<head>

  <style>

    .top { position: sticky; top: 0; z-index: 20; min-height: var(--top-height); display: grid; grid-template-columns:minmax(300px,1fr) auto auto; align-items: center; gap: 18px; padding: 10px 18px; color: #fff; background: var(--shell); box-shadow: 0 2px 8px rgba(14,22,28,.22); }

    .code-scroll { padding: 8px 0 30px; overflow-x: auto; }

    .line-row { display: grid; grid-template-columns: 48px 1fr; min-height: 22px; font: 13px/1.7 Consolas, monospace; }

    .line-code { padding: 0 16px; white-space: pre; }
    .line-row.key-address { background: rgba(45,108,148,.14); box-shadow: inset 3px 0 var(--blue); }
    .line-row.key-hook { background: rgba(167,65,65,.13); box-shadow: inset 3px 0 var(--red); }
    .line-row.key-effect { background: rgba(32,126,97,.17); box-shadow: inset 3px 0 var(--mint); }
    .line-row.key-risk { background: rgba(180,104,30,.16); box-shadow: inset 3px 0 var(--orange); }
    .block.active .line-row.key-address { background: rgba(45,108,148,.31); box-shadow: inset 5px 0 #56a8d6; }
    .block.active .line-row.key-hook { background: rgba(167,65,65,.29); box-shadow: inset 5px 0 #dd7474; }

    .address-note { display: inline-flex; margin-left: 12px; padding: 1px 7px; color: #a8dcf7; background: #17384c; border: 1px solid #397da5; border-radius: 4px; font: 700 11px "Microsoft YaHei", sans-serif; }

    .step.original { color: #1f5b80; background: #edf5fa; border-color: #b8d1e0; }

    .arrow { height: 19px; color: #77838c; text-align: center; font-weight: 800; }
    .ref { float: right; margin-left: 8px; padding: 1px 6px; color: #17634f; background: #d7ede5; border: 1px solid #9bc9ba; border-radius: 4px; font: 700 11px Consolas, monospace; }
    .result { margin: 11px 0 0; padding: 9px 10px; color: #73420f; background: #fff3e3; border-left: 3px solid #bd742c; }
    .toast { position: fixed; right: 22px; bottom: 20px; padding: 9px 12px; color: #fff; background: #202832; border-radius: 5px; opacity: 0; transform: translateY(8px); transition: .18s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }

    textarea, input { font: inherit; letter-spacing: 0; }
    .qa-pane { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
    .qa-head { flex: 0 0 auto; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
    .qa-zone-title { display: flex; align-items: center; margin-bottom: 8px; }
    .qa-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .save-state { color: #27705d; font-size: 12px; white-space: nowrap; }

    .file-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .btn { min-height: 34px; padding: 6px 10px; color: #35434c; background: #f7f9fa; border: 1px solid #cbd3d8; border-radius: 5px; }
    .btn:hover { background: #edf2f4; }
    .btn.primary { color: #fff; background: var(--green); border-color: var(--green); }
    .btn.danger { color: #8e3c3d; }
    .qa-scroll { flex: 1 1 auto; overflow-y: auto; padding: 0 20px 34px; }
    .composer { margin-top: 12px; padding: 13px; background: #f7f9fa; border: 1px solid var(--line); border-radius: 6px; }
    .composer label { display: block; margin-bottom: 6px; font-weight: 700; }
    textarea { width: 100%; resize: vertical; color: var(--ink); background: #fff; border: 1px solid #c8d1d6; border-radius: 5px; padding: 9px 10px; outline: none; }
    textarea:focus { border-color: #4b927f; box-shadow: 0 0 0 2px #dceee8; }
    #newQuestion { min-height: 78px; overflow-y: hidden; resize: none; }
    .context-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; color: var(--muted); font-size: 12px; }
    .context-chip { display: inline-block; max-width: 74%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 3px 7px; color: #315f52; background: #e7f2ee; border: 1px solid #c7dfd7; border-radius: 4px; }
    .question-list { display: grid; gap: 11px; margin-top: 14px; }
    .question-card { padding: 13px; border: 1px solid var(--line); border-left: 4px solid #b06a30; border-radius: 6px; background: #f7f9fa; cursor: pointer; }
    .question-card.answered { border-left-color: var(--green); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-bottom: 8px; }
    .status { padding: 2px 7px; color: #8a4e1c; background: #fff0e2; border-radius: 4px; font-size: 12px; }
    .answered .status { color: #23604f; background: #e3f2ed; }
    .needs-review .status { color: #7a4a13; background: #fff0d5; }
    .card-tools { display: flex; gap: 5px; }
    .icon-btn { width: 30px; height: 30px; padding: 0; color: #59666e; background: #f7f9fa; border: 1px solid #d2d9dd; border-radius: 4px; }
    .icon-btn:hover { background: #eaf0f2; }
    .field-label { display: block; margin: 8px 0 4px; color: #59666e; font-size: 12px; font-weight: 700; }
    .question-text { min-height: 58px; overflow-y: hidden; resize: none; font-weight: 700; }
    .answer-head { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-top: 8px; }
    .answer-head .field-label { margin: 0; }
    .copy-answer { min-height: 28px; padding: 3px 8px; color: #315f52; background: #e7f2ee; border: 1px solid #b9d7cd; border-radius: 4px; font-size: 12px; }
    .answer-text { min-height: 76px; overflow-y: hidden; resize: none; color: #26333b; font-weight: 400; }
    .card-context { margin-top: 10px; padding: 8px 10px; color: #315f52; background: #e7f2ee; border: 1px solid #c7dfd7; border-left: 4px solid var(--green); border-radius: 5px; font-size: 12px; overflow-wrap: anywhere; }
    .empty { padding: 30px 12px; color: #78858d; text-align: center; border: 1px dashed #cbd4d9; border-radius: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <header class="top">
    <div class="title-zone">

  <div class="workspace">

        <span class="file" id="fileName">scripts/XX-feature.js</span><span class="count" id="lineCount">23 行</span>
        <div class="meta" id="sourceMeta"><strong>问答上下文：</strong>问题会记录提问时选中的代码段、源码文件和行号范围。</div>
        <div class="legend">
          <span class="number">06</span><span class="zone-name">关键行图例</span>

          <span class="legend-item"><span class="swatch hook"></span>红：Hook 安装与恢复</span>
          <span class="legend-item"><span class="swatch effect"></span>绿：改变游戏行为</span>

        <span class="number">07</span><span class="zone-name">完整代码导航</span><span class="zone-note">所有分段都在下方连续展开</span>
      </nav>
      <div class="code-scroll" id="codeArea" aria-label="完整代码"></div>
    </main>

    <aside class="explain qa-pane" aria-label="问题和回答">
      <div class="qa-head">
        <div class="qa-zone-title"><span class="number">09</span><span class="zone-name">功能问答</span></div>
        <div class="qa-title-row">
          <h2>我的问题与回答</h2>
          <span class="save-state" id="saveState">已自动保存到浏览器</span>
        </div>
        <p class="explain-sub">问题和回答都可编辑并自动保存；内容会按文字多少自动展开。</p>
        <div class="file-actions">
          <button class="btn" id="openButton" type="button" title="读取已有问答 JSON">打开数据</button>
          <button class="btn" id="saveButton" type="button" title="保存到当前问答文件">保存到文件</button>
          <button class="btn" id="saveAsButton" type="button" title="生成一份新的问答 JSON">另存数据</button>
          <button class="btn" id="clearButton" type="button">新建空白</button>
          <input class="sr-only" id="fileInput" type="file" accept="application/json,.json">
        </div>
      </div>

      <div class="qa-scroll">
        <section class="composer">
          <label for="newQuestion">新增问题</label>
          <textarea id="newQuestion" placeholder="例如：这个 Hook 为什么没有区分 MyPlayer 和 Bot？"></textarea>
          <div class="context-row">
            <span class="context-chip" id="selectedContext">当前代码段：模块与开关 · L1–8</span>
            <button class="btn primary" id="addButton" type="button">添加问题</button>
          </div>
        </section>
        <div class="question-list" id="questionList"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      var feature = { number: 'XX', name: '功能名称', sourceFile: 'scripts/XX-feature.js' };
      var storageKey = 'ucf-feature-qa:' + feature.number + '-' + feature.name;
      var fileHandle = null;
      var selectedSection = 0;
      var dirtyForFile = false;

      var sourceSections = [
        {
          id: 'module', title: '模块与开关', range: 'L1–8', keys: { 2: 'address', 5: 'risk' }, addressNotes: { 2: 'GameClass.TargetMethod（示例）' },
          lines: [
            "modules.demo = (function () {",
            "  const target = base.add(0x123456); // GameClass.TargetMethod",
            "  let enabled = false;",
            "  let listener = null;",
            "  function enable() { if (enabled) return;",
            "    enabled = true;",
            "    installHook();",
            "  }"
          ]
        },
        {
          id: 'hook', title: '安装 Hook', range: 'L9–16', keys: { 2: 'hook', 4: 'effect', 7: 'risk' },
          lines: [
            "  function installHook() {",
            "    listener = Interceptor.attach(target, {",
            "      onEnter(args) {",
            "        args[1] = ptr(0); // 示例：修改传入参数",
            "      },",
            "      onLeave(retval) { retval.replace(1); }",
            "    });",
            "  }"
          ]
        },
        {
          id: 'disable', title: '关闭与清理', range: 'L17–23', keys: { 2: 'hook', 3: 'risk' },
          lines: [
            "  function disable() {",
            "    if (listener) listener.detach();",
            "    listener = null;",
            "    enabled = false;",
            "  }",
            "  return { enable, disable };",
            "})();"
          ]
        }
      ];

      var state = loadLocal() || {
        schemaVersion: 1,
        feature: feature,
        updatedAt: new Date().toISOString(),
        questions: [
          {
            id: makeId(),
            question: '示例：这段代码修改了游戏中的哪个方法？',
            answer: '',
            status: 'pending',
            questionRevision: 1,
            answeredRevision: 0,
            answeredAt: null,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            sourceContext: { sectionId: 'hook', title: '安装 Hook', lineRange: 'L9–16', sourceFile: feature.sourceFile }
          }
        ]
      };

      var codeArea = document.getElementById('codeArea');
      var sectionTabs = document.getElementById('sectionTabs');
      var questionList = document.getElementById('questionList');
      var newQuestion = document.getElementById('newQuestion');
      var selectedContext = document.getElementById('selectedContext');
      var saveState = document.getElementById('saveState');
      var fileInput = document.getElementById('fileInput');
      var toastTimer = null;

      function makeId() {
        return 'q-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
        });
      }

      function highlight(line) {
        var escaped = escapeHtml(line);
        if (/^\s*\/\//.test(line)) return '<span class="comment">' + escaped + '</span>';
        return escaped
          .replace(/(&quot;.*?&quot;)/g, '<span class="string">$1</span>')
          .replace(/\b(0x[0-9A-Fa-f]+|\d+)\b/g, '<span class="number-token">$1</span>')
          .replace(/\b(function|return|if|else|const|let|var|new|true|false|null)\b/g, '<span class="keyword">$1</span>');
      }

      function showToast(message) {
        var toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
      }

      function autoResizeTextarea(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
      }

      function loadLocal() {
        try {
          var raw = localStorage.getItem(storageKey);
          return raw ? normalizeData(JSON.parse(raw)) : null;
        } catch (error) {
          return null;
        }
      }

      function normalizeData(data) {
        if (!data || data.schemaVersion !== 1 || !Array.isArray(data.questions)) {
          throw new Error('不是受支持的功能问答数据文件');
        }
        data.feature = data.feature || feature;
        data.questions = data.questions.map(function (item) {
          var answer = String(item.answer || '');
          var questionRevision = Number(item.questionRevision) > 0 ? Number(item.questionRevision) : 1;
          var answeredRevision = Number(item.answeredRevision) >= 0
            ? Number(item.answeredRevision)
            : (answer.trim() ? questionRevision : 0);
          return {
            id: item.id || makeId(),
            question: String(item.question || ''),
            answer: answer,
            status: !answer.trim() ? 'pending' : (answeredRevision === questionRevision ? 'answered' : 'needs-review'),
            questionRevision: questionRevision,
            answeredRevision: answeredRevision,
            answeredAt: item.answeredAt || null,
            createdAt: item.createdAt || new Date().toISOString(),
            updatedAt: item.updatedAt || new Date().toISOString(),
            sourceContext: item.sourceContext || null
          };
        });
        data.questions.sort(function (left, right) {
          return String(left.createdAt).localeCompare(String(right.createdAt));
        });
        return data;
      }

      function persist(markDirty) {
        state.updatedAt = new Date().toISOString();
        localStorage.setItem(storageKey, JSON.stringify(state));
        if (markDirty !== false) dirtyForFile = true;
        updateSaveState();
      }

      function updateSaveState() {
        saveState.textContent = dirtyForFile ? '已存浏览器，文件待保存' : '浏览器与文件已同步';
        saveState.classList.toggle('dirty', dirtyForFile);
      }

      function currentContext() {
        var section = sourceSections[selectedSection];
        return { sectionId: section.id, title: section.title, lineRange: section.range, sourceFile: feature.sourceFile };
      }

      function renderCode() {
        sourceSections.forEach(function (section, index) {
          var nav = document.createElement('button');
          nav.type = 'button';
          nav.textContent = String(index + 1).padStart(2, '0') + ' ' + section.title;
          nav.setAttribute('aria-current', index === selectedSection ? 'true' : 'false');
          nav.addEventListener('click', function () { selectSection(index, true); });
          sectionTabs.appendChild(nav);

          var block = document.createElement('section');
          block.className = 'block' + (index === selectedSection ? ' active' : '');
          block.id = 'code-' + section.id;
          block.tabIndex = 0;
          var startLine = sourceSections.slice(0, index).reduce(function (sum, item) { return sum + item.lines.length; }, 0) + 1;
          var lines = section.lines.map(function (line, offset) {
            var type = section.keys[offset + 1] || '';
            var note = section.addressNotes && section.addressNotes[offset + 1];
            return '<div class="line-row ' + (type ? 'key-' + type : '') + '"><span class="line-no">' + (startLine + offset) + '</span><span class="line-code">' + highlight(line) + (note ? '<span class="address-note">' + escapeHtml(note) + '</span>' : '') + '</span></div>';
          }).join('');
          block.innerHTML = '<div class="block-label"><span class="number">08</span><span class="block-title-frame">' + escapeHtml(section.title) + ' · ' + section.range + '</span><span class="nature">问答上下文</span></div>' + lines;
          block.addEventListener('click', function () { selectSection(index, false); });
          codeArea.appendChild(block);
        });
        updateContextLabel();
      }

      function selectSection(index, scrollToBlock) {
        selectedSection = index;
        sectionTabs.querySelectorAll('button').forEach(function (button, i) {
          button.setAttribute('aria-current', i === index ? 'true' : 'false');
        });
        document.querySelectorAll('.block').forEach(function (block, i) {
          block.classList.toggle('active', i === index);
        });
        updateContextLabel();
        if (scrollToBlock) {
          var targetBlock = document.getElementById('code-' + sourceSections[index].id);
          if (targetBlock) scrollCodeBlockIntoView(targetBlock);
        }
      }

      function scrollCodeBlockIntoView(block) {
        var topBar = document.querySelector('.top');
        var topHeight = topBar ? topBar.getBoundingClientRect().height : 0;
        var stripHeight = sectionTabs.getBoundingClientRect().height;
        var targetTop = window.scrollY + block.getBoundingClientRect().top - topHeight - stripHeight - 8;
        window.scrollTo({
          top: Math.max(0, targetTop),
          behavior: 'smooth'
        });
      }

      function focusQuestionContext(item) {
        if (!item.sourceContext || !item.sourceContext.sectionId) {
          showToast('此问题未绑定代码段');
          return;
        }
        var sectionIndex = sourceSections.findIndex(function (section) {
          return section.id === item.sourceContext.sectionId;
        });
        if (sectionIndex < 0) {
          showToast('未找到对应代码段');
          return;
        }
        selectSection(sectionIndex, true);
      }

      function updateContextLabel() {
        var context = currentContext();
        selectedContext.textContent = '当前代码段：' + context.title + ' · ' + context.lineRange;
        selectedContext.title = context.sourceFile + ' · ' + context.title + ' · ' + context.lineRange;
      }

      function addQuestion() {
        var text = newQuestion.value.trim();
        if (!text) {
          newQuestion.focus();
          showToast('请先输入问题');
          return;
        }
        var now = new Date().toISOString();
        state.questions.push({
          id: makeId(), question: text, answer: '', status: 'pending',
          questionRevision: 1, answeredRevision: 0, answeredAt: null,
          createdAt: now, updatedAt: now, sourceContext: currentContext()
        });
        newQuestion.value = '';
        autoResizeTextarea(newQuestion);
        persist();
        renderQuestions();
        showToast('问题已添加并自动保存');
      }

      function statusLabel(status) {
        if (status === 'answered') return '已回答';
        if (status === 'needs-review') return '需重新回答';
        return '待回答';
      }

      function updateQuestion(id, value) {
        var item = state.questions.find(function (question) { return question.id === id; });
        if (!item || item.question === value) return;
        item.question = value;
        item.questionRevision = (Number(item.questionRevision) || 1) + 1;
        item.status = item.answer.trim() ? 'needs-review' : 'pending';
        item.updatedAt = new Date().toISOString();
        persist();
        var card = document.querySelector('[data-question-id="' + id + '"]');
        if (card) {
          card.classList.toggle('answered', item.status === 'answered');
          card.classList.toggle('needs-review', item.status === 'needs-review');
          card.querySelector('.status').textContent = statusLabel(item.status);
        }
      }

      function updateAnswer(id, value) {
        var item = state.questions.find(function (question) { return question.id === id; });
        if (!item || item.answer === value) return;
        var now = new Date().toISOString();
        item.answer = value;
        item.status = value.trim() ? 'answered' : 'pending';
        item.answeredRevision = value.trim() ? item.questionRevision : 0;
        item.answeredAt = value.trim() ? now : null;
        item.updatedAt = now;
        persist();
        var card = document.querySelector('[data-question-id="' + id + '"]');
        if (card) {
          card.classList.toggle('answered', item.status === 'answered');
          card.classList.remove('needs-review');
          card.querySelector('.status').textContent = statusLabel(item.status);
        }
      }

      function deleteQuestion(id) {
        if (!confirm('删除这个问题及其回答？')) return;
        state.questions = state.questions.filter(function (item) { return item.id !== id; });
        persist();
        renderQuestions();
      }

      function renderQuestions() {
        questionList.innerHTML = '';
        if (!state.questions.length) {
          questionList.innerHTML = '<div class="empty">还没有问题。先在上方输入一个你真正想弄清楚的问题。</div>';
          return;
        }
        state.questions.forEach(function (item, index) {
          var card = document.createElement('article');
          card.className = 'question-card' + (item.status === 'answered' ? ' answered' : '') + (item.status === 'needs-review' ? ' needs-review' : '');
          card.dataset.questionId = item.id;
          var contextText = item.sourceContext
            ? item.sourceContext.sourceFile + ' · ' + item.sourceContext.title + ' · ' + item.sourceContext.lineRange
            : '未绑定代码段';
          card.innerHTML =
            '<div class="card-head"><span class="status">' + statusLabel(item.status) + '</span>' +
            '<div class="card-tools"><button class="icon-btn copy" type="button" title="复制问题">⧉</button><button class="icon-btn delete" type="button" title="删除问题">×</button></div></div>' +
            '<label class="field-label">问题 ' + (index + 1) + '</label><textarea class="question-text"></textarea>' +
            '<div class="answer-head"><label class="field-label">回答</label><button class="copy-answer" type="button">复制回答</button></div>' +
            '<textarea class="answer-text" placeholder="等待填写回答。"></textarea>' +
            '<div class="card-context"><strong>代码上下文：</strong>' + escapeHtml(contextText) + '</div>';
          var questionInput = card.querySelector('.question-text');
          var answerInput = card.querySelector('.answer-text');
          questionInput.value = item.question;
          answerInput.value = item.answer;
          questionInput.addEventListener('input', function () {
            autoResizeTextarea(questionInput);
            updateQuestion(item.id, questionInput.value);
          });
          answerInput.addEventListener('input', function () {
            autoResizeTextarea(answerInput);
            updateAnswer(item.id, answerInput.value);
          });
          card.querySelector('.delete').addEventListener('click', function () { deleteQuestion(item.id); });
          card.querySelector('.copy').addEventListener('click', function () {
            navigator.clipboard.writeText(item.question).then(function () { showToast('问题已复制'); }, function () { showToast('浏览器未允许复制'); });
          });
          card.querySelector('.copy-answer').addEventListener('click', function () {
            if (!item.answer.trim()) { showToast('暂无回答可复制'); return; }
            navigator.clipboard.writeText(item.answer).then(function () { showToast('回答已复制'); }, function () { showToast('浏览器未允许复制'); });
          });
          card.addEventListener('click', function (event) {
            if (event.target.closest('button')) return;
            focusQuestionContext(item);
          });
          questionList.appendChild(card);
          autoResizeTextarea(questionInput);
          autoResizeTextarea(answerInput);
        });
      }

      function validateIncoming(data) {
        var normalized = normalizeData(data);
        if (normalized.feature && normalized.feature.number !== feature.number) {
          if (!confirm('数据文件属于功能 ' + normalized.feature.number + '，当前模板是 ' + feature.number + '。仍要打开吗？')) return null;
        }
        return normalized;
      }

      function applyIncoming(data) {
        var incoming = validateIncoming(data);
        if (!incoming) return;
        if (state.questions.length && !confirm('打开数据会替换当前页面中的问答，是否继续？')) return;
        state = incoming;
        dirtyForFile = false;
        persist(false);
        renderQuestions();
        showToast('问答数据已打开');
      }

      async function openData() {
        if ('showOpenFilePicker' in window) {
          try {
            var handles = await window.showOpenFilePicker({
              multiple: false,
              types: [{ description: '功能问答数据', accept: { 'application/json': ['.json'] } }]
            });
            var handle = handles[0];
            var file = await handle.getFile();
            var data = JSON.parse(await file.text());
            applyIncoming(data);
            fileHandle = handle;
            return;
          } catch (error) {
            if (error.name !== 'AbortError') showToast('打开失败：' + error.message);
            return;
          }
        }
        fileInput.click();
      }

      function readFallbackFile(file) {
        var reader = new FileReader();
        reader.onload = function () {
          try { applyIncoming(JSON.parse(reader.result)); }
          catch (error) { showToast('无法读取：' + error.message); }
        };
        reader.onerror = function () { showToast('文件读取失败'); };
        reader.readAsText(file, 'utf-8');
      }

      function dataText() {
        state.updatedAt = new Date().toISOString();
        return JSON.stringify(state, null, 2) + '\n';
      }

      async function writeHandle(handle) {
        var writable = await handle.createWritable();
        await writable.write(dataText());
        await writable.close();
        fileHandle = handle;
        dirtyForFile = false;
        persist(false);
        showToast('已保存到问答数据文件');
      }

      function downloadData() {
        var blob = new Blob([dataText()], { type: 'application/json;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = feature.number + '-' + feature.name + '-功能问答.json';
        link.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 0);
        dirtyForFile = false;
        persist(false);
        showToast('问答数据已导出');
      }

      async function chooseSaveHandle() {
        return window.showSaveFilePicker({
          suggestedName: feature.number + '-' + feature.name + '-功能问答.json',
          types: [{ description: '功能问答数据', accept: { 'application/json': ['.json'] } }]
        });
      }

      async function saveData(saveAs) {
        try {
          if (!saveAs && fileHandle) {
            await writeHandle(fileHandle);
          } else if ('showSaveFilePicker' in window) {
            await writeHandle(await chooseSaveHandle());
          } else {
            downloadData();
          }
        } catch (error) {
          if (error.name !== 'AbortError') showToast('保存失败：' + error.message);
        }
      }

      function clearData() {
        if (state.questions.length && !confirm('新建空白会清除当前页面中的问答。建议先另存数据，是否继续？')) return;
        state = { schemaVersion: 1, feature: feature, updatedAt: new Date().toISOString(), questions: [] };
        fileHandle = null;
        persist();
        renderQuestions();
        showToast('已新建空白问答');
      }

      document.getElementById('addButton').addEventListener('click', addQuestion);
      newQuestion.addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') addQuestion();
      });
      newQuestion.addEventListener('input', function () { autoResizeTextarea(newQuestion); });
      autoResizeTextarea(newQuestion);
      document.getElementById('openButton').addEventListener('click', openData);
      document.getElementById('saveButton').addEventListener('click', function () { saveData(false); });
      document.getElementById('saveAsButton').addEventListener('click', function () { saveData(true); });
      document.getElementById('clearButton').addEventListener('click', clearData);
      fileInput.addEventListener('change', function () {
        if (fileInput.files[0]) readFallbackFile(fileInput.files[0]);
        fileInput.value = '';
      });
      window.addEventListener('beforeunload', function () { persist(false); });

      renderCode();
      renderQuestions();
      dirtyForFile = false;
      updateSaveState();
    })();
  </script>
</body>
</html>
