        if(section.keys.indexOf('effect')>=0 && /return 1|localPlayer =|send\(|AddRect|enabled =/.test(line)) return 'effect';
        if(section.keys.indexOf('address')>=0 && /0x|base\.add|GetGameManagerInstance/.test(line)) return 'address';
        if(section.keys.indexOf('risk')>=0 && /if \(|onRoomExit|disable|IsValid|CurrentRoom|WorldToScreen|没有/.test(line)) return 'risk';
        return '';
      }
      function addressLabel(line){
        if(line.indexOf('Player_get_isMyPlayer')>=0) return 'Player.get_isMyPlayer';
        if(line.indexOf('Weapon_ConsumeAmmo')>=0 || line.indexOf('baseConsume')>=0) return 'Weapon.ConsumeAmmo';
        if(line.indexOf('gunConsume')>=0) return 'WPN_Gun.ConsumeAmmo';
        if(line.indexOf('GetGameManagerInstance')>=0) return 'Singleton<GameManager>.Get';
        return '';
      }
      function render(){
        var source=sources[state.source];
        tabs.querySelectorAll('button').forEach(function(b){b.remove();});
        sources.forEach(function(src,i){var b=document.createElement('button');b.textContent=src.label;b.setAttribute('aria-selected',i===state.source);b.onclick=function(){state.source=i;state.section=0;render();show('已切换：'+src.label);};tabs.appendChild(b);});
        document.getElementById('fileName').textContent=source.file;document.getElementById('lineCount').textContent=source.lines.length+' 行';
        document.getElementById('sourceMeta').innerHTML='<strong>文档生成时间：</strong>2026-06-18 21:00:00 +08:00　<strong>源码修改时间：</strong>'+source.modified+'　<strong>文件大小：</strong>'+source.size+' bytes<br><strong>SHA-256：</strong><code>'+source.hash+'</code><span class="zone-note">演示指纹：正式文档必须按实际源码重新计算</span>';
        sectionTabs.querySelectorAll('button').forEach(function(b){b.remove();});codeArea.innerHTML='';
        source.sections.forEach(function(sec,index){
          var nav=document.createElement('button');nav.textContent=String(index+1).padStart(2,'0')+' '+sec.title;nav.setAttribute('aria-current',index===state.section);nav.onclick=function(){select(index,true);};sectionTabs.appendChild(nav);
          var block=document.createElement('section');block.className='block'+(index===state.section?' active':'');block.dataset.index=index;
          var html='<div class="block-label"><span class="number">08</span><span class="block-title-frame">完整代码正文 · '+escapeHtml(sec.title)+' · L'+sec.start+'-'+sec.end+'</span><span class="nature">'+escapeHtml(sec.nature)+'</span></div>';
          for(var n=sec.start;n<=sec.end;n++){var line=source.lines[n-1]||'',type=keyType(line,sec),label=addressLabel(line);html+='<div class="line-row'+(type?' key-'+type:'')+'"><span class="line-no">'+n+'</span><span class="line-code">'+syntax(line)+(label?'<span class="address-note">'+label+'</span>':'')+'</span></div>';}
          block.innerHTML=html;block.onclick=function(){select(index,false);};codeArea.appendChild(block);
        });
        explain();
      }
      function flow(items,refs,type){return items.map(function(item,i){return '<div class="step '+type+'">'+escapeHtml(item)+(refs&&refs[i]?'<span class="ref">'+escapeHtml(refs[i])+'</span>':'')+'</div>'+(i<items.length-1?'<div class="arrow">↓</div>':'');}).join('');}
      function explain(){
        var sec=sources[state.source].sections[state.section],d=sec.detail;
        document.getElementById('category').textContent=sec.category+' · '+sec.nature;document.getElementById('explainTitle').textContent=sec.title;
        document.getElementById('explainBody').innerHTML='<section class="card"><h3><span class="number">09A</span>业务流程对应</h3><p class="scene"><strong>游戏场景：</strong>'+escapeHtml(d.scene)+'</p><p class="eyebrow">原始游戏逻辑</p><div class="flow">'+flow(d.original,[],'original')+'</div><p class="eyebrow">修改后游戏逻辑</p><div class="flow">'+flow(d.modified,d.refs,'modify')+'</div><p class="result"><strong>游戏表现：</strong>'+escapeHtml(d.result)+'</p></section>';
      }
      function select(i,scroll){state.section=i;document.querySelectorAll('.block').forEach(function(x,n){x.classList.toggle('active',n===i);});sectionTabs.querySelectorAll('button').forEach(function(x,n){x.setAttribute('aria-current',n===i);});explain();if(scroll){document.querySelector('.block[data-index="'+i+'"]').scrollIntoView({behavior:'smooth',block:'center'});}}
      function show(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(show.timer);show.timer=setTimeout(function(){t.classList.remove('show');},1300);}
      document.getElementById('copyButton').onclick=function(){var text=sources[state.source].lines.join('\n'),button=this;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){button.textContent='已复制';show('当前源码已复制');setTimeout(function(){button.textContent='复制源码';},1200);});}else{show('浏览器未开放剪贴板权限');}};
      render();
    })();
  </script>
</body>
</html>
