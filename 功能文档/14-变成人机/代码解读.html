;border-left:1px solid #d8dee2}.eyebrow{margin:10px 0 6px;color:#28715f;font-size:12px;font-weight:700}.explain h2{margin:3px 0 13px;font-size:20px}.card{margin:11px 0;padding:14px;background:#f7f9fa;border:1px solid #d8dee2;border-radius:6px}.card h3{margin:0 0 8px;font-size:14px}.business-card{border-left:4px solid #39779f}.business-scene{margin:0 0 12px;color:#34414b}.business-path{display:grid}.business-step{padding:8px 10px;border:1px solid;border-radius:5px}.business-step.original{color:#1f5b80;background:#edf5fa;border-color:#b8d1e0}.business-step.hook{color:#8f3030;background:#fbeeee;border-color:#e0b6b6}.business-step.modify{color:#17634f;background:#e9f5f0;border-color:#afd2c6}.business-arrow{height:20px;text-align:center;color:#74808a;font-weight:800}.business-result{margin:12px 0 0;padding:9px 10px;color:#73420f;background:#fff3e3;border-left:3px solid #bd742c}.logic-line-ref{float:right;margin-left:10px;padding:1px 6px;color:#17634f;background:#d7ede5;border:1px solid #9bc9ba;border-radius:4px;font:700 11px Consolas,monospace}.address-note.gather,.address-note.gravity,.address-note.time{color:#9fd5f3;background:#17384c;border-color:#397da5}.address-note.transform{color:#ffd18d;background:#49331a;border-color:#a97634}.address-note.bot{color:#ffb3b3;background:#492425;border-color:#a95357}.address-note.aim,.address-note.hp,.address-note.weapon{color:#9fd5f3;background:#17384c;border-color:#397da5}.address-note.risk{color:#ffd18d;background:#49331a;border-color:#a97634}</style></head><body><header class="top"><h1>14 · 变成人机代码解读</h1><div class="tabs" id="tabs"></div><div class="actions"><a href="../index.html">功能目录</a><button id="copy">复制源码</button></div></header><section class="summary"><strong>解决的问题：</strong>把本地玩家 ClientData.isBot 字段改为1，同时替换 Player.get_isMyPlayer，让该对象仍被游戏识别为本地玩家。关闭时恢复原 isBot 值与原函数入口。</section><div class="workspace"><main class="code"><div class="code-head"><span id="file"></span><span id="count"></span><div class="source-meta" id="meta"></div><div class="code-highlight-legend"><span class="highlight-legend-item"><span class="highlight-swatch address"></span>蓝：定位地址</span><span class="highlight-legend-item"><span class="highlight-swatch hook"></span>红：安装或恢复 Hook</span><span class="highlight-legend-item"><span class="highlight-swatch effect"></span>绿：改变游戏行为</span><span class="highlight-legend-item"><span class="highlight-swatch risk"></span>橙：风险或依赖</span></div></div><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><script type="text/plain" id="src-release">// is_bot.js - 天机傀儡 — 修改 ClientData.isBot (v2)
// replace isMyPlayer 捕获localPlayer → 读取clientData → 直接写 isBot 字节

modules.isbot = (function() {
  var enabled = false;
  var localPlayer = null;
  var clientData = null;
  var dumped = false;
  var logCount = 0;
  var MAX_LOG = 15;
  var hookInstalled = false;
  var retryInterval = null;
  var addrIsMy = null;

  var RVA_IS_MY_PLAYER = 0xB55FD0;
  var OFF_CLIENT = 0x94;
  var OFF_ISBOT = 0x1C;
  var OFF_NICK = 0x10;

  function log(level, msg) {
    if (logCount >= MAX_LOG && level !== 'error') return;
    logCount++;
    send({ type: 'log', level: level, module: 'isBot', message: msg });
  }

  function readStr(p) {
    try {
      var obj = p.readPointer();
      if (!obj || obj.isNull()) return '?';
      var len = obj.add(-4).readS32();
      if (len < 0 || len > 64) return '?';
      return obj.readUtf8String(len);
    } catch(e) { return '?'; }
  }

  function dump() {
    if (!clientData) return;
    var bot = clientData.add(OFF_ISBOT).readU8();
    var nick = readStr(clientData.add(OFF_NICK));
    log('info', localPlayer + '|' + clientData + '|0x1C:' + bot + '|nick:' + nick);
  }

  function writeBot(val) {
    if (!clientData) return false;
    try {
      clientData.add(OFF_ISBOT).writeU8(val);
      var after = clientData.add(OFF_ISBOT).readU8();
      log('info', 'isBot=' + after + ' (写入' + val + ')');
      return true;
    } catch(e) { return false; }
  }

  function tryWriteBotOnCapture() {
    if (clientData) {
      writeBot(1);
      sendLog('info', '天机傀儡', 'Bot 模式已应用');
      if (retryInterval) {
        clearInterval(retryInterval);
        retryInterval = null;
      }
      return true;
    }
    return false;
  }

  function installHook() {
    if (hookInstalled) return;
    try {
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '天机傀儡', '未找到 GameAssembly.dll'); return; }

      var base = mod.base;
      addrIsMy = base.add(RVA_IS_MY_PLAYER);
      var origIsMy = new NativeFunction(addrIsMy, 'bool', ['pointer', 'pointer']);

      Interceptor.replace(addrIsMy, new NativeCallback(function (playerPtr, methodInfo) {
        var result = origIsMy(playerPtr, methodInfo);
        if (result && !localPlayer) {
          localPlayer = playerPtr;
          var cd = playerPtr.add(OFF_CLIENT).readPointer();
          if (cd) {
            clientData = cd;
            dumped = true;
            setTimeout(dump, 2000);
            tryWriteBotOnCapture();
          }
        }
        return result;
      }, 'bool', ['pointer', 'pointer']));

      hookInstalled = true;
    } catch(e) {
      sendLog('error', '天机傀儡', 'Hook安装失败: ' + (e.message || e));
    }
  }

  function uninstallHook() {
    if (hookInstalled && addrIsMy) {
      try { Interceptor.revert(addrIsMy); } catch(e) {}
      hookInstalled = false;
      addrIsMy = null;
    }
  }

  return {
    enable: function() {
      if (enabled) return;

      installHook();

      if (tryWriteBotOnCapture()) {
        enabled = true;
        sendLog('success', '天机傀儡', '已启用');
        sendStatus('isbot', true);
        return;
      }

      var retries = 0;
      retryInterval = setInterval(function() {
        if (clientData) {
          tryWriteBotOnCapture();
        }
        retries++;
        if (retries > 20) {
          clearInterval(retryInterval);
          retryInterval = null;
          sendLog('error', '天机傀儡', '等待本地玩家超时');
        }
      }, 500);

      enabled = true;
      sendLog('success', '天机傀儡', '已启用（等待本地玩家）');
      sendStatus('isbot', true);
    },
    disable: function() {
      if (!enabled) return;
      if (retryInterval) {
        clearInterval(retryInterval);
        retryInterval = null;
      }
      writeBot(0);
      uninstallHook();
      enabled = false;
      localPlayer = null;
      clientData = null;
      log('info', '已禁用');
      sendStatus('isbot', false);
    },
    isEnabled: function() { return enabled; },
    modify: function() {
      if (writeBot(1)) return JSON.stringify({ success: true, bot: 1 });
      return JSON.stringify({ success: false });
    },
    restore: function() {
      if (writeBot(0)) return JSON.stringify({ success: true, bot: 0 });
      return JSON.stringify({ success: false });
    },
    stop: function() {
      if (writeBot(0)) return JSON.stringify({ success: true, bot: 0 });
      return JSON.stringify({ success: false });
    },
    status: function() {
      return JSON.stringify({
        player: localPlayer ? localPlayer.toString() : null,
        cd: clientData ? clientData.toString() : null,
        bot: clientData ? clientData.add(OFF_ISBOT).readU8() : null
      });
    }
  };
})();

    }

    rpc.exports = { modify, restore, stop, status };
    log('info', '已加载');
})();
