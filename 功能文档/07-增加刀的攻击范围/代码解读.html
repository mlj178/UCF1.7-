t-swatch risk"></span>橙：风险或副作用</span></div></div><div class="code-scroll" id="code"></div></main><aside class="explain"><p class="eyebrow" id="cat"></p><h2 id="title"></h2><div id="body"></div></aside></div><script type="text/plain" id="src-release">// knife_range.js - 剑气化丝 (Knife Range)
// attach get_KnifeSpeed 捕获本地玩家指针，Hook GetKnifeAttackData 修改攻击距离

modules.range = (function() {
  var enabled = false;
  var KNIFE_RANGE_MULTIPLIER = 50.0;
  var myPlayer = null;
  var myPlayerFound = false;
  var callCount = 0;
  var rangeLogCount = 0;
  var isMyPlayerFn = null;
  var getKnifeSpeedAddr = null;
  var getKnifeSpeedHook = null;
  var getKnifeAttackDataAddr = null;
  var hookHandles = [];

  return {
    enable: function() {
      if (enabled) return;
      var mod = getGameAssembly();
      if (!mod) { sendLog('error', '剑气化丝', '无 GameAssembly.dll'); return; }

      var base = mod.base;
      isMyPlayerFn = new NativeFunction(base.add(0xB55FD0), 'bool', ['pointer']);
      myPlayer = null;
      myPlayerFound = false;
      callCount = 0;
      rangeLogCount = 0;
      hookHandles = [];

      try {
        getKnifeSpeedAddr = base.add(0xB170A0);
        getKnifeSpeedHook = Interceptor.attach(getKnifeSpeedAddr, {
          onEnter: function(args) { this._self = args[0]; },
          onLeave: function(retval) {
            if (myPlayerFound) return;
            try {
              var owner = this._self.add(0x8).readPointer();
              if (owner && !owner.isNull() && isMyPlayerFn(owner)) {
                myPlayer = owner;
                myPlayerFound = true;
                sendLog('info', '剑气化丝', '捕获本地玩家 @ ' + myPlayer);
              }
            } catch(e) {}
          }
        });
        sendLog('info', '剑气化丝', 'get_KnifeSpeed attach @ ' + getKnifeSpeedAddr + ' (兼容模式)');
      } catch(e) {
        sendLog('warn', '剑气化丝', 'get_KnifeSpeed hook失败: ' + e.message);
      }

      try {
        getKnifeAttackDataAddr = base.add(0xB63EC0);
        var h = Interceptor.attach(getKnifeAttackDataAddr, {
          onEnter: function(args) {
            this.wpnSelf = args[1];
            this.attackIdx = args[2].toInt32();
            try { this.owner = args[1].add(0x30).readPointer(); } catch(e) { this.owner = null; }
          },
          onLeave: function(retval) {
            callCount++;
            try {
              var orig = retval.add(0x4).readFloat();
              var isOwnerMine = myPlayerFound && this.owner && !this.owner.isNull() && this.owner.equals(myPlayer);
              if (!isOwnerMine) return;
              if (!(orig > 0.3 && orig < 500)) return;

              retval.add(0x4).writeFloat(orig * KNIFE_RANGE_MULTIPLIER);
              var after = retval.add(0x4).readFloat();

              rangeLogCount++;
              if (rangeLogCount <= 10) {
                sendLog('info', '剑气化丝', '攻击距离 ' + orig.toFixed(2) + ' → ' + after.toFixed(2) + ' (' + KNIFE_RANGE_MULTIPLIER + 'x)');
              }
            } catch(e) {
              if (callCount <= 5) sendLog('error', '剑气化丝', '异常: ' + e.message);
            }
          }
        });
        hookHandles.push(h);
        sendLog('info', '剑气化丝', 'Hook GetKnifeAttackData @ ' + getKnifeAttackDataAddr);
      } catch(e) { sendLog('error', '剑气化丝', 'Hook 失败: ' + e.message); }

      var cleanupAddrs = [0xAFAA40, 0xAF5B30, 0xAF15D0];
      for (var i = 0; i < cleanupAddrs.length; i++) {
        try {
          var h = Interceptor.attach(base.add(cleanupAddrs[i]), {
            onEnter: function() {
              myPlayer = null;
              myPlayerFound = false;
              callCount = 0;
              rangeLogCount = 0;
              sendLog('info', '剑气化丝', '房间切换，状态重置');
            }
          });
          hookHandles.push(h);
        } catch(e) {}
      }

      enabled = true;
      sendLog('success', '剑气化丝', '已启用 (' + KNIFE_RANGE_MULTIPLIER + 'x) — 仅对玩家生效');
      sendStatus('range', true);
    },
    disable: function() {
      if (!enabled) return;
      if (getKnifeSpeedHook) { try { getKnifeSpeedHook.detach(); } catch(e) {} }
      for (var i = 0; i < hookHandles.length; i++) { try { hookHandles[i].detach(); } catch(e) {} }
      getKnifeSpeedAddr = null;
      getKnifeSpeedHook = null;
      getKnifeAttackDataAddr = null;
      hookHandles = [];
      myPlayer = null;
      myPlayerFound = false;
      enabled = false;
      sendLog('info', '剑气化丝', '已禁用');
      sendStatus('range', false);
    },
    setRange: function(multiplier) {
      KNIFE_RANGE_MULTIPLIER = multiplier;
      sendLog('info', '剑气化丝', '攻击距离倍率已更新: ' + multiplier + 'x');
    }
  };
})();
</script><script type="text/plain" id="src-main">// ============================================================
// 近战距离修改器 v22 — 用 attach 替代 replace，兼容快刀脚本共存
// 核心改动: 步骤1从 Interceptor.replace 改为 Interceptor.attach
//           只观察 get_KnifeSpeed 调用捕获 myPlayer，不替换函数
//           避免与 speed_knife_v16 的 replace 冲突
// ============================================================

(function() {
    'use strict';

    var KNIFE_RANGE_MULTIPLIER = 50.0;

    function sendLog(level, module, msg) {
        var logMsg = '[' + module + '] ' + msg;
        if (level === 'error') console.error(logMsg);
        else if (level === 'warn') console.warn(msg);
        else console.log(logMsg);
    }

    var mod = Process.findModuleByName('GameAssembly.dll');
    if (!mod) { sendLog('error', '近战', 'GameAssembly.dll 未找到'); return; }
    var base = mod.base;

    var isMyPlayerFn = new NativeFunction(base.add(0xB55FD0), 'bool', ['pointer']);
    var myPlayer = null;
    var myPlayerFound = false;

    var callCount = 0;
    var rangeLogCount = 0;

    // ============================================================
    // 步骤1: attach get_KnifeSpeed 捕获 myPlayer（仅观察，不替换）
    //        与 speed_knife_v16 的 replace 可共存
    // ============================================================
    try {
        var getKnifeSpeedAddr = base.add(0xB170A0);
        Interceptor.attach(getKnifeSpeedAddr, {
            onEnter: function(args) {
                this._self = args[0];
            },
            onLeave: function(retval) {
                if (myPlayerFound) return;
                try {
                    var owner = this._self.add(0x8).readPointer();
                    if (owner && !owner.isNull() && isMyPlayerFn(owner)) {
                        myPlayer = owner;
                        myPlayerFound = true;
                        sendLog('info', '近战', '捕获myPlayer @ ' + myPlayer);
                    }
                } catch(e) {}
            }
        });
        sendLog('info', '近战', 'get_KnifeSpeed attach @ ' + getKnifeSpeedAddr + ' (兼容模式)');
    } catch(e) {
        sendLog('warn', '近战', 'get_KnifeSpeed hook失败: ' + e.message);
    }

    // ============================================================
    // 步骤2: Hook GetKnifeAttackData（只Hook一个，避免双写冲突）
    // ============================================================
    try {
        Interceptor.attach(base.add(0xB63EC0), {
            onEnter: function(args) {
                this.wpnSelf = args[1];
                this.attackIdx = args[2].toInt32();
                try {
                    this.owner = args[1].add(0x30).readPointer();
                } catch(e) {
                    this.owner = null;
                }
            },
            onLeave: function(retval) {
                callCount++;

                if (callCount <= 20) {
                    sendLog('info', '近战',
                        '=== 调用#' + callCount + ' ===');
                    sendLog('info', '近战',
                        'self=' + this.wpnSelf +
                        ' owner=' + (this.owner || 'null') +
                        ' retval=' + retval);
                }

                try {
                    if (callCount <= 3) {
                        try {
                            var rng = Process.findRangeByAddress(retval);
                            if (rng) {
                                sendLog('info', '近战',
                                    '  retval区域: base=' + rng.base +
                                    ' size=' + rng.size +
                                    ' prot=' + rng.protection);
                            }
                        } catch(e) {}
                    }

                    var dmg = retval.add(0x0).readFloat();
                    var orig = retval.add(0x4).readFloat();
                    var ang = retval.add(0x8).readFloat();

                    if (callCount <= 20) {
                        sendLog('info', '近战',
                            '  retval: damage=' + dmg.toFixed(2) +
                            ' range=' + orig.toFixed(2) +
                            ' angle=' + ang.toFixed(2));
                    }

                    var isOwnerMine = myPlayerFound &&
                        this.owner && !this.owner.isNull() &&
                        this.owner.equals(myPlayer);

                    if (callCount <= 20 && isOwnerMine) {
                        sendLog('info', '近战', '  owner==myPlayer ✓');
                    }

                    if (!isOwnerMine) return;

                    if (!(orig > 0.3 && orig < 500)) return;

                    retval.add(0x4).writeFloat(orig * KNIFE_RANGE_MULTIPLIER);

                    var after = retval.add(0x4).readFloat();

                    rangeLogCount++;
                    if (rangeLogCount <= 10) {
                        sendLog('info', '近战',
                            '[玩家#' + rangeLogCount + '] idx=' + this.attackIdx +
                            ' range ' + orig.toFixed(2) +
                            ' → ' + after.toFixed(2));
                    }
                } catch(e) {
                    if (callCount <= 5) {
                        sendLog('error', '近战',
                            'onLeave异常(调用#' + callCount + '): ' + e.message);
                    }
                }
            }
        });
        sendLog('info', '近战', 'Hook GetKnifeAttackData @ ' + base.add(0xB63EC0));
    } catch(e) { sendLog('error', '近战', 'Hook 失败: ' + e.message); }

    // ============================================================
    // 房间切换
    // ============================================================
    var cleanupAddrs = [0xAFAA40, 0xAF5B30, 0xAF15D0];
    for (var i = 0; i < cleanupAddrs.length; i++) {
        try {
            Interceptor.attach(base.add(cleanupAddrs[i]), {
                onEnter: function() {
                    myPlayer = null;
                    myPlayerFound = false;
                    callCount = 0;
                    rangeLogCount = 0;
                    sendLog('info', '近战', '房间切换，全部重置');
                }
            });
        } catch(e) {}
    }

    sendLog('info', '近战', 'v22 已启用 (' + KNIFE_RANGE_MULTIPLIER + 'x) — 兼容快刀共存');

})();
