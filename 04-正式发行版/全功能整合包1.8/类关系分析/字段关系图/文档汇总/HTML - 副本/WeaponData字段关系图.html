<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeaponData 字段关系图</title>
  <style>
    :root{--bg:#f3f5f8;--ink:#1f2633;--muted:#5f6878;--line:#cfd7e4;--core:#1f5fbf;--source:#315f9f;--target:#24724c}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;color:var(--ink)}
    .canvas{width:100%;min-height:100vh;padding:12px}svg{display:block;width:100%;min-width:1180px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
    .title{font-size:25px;font-weight:700;fill:var(--ink)}.note{font-size:13px;fill:var(--muted)}.lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;rx:12}
    .core{fill:#eef5ff;stroke:var(--core);stroke-width:3;rx:12}.box,.source,.target,.empty{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.source{fill:#f2f7ff}.target{fill:#f1fbf5}.empty{fill:#f8fafc}
    .name{font-size:15px;font-weight:700;fill:#1f2633}.desc{font-size:12px;fill:var(--muted)}.count{font-size:14px;font-weight:700;fill:#1f7a4d}.lane-title{font-size:17px;font-weight:700;fill:#2d3748}
    .edge{fill:none;stroke-width:2.7}.source-edge{stroke:var(--source)}.target-edge{stroke:var(--target)}.label{font-size:12px;fill:#344054}.label-bg{fill:#fff;stroke:#edf0f5;rx:5}
  </style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1450 1184" role="img" aria-label="WeaponData field relationship graph">
  <defs>
    <marker id="arrowSource" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#315f9f"/></marker>
    <marker id="arrowTarget" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#24724c"/></marker>
  </defs>
  <text x="36" y="44" class="title">WeaponData 字段关系图</text>
  <text x="36" y="70" class="note">只统计 dump.cs 字段声明：左边是谁的字段保存了 WeaponData；右边是 WeaponData 自己字段保存的类型。委托事件字段和基础值不画。</text>

  <rect class="lane" x="40" y="110" width="390" height="1024"/>
  <rect class="lane" x="530" y="110" width="370" height="1024"/>
  <rect class="lane" x="980" y="110" width="420" height="1024"/>

  <text x="70" y="172" class="note">通俗说：其他类字段里有没有它</text>
  <text x="70" y="196" class="count">统计：4 / 4 已画出</text>
  <text x="70" y="220" class="note">分析：有 4 个类字段保存 WeaponData</text>
  <text x="560" y="148" class="lane-title">当前类</text>
  <text x="560" y="172" class="note">分析直接写在类名下面</text>
  <text x="1010" y="148" class="lane-title">它保存了哪些类型</text>

  <text x="1010" y="196" class="count">统计：8 / 8 已画出</text>
  <text x="1010" y="220" class="note">分析：WeaponData 字段直接保存 8 种非基础类型</text>

  <rect class="core" x="610" y="340" width="280" height="170"/>
  <text x="750" y="382" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1f5fbf">WeaponData</text>
  <text x="750" y="414" text-anchor="middle" class="desc">字段关系中心</text>
  <text x="750" y="454" text-anchor="middle" class="desc">功能翻译：武器数值配置：伤害、弹药、图标等资料</text>
  <text x="750" y="477" text-anchor="middle" class="desc">关系依据：只看 dump.cs 字段声明</text>
  <text x="750" y="500" text-anchor="middle" class="desc">用途判断：看左侧谁保存它、右侧它保存哪些类型</text>

    <text x="18" y="69" class="desc">字段依据：WpnDataDictionary</text>
  </g>
  <g transform="translate(70 333)">

    <text x="18" y="69" class="desc">字段依据：wpnData</text>
  </g>

    <text x="18" y="69" class="desc">字段依据：weaponData</text>
  </g>
  <g transform="translate(70 529)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">Weapon</text>

    <text x="18" y="69" class="desc">字段依据：data</text>
  </g>

  <g transform="translate(1020 235)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">BotControlData</text>
    <text x="18" y="49" class="desc">AI 行为类型：用于电脑角色、代理移动、决策或目标选择</text>
    <text x="18" y="69" class="desc">字段依据：botControlData</text>
  </g>

  </g>
  <g transform="translate(1020 431)">

  <g transform="translate(1020 529)">

    <text x="18" y="69" class="desc">字段依据：qvMdlPrefab</text>
  </g>
  <g transform="translate(1020 627)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">PlayerViewData</text>

    <text x="18" y="69" class="desc">字段依据：viewData</text>
  </g>
  <g transform="translate(1020 725)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Weapon.SlotType</text>

    <text x="18" y="69" class="desc">字段依据：slotType</text>
  </g>
  <g transform="translate(1020 823)">

    <text x="18" y="27" class="name">WeaponClass</text>
    <text x="18" y="49" class="desc">武器类别枚举：区分步枪、狙击、机枪、手枪、近战等规则分类</text>
    <text x="18" y="69" class="desc">字段依据：wpnClass</text>
  </g>
  <g transform="translate(1020 921)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">WpnSpriteAsset</text>
    <text x="18" y="49" class="desc">资源索引类型：保存可加载资源、图标、预制体或表现素材引用</text>
    <text x="18" y="69" class="desc">字段依据：spriteAsset</text>
  </g>
