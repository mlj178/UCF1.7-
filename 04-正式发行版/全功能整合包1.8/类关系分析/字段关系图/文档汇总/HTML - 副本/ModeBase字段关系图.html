<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModeBase 字段关系图</title>
  <style>
    :root{--bg:#f3f5f8;--ink:#1f2633;--muted:#5f6878;--line:#cfd7e4;--core:#1f5fbf;--source:#315f9f;--target:#24724c}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;color:var(--ink)}
    .canvas{width:100%;min-height:100vh;padding:12px}svg{display:block;width:100%;min-width:1180px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
    .title{font-size:25px;font-weight:700;fill:var(--ink)}.note{font-size:13px;fill:var(--muted)}.lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;rx:12}
    .core{fill:#eef5ff;stroke:var(--core);stroke-width:3;rx:12}.box,.source,.target,.empty{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.source{fill:#f2f7ff}.target{fill:#f1fbf5}.empty{fill:#f8fafc}
    .name{font-size:15px;font-weight:700;fill:#1f2633}.desc{font-size:12px;fill:var(--muted)}.count{font-size:14px;font-weight:700;fill:#1f7a4d}.lane-title{font-size:17px;font-weight:700;fill:#2d3748}
    .edge{fill:none;stroke-width:2.7}.source-edge{stroke:var(--source)}.target-edge{stroke:var(--target)}.label{font-size:12px;fill:#344054}.label-bg{fill:#fff;stroke:#edf0f5;rx:5}
  </style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1450 1282" role="img" aria-label="ModeBase field relationship graph">
  <defs>
    <marker id="arrowSource" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#315f9f"/></marker>
    <marker id="arrowTarget" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#24724c"/></marker>
  </defs>
  <text x="36" y="44" class="title">ModeBase 字段关系图</text>
  <text x="36" y="70" class="note">只统计 dump.cs 字段声明：左边是谁的字段保存了 ModeBase；右边是 ModeBase 自己字段保存的类型。委托事件字段和基础值不画。</text>

  <rect class="lane" x="40" y="110" width="390" height="1122"/>
  <rect class="lane" x="530" y="110" width="370" height="1122"/>
  <rect class="lane" x="980" y="110" width="420" height="1122"/>
  <text x="70" y="148" class="lane-title">谁保存了这个类</text>
  <text x="70" y="172" class="note">通俗说：其他类字段里有没有它</text>
  <text x="70" y="196" class="count">统计：0 / 0 已画出</text>
  <text x="70" y="220" class="note">分析：没有其他类字段直接保存 ModeBase</text>
  <text x="560" y="148" class="lane-title">当前类</text>
  <text x="560" y="172" class="note">分析直接写在类名下面</text>
  <text x="1010" y="148" class="lane-title">它保存了哪些类型</text>
  <text x="1010" y="172" class="note">通俗说：这个类字段里有哪些对象</text>
  <text x="1010" y="196" class="count">统计：9 / 9 已画出</text>
  <text x="1010" y="220" class="note">分析：ModeBase 字段直接保存 9 种非基础类型</text>

  <rect class="core" x="610" y="340" width="280" height="170"/>
  <text x="750" y="382" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1f5fbf">ModeBase</text>
  <text x="750" y="414" text-anchor="middle" class="desc">字段关系中心</text>
  <text x="750" y="454" text-anchor="middle" class="desc">功能：玩法规则基类</text>
  <text x="750" y="477" text-anchor="middle" class="desc">Unity：模式单例/规则控制器</text>
  <text x="750" y="500" text-anchor="middle" class="desc">CF：承接胜负、计分、复活、回合流程的公共规则</text>

  <g transform="translate(70 235)">
    <rect class="empty" width="330" height="78"/>
    <text x="18" y="27" class="name">没有发现</text>
    <text x="18" y="49" class="desc">没有其他类字段直接保存 ModeBase</text>
    <text x="18" y="69" class="desc">字段依据：0 个类的字段保存 ModeBase</text>
  </g>

  <g transform="translate(1020 235)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">GameObject</text>
    <text x="18" y="49" class="desc">Unity 场景对象/预制体：用于生成或引用场景对象</text>
    <text x="18" y="69" class="desc">字段依据：rectContainer / playerRectPrefab</text>
  </g>
  <g transform="translate(1020 333)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">HUD_PlayerRect</text>
    <text x="18" y="49" class="desc">玩家矩形 UI：记分板或模式界面中的玩家条目</text>
    <text x="18" y="69" class="desc">字段依据：playerRect_BL / playerRect_GR</text>
  </g>
  <g transform="translate(1020 431)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Material</text>
    <text x="18" y="49" class="desc">Unity 材质：控制模型表面颜色、贴图和渲染效果</text>
    <text x="18" y="69" class="desc">字段依据：timeFlashMat</text>
  </g>
  <g transform="translate(1020 529)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Player</text>
    <text x="18" y="49" class="desc">玩家对象：本机/敌我玩家的战斗状态主体</text>
    <text x="18" y="69" class="desc">字段依据：myPlayer</text>
  </g>
  <g transform="translate(1020 627)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">RawImage</text>
    <text x="18" y="49" class="desc">Unity UI 原始图片：显示贴图类界面内容</text>
    <text x="18" y="69" class="desc">字段依据：scoreBoardImage</text>
  </g>
  <g transform="translate(1020 725)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">SimpleObjectPool</text>
    <text x="18" y="49" class="desc">简单对象池：复用 UI、特效或临时对象</text>
    <text x="18" y="69" class="desc">字段依据：playerRectPool</text>
  </g>
  <g transform="translate(1020 823)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Text</text>
    <text x="18" y="49" class="desc">Unity UI 文本：显示名字、分数、提示等</text>
    <text x="18" y="69" class="desc">字段依据：scoreText_L / scoreText_R / roundText_T / roundText_C 等 6 个字段</text>
  </g>
  <g transform="translate(1020 921)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Texture</text>
    <text x="18" y="49" class="desc">Unity 贴图基类：UI、材质或屏幕效果用图像资源</text>
    <text x="18" y="69" class="desc">字段依据：scoreBoardTex</text>
  </g>
  <g transform="translate(1020 1019)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Vector2Int</text>
    <text x="18" y="49" class="desc">二维整数向量：格点、弹药数量或尺寸</text>
    <text x="18" y="69" class="desc">字段依据：score / gameTime / restGameTime</text>
  </g>

<path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V274 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V372 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V470 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V568 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V666 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V764 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V862 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V960 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V1058 H1020"/>
</svg>
</div>
</body>
</html>
