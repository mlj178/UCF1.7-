<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlayerData 字段关系图</title>
  <style>
    :root{--bg:#f3f5f8;--ink:#1f2633;--muted:#5f6878;--line:#cfd7e4;--core:#1f5fbf;--source:#315f9f;--target:#24724c}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;color:var(--ink)}
    .canvas{width:100%;min-height:100vh;padding:12px}svg{display:block;width:100%;min-width:1180px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
    .title{font-size:25px;font-weight:700;fill:var(--ink)}.note{font-size:13px;fill:var(--muted)}.lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;rx:12}
    .core{fill:#eef5ff;stroke:var(--core);stroke-width:3;rx:12}.box,.source,.target,.empty{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.source{fill:#f2f7ff}.target{fill:#f1fbf5}.empty{fill:#f8fafc}
    .name{font-size:15px;font-weight:700;fill:#1f2633}.desc{font-size:12px;fill:var(--muted)}.count{font-size:14px;font-weight:700;fill:#1f7a4d}.lane-title{font-size:17px;font-weight:700;fill:#2d3748}
    .edge{fill:none;stroke-width:2.7}.source-edge{stroke:var(--source)}.target-edge{stroke:var(--target)}.label{font-size:12px;fill:#344054}.label-bg{fill:#fff;stroke:#edf0f5;rx:5}
  </style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1450 1086" role="img" aria-label="PlayerData field relationship graph">
  <defs>
    <marker id="arrowSource" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#315f9f"/></marker>
    <marker id="arrowTarget" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#24724c"/></marker>
  </defs>
  <text x="36" y="44" class="title">PlayerData 字段关系图</text>
  <text x="36" y="70" class="note">只统计 dump.cs 字段声明：左边是谁的字段保存了 PlayerData；右边是 PlayerData 自己字段保存的类型。委托事件字段和基础值不画。</text>

  <rect class="lane" x="40" y="110" width="390" height="926"/>
  <rect class="lane" x="530" y="110" width="370" height="926"/>
  <rect class="lane" x="980" y="110" width="420" height="926"/>
  <text x="70" y="148" class="lane-title">谁保存了这个类</text>
  <text x="70" y="172" class="note">通俗说：其他类字段里有没有它</text>
  <text x="70" y="196" class="count">统计：1 / 1 已画出</text>
  <text x="70" y="220" class="note">分析：有 1 个类字段保存 PlayerData</text>
  <text x="560" y="148" class="lane-title">当前类</text>
  <text x="560" y="172" class="note">分析直接写在类名下面</text>
  <text x="1010" y="148" class="lane-title">它保存了哪些类型</text>
  <text x="1010" y="172" class="note">通俗说：这个类字段里有哪些对象</text>
  <text x="1010" y="196" class="count">统计：7 / 7 已画出</text>
  <text x="1010" y="220" class="note">分析：PlayerData 字段直接保存 7 种非基础类型</text>

  <rect class="core" x="610" y="340" width="280" height="170"/>
  <text x="750" y="382" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1f5fbf">PlayerData</text>
  <text x="750" y="414" text-anchor="middle" class="desc">字段关系中心</text>
  <text x="750" y="454" text-anchor="middle" class="desc">功能翻译：玩家资料数据：保存玩家身份、队伍或对局基础资料</text>
  <text x="750" y="477" text-anchor="middle" class="desc">关系依据：只看 dump.cs 字段声明</text>
  <text x="750" y="500" text-anchor="middle" class="desc">用途判断：看左侧谁保存它、右侧它保存哪些类型</text>

  <g transform="translate(70 235)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">Player</text>
    <text x="18" y="49" class="desc">玩家对象：本机/敌我玩家的战斗状态主体</text>
    <text x="18" y="69" class="desc">字段依据：&lt;playerData&gt;k__BackingField</text>
  </g>

  <g transform="translate(1020 235)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">HUD_Role.AceSign</text>
    <text x="18" y="49" class="desc">HUD 界面组件：显示玩家状态、提示、图标或模式信息</text>
    <text x="18" y="69" class="desc">字段依据：aceSign</text>
  </g>
  <g transform="translate(1020 333)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Model.Type</text>
    <text x="18" y="49" class="desc">模型类型枚举：区分角色、武器、第一人称或其他表现模型类型</text>
    <text x="18" y="69" class="desc">字段依据：&lt;observeMode&gt;k__BackingField</text>
  </g>
  <g transform="translate(1020 431)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">MultiKillTimer</text>
    <text x="18" y="49" class="desc">连杀计时器：记录短时间连续击杀窗口，用于连杀提示和计分反馈</text>
    <text x="18" y="69" class="desc">字段依据：&lt;multiKillTimer&gt;k__BackingField</text>
  </g>
  <g transform="translate(1020 529)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">NanoRole</text>
    <text x="18" y="49" class="desc">纳米模式相关类型：处理终结者/幽灵玩法数据或行为</text>
    <text x="18" y="69" class="desc">字段依据：nanoRole</text>
  </g>
  <g transform="translate(1020 627)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Player</text>
    <text x="18" y="49" class="desc">玩家对象：本机/敌我玩家的战斗状态主体</text>
    <text x="18" y="69" class="desc">字段依据：&lt;revengeTarget&gt;k__BackingField</text>
  </g>
  <g transform="translate(1020 725)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Sprite</text>
    <text x="18" y="49" class="desc">Unity 精灵图片资源：UI 图标、武器图标、地图标识或提示图</text>
    <text x="18" y="69" class="desc">字段依据：zoomSprite</text>
  </g>
  <g transform="translate(1020 823)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">SubscribeableProperty</text>
    <text x="18" y="49" class="desc">可订阅属性：数值变化时通知 UI、玩法或表现系统刷新</text>
    <text x="18" y="69" class="desc">字段依据：kill / death / survival / score 等 7 个字段</text>
  </g>
<path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 274 H575 V430 H660"/>
<path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V274 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V372 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V470 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V568 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V666 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V764 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V862 H1020"/>
</svg>
</div>
</body>
</html>
