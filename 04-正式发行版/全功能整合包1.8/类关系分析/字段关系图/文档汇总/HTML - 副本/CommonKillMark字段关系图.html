<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CommonKillMark 字段关系图</title>
  <style>
    :root{--bg:#f3f5f8;--ink:#1f2633;--muted:#5f6878;--line:#cfd7e4;--core:#1f5fbf;--source:#315f9f;--target:#24724c}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;color:var(--ink)}
    .canvas{width:100%;min-height:100vh;padding:12px}svg{display:block;width:100%;min-width:1180px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
    .title{font-size:25px;font-weight:700;fill:var(--ink)}.note{font-size:13px;fill:var(--muted)}.lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;rx:12}
    .core{fill:#eef5ff;stroke:var(--core);stroke-width:3;rx:12}.box,.source,.target,.empty{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.source{fill:#f2f7ff}.target{fill:#f1fbf5}.empty{fill:#f8fafc}
    .name{font-size:15px;font-weight:700;fill:#1f2633}.desc{font-size:12px;fill:var(--muted)}.count{font-size:14px;font-weight:700;fill:#1f7a4d}.lane-title{font-size:17px;font-weight:700;fill:#2d3748}
    .edge{fill:none;stroke-width:2.7}.source-edge{stroke:var(--source)}.target-edge{stroke:var(--target)}.label{font-size:12px;fill:#344054}.label-bg{fill:#fff;stroke:#edf0f5;rx:5}
  </style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1450 792" role="img" aria-label="CommonKillMark field relationship graph">
  <defs>
    <marker id="arrowSource" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#315f9f"/></marker>
    <marker id="arrowTarget" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#24724c"/></marker>
  </defs>
  <text x="36" y="44" class="title">CommonKillMark 字段关系图</text>
  <text x="36" y="70" class="note">只统计 dump.cs 字段声明：左边是谁的字段保存了 CommonKillMark；右边是 CommonKillMark 自己字段保存的类型。委托事件字段和基础值不画。</text>

  <rect class="lane" x="40" y="110" width="390" height="632"/>
  <rect class="lane" x="530" y="110" width="370" height="632"/>
  <rect class="lane" x="980" y="110" width="420" height="632"/>
  <text x="70" y="148" class="lane-title">谁保存了这个类</text>
  <text x="70" y="172" class="note">通俗说：其他类字段里有没有它</text>
  <text x="70" y="196" class="count">统计：3 / 3 已画出</text>
  <text x="70" y="220" class="note">分析：有 3 个类字段保存 CommonKillMark</text>
  <text x="560" y="148" class="lane-title">当前类</text>
  <text x="560" y="172" class="note">分析直接写在类名下面</text>
  <text x="1010" y="148" class="lane-title">它保存了哪些类型</text>
  <text x="1010" y="172" class="note">通俗说：这个类字段里有哪些对象</text>
  <text x="1010" y="196" class="count">统计：3 / 3 已画出</text>
  <text x="1010" y="220" class="note">分析：CommonKillMark 字段直接保存 3 种非基础类型</text>

  <rect class="core" x="610" y="340" width="280" height="170"/>
  <text x="750" y="382" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1f5fbf">CommonKillMark</text>
  <text x="750" y="414" text-anchor="middle" class="desc">字段关系中心</text>
  <text x="750" y="454" text-anchor="middle" class="desc">功能翻译：通用击杀提示：显示击杀、连杀、爆头等战斗反馈</text>
  <text x="750" y="477" text-anchor="middle" class="desc">关系依据：只看 dump.cs 字段声明</text>
  <text x="750" y="500" text-anchor="middle" class="desc">用途判断：看左侧谁保存它、右侧它保存哪些类型</text>

  <g transform="translate(70 235)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">HUD_KillMark</text>
    <text x="18" y="49" class="desc">HUD 界面组件：显示玩家状态、提示、图标或模式信息</text>
    <text x="18" y="69" class="desc">字段依据：commonMark / specialKill</text>
  </g>
  <g transform="translate(70 333)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">HUD_NanoDamageScore</text>
    <text x="18" y="49" class="desc">HUD 界面组件：显示玩家状态、提示、图标或模式信息</text>
    <text x="18" y="69" class="desc">字段依据：nanoScore</text>
  </g>
  <g transform="translate(70 431)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">ModeBase_Nano</text>
    <text x="18" y="49" class="desc">纳米模式规则：终结者/幽灵相关玩法、吸收和胜负逻辑</text>
    <text x="18" y="69" class="desc">字段依据：mark</text>
  </g>

  <g transform="translate(1020 235)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">RawImage</text>
    <text x="18" y="49" class="desc">Unity UI 原始图片：显示贴图类界面内容</text>
    <text x="18" y="69" class="desc">字段依据：image</text>
  </g>
  <g transform="translate(1020 333)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">RectTransform</text>
    <text x="18" y="49" class="desc">Unity UI 矩形变换：控制 HUD/UI 元素位置、尺寸和锚点</text>
    <text x="18" y="69" class="desc">字段依据：rect</text>
  </g>
  <g transform="translate(1020 431)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Vector2</text>
    <text x="18" y="49" class="desc">二维向量：UI、坐标或平面数值</text>
    <text x="18" y="69" class="desc">字段依据：startPos</text>
  </g>
<path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 274 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 372 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 470 H575 V430 H660"/>
<path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V274 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V372 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V470 H1020"/>
</svg>
</div>

</html>
