<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entity 字段关系图</title>
  <style>
    :root{--bg:#f3f5f8;--ink:#1f2633;--muted:#5f6878;--line:#cfd7e4;--core:#1f5fbf;--source:#315f9f;--target:#24724c}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;color:var(--ink)}
    .canvas{width:100%;min-height:100vh;padding:12px}svg{display:block;width:100%;min-width:1180px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
    .title{font-size:25px;font-weight:700;fill:var(--ink)}.note{font-size:13px;fill:var(--muted)}.lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;rx:12}
    .core{fill:#eef5ff;stroke:var(--core);stroke-width:3;rx:12}.box,.source,.target,.empty{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.source{fill:#f2f7ff}.target{fill:#f1fbf5}.empty{fill:#f8fafc}
    .name{font-size:15px;font-weight:700;fill:#1f2633}.desc{font-size:12px;fill:var(--muted)}.count{font-size:14px;font-weight:700;fill:#1f7a4d}.lane-title{font-size:17px;font-weight:700;fill:#2d3748}
    .edge{fill:none;stroke-width:2.7}.source-edge{stroke:var(--source)}.target-edge{stroke:var(--target)}.label{font-size:12px;fill:#344054}.label-bg{fill:#fff;stroke:#edf0f5;rx:5}
  </style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1450 1380" role="img" aria-label="Entity field relationship graph">
  <defs>
    <marker id="arrowSource" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#315f9f"/></marker>
    <marker id="arrowTarget" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#24724c"/></marker>
  </defs>
  <text x="36" y="44" class="title">Entity 字段关系图</text>
  <text x="36" y="70" class="note">只统计 dump.cs 字段声明：左边是谁的字段保存了 Entity；右边是 Entity 自己字段保存的类型。委托事件字段和基础值不画。</text>

  <rect class="lane" x="40" y="110" width="390" height="1220"/>
  <rect class="lane" x="530" y="110" width="370" height="1220"/>
  <rect class="lane" x="980" y="110" width="420" height="1220"/>
  <text x="70" y="148" class="lane-title">谁保存了这个类</text>
  <text x="70" y="172" class="note">通俗说：其他类字段里有没有它</text>
  <text x="70" y="196" class="count">统计：10 / 10 已画出</text>
  <text x="70" y="220" class="note">分析：有 10 个类字段保存 Entity</text>
  <text x="560" y="148" class="lane-title">当前类</text>
  <text x="560" y="172" class="note">分析直接写在类名下面</text>
  <text x="1010" y="148" class="lane-title">它保存了哪些类型</text>
  <text x="1010" y="172" class="note">通俗说：这个类字段里有哪些对象</text>
  <text x="1010" y="196" class="count">统计：5 / 5 已画出</text>
  <text x="1010" y="220" class="note">分析：Entity 字段直接保存 5 种非基础类型</text>

  <rect class="core" x="610" y="340" width="280" height="170"/>
  <text x="750" y="382" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1f5fbf">Entity</text>
  <text x="750" y="414" text-anchor="middle" class="desc">字段关系中心</text>
  <text x="750" y="454" text-anchor="middle" class="desc">功能：战斗实体基类</text>
  <text x="750" y="477" text-anchor="middle" class="desc">Unity：MonoBehaviour 实体组件</text>
  <text x="750" y="500" text-anchor="middle" class="desc">CF：玩家/Bot 等可受击对象的生命、阵营、受伤基础</text>

  <g transform="translate(70 235)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">Bot</text>
    <text x="18" y="49" class="desc">AI 玩家对象：自动寻路、索敌、开火的电脑角色</text>
    <text x="18" y="69" class="desc">字段依据：&lt;tryFindEnemy&gt;k__BackingField</text>
  </g>
  <g transform="translate(70 333)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">BotEnemyInfo</text>
    <text x="18" y="49" class="desc">Bot 敌人记忆：记录 AI 发现或正在攻击的目标信息</text>
    <text x="18" y="69" class="desc">字段依据：enemy</text>
  </g>
  <g transform="translate(70 431)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">Buff</text>
    <text x="18" y="49" class="desc">状态增益/减益：影响生命、速度、控制或战斗属性</text>
    <text x="18" y="69" class="desc">字段依据：&lt;owner&gt;k__BackingField</text>
  </g>
  <g transform="translate(70 529)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">DamageEventData</text>
    <text x="18" y="49" class="desc">伤害事件数据：记录攻击者、受害者、伤害类型和命中信息</text>
    <text x="18" y="69" class="desc">字段依据：attacker / victim</text>
  </g>
  <g transform="translate(70 627)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">DeathEventData</text>
    <text x="18" y="49" class="desc">死亡事件数据：记录击杀者、死亡者、爆头和特殊击杀信息</text>
    <text x="18" y="69" class="desc">字段依据：killer / dead</text>
  </g>
  <g transform="translate(70 725)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">GameManager</text>
    <text x="18" y="49" class="desc">对局总管理器：统一协调玩家、实体、模式、武器和回合</text>
    <text x="18" y="69" class="desc">字段依据：entityBL_Alive / entityGR_Alive</text>
  </g>
  <g transform="translate(70 823)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">HUD_RadarIcon_Alive</text>
    <text x="18" y="49" class="desc">雷达存活图标：小地图上显示活着的玩家/实体</text>
    <text x="18" y="69" class="desc">字段依据：entity</text>
  </g>
  <g transform="translate(70 921)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">HUD_RadarIcon_Entity</text>
    <text x="18" y="49" class="desc">雷达实体图标：小地图上显示普通实体位置</text>
    <text x="18" y="69" class="desc">字段依据：entity</text>
  </g>
  <g transform="translate(70 1019)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">HUD_RadarIcon_HearBeat</text>
    <text x="18" y="49" class="desc">心跳雷达图标：显示被心跳雷达探测到的目标</text>
    <text x="18" y="69" class="desc">字段依据：entity</text>
  </g>
  <g transform="translate(70 1117)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">WPN_Missile</text>
    <text x="18" y="49" class="desc">导弹类武器：爆炸、飞行和范围伤害对象</text>
    <text x="18" y="69" class="desc">字段依据：owner</text>
  </g>

  <g transform="translate(1020 235)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Animator</text>
    <text x="18" y="49" class="desc">Unity 动画状态机：控制角色动作切换</text>
    <text x="18" y="69" class="desc">字段依据：&lt;characterAnimator&gt;k__BackingField</text>
  </g>
  <g transform="translate(1020 333)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Buff</text>
    <text x="18" y="49" class="desc">状态增益/减益：影响生命、速度、控制或战斗属性</text>
    <text x="18" y="69" class="desc">字段依据：buffs</text>
  </g>
  <g transform="translate(1020 431)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">CharacterController</text>
    <text x="18" y="49" class="desc">Unity 角色控制器：处理碰撞、移动和胶囊体控制</text>
    <text x="18" y="69" class="desc">字段依据：&lt;characterController&gt;k__BackingField</text>
  </g>
  <g transform="translate(1020 529)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">HealthData</text>
    <text x="18" y="49" class="desc">生命数据：保存血量、护甲或受伤相关状态</text>
    <text x="18" y="69" class="desc">字段依据：&lt;healthData&gt;k__BackingField</text>
  </g>
  <g transform="translate(1020 627)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Team</text>
    <text x="18" y="49" class="desc">队伍/阵营枚举：区分 BL、GR、观战或中立阵营</text>
    <text x="18" y="69" class="desc">字段依据：&lt;team&gt;k__BackingField</text>
  </g>
<path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 274 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 372 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 470 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 568 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 666 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 764 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 862 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 960 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 1058 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 1156 H575 V430 H660"/>
<path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V274 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V372 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V470 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V568 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V666 H1020"/>
</svg>
</div>
</body>
</html>
