<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CharacterModel 字段关系图</title>
  <style>
    :root{--bg:#f3f5f8;--ink:#1f2633;--muted:#5f6878;--line:#cfd7e4;--core:#1f5fbf;--source:#315f9f;--target:#24724c}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;color:var(--ink)}
    .canvas{width:100%;min-height:100vh;padding:12px}svg{display:block;width:100%;min-width:1180px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
    .title{font-size:25px;font-weight:700;fill:var(--ink)}.note{font-size:13px;fill:var(--muted)}.lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;rx:12}
    .core{fill:#eef5ff;stroke:var(--core);stroke-width:3;rx:12}.box,.source,.target,.empty{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.source{fill:#f2f7ff}.target{fill:#f1fbf5}.empty{fill:#f8fafc}
    .name{font-size:15px;font-weight:700;fill:#1f2633}.desc{font-size:12px;fill:var(--muted)}.count{font-size:14px;font-weight:700;fill:#1f7a4d}.lane-title{font-size:17px;font-weight:700;fill:#2d3748}
    .edge{fill:none;stroke-width:2.7}.source-edge{stroke:var(--source)}.target-edge{stroke:var(--target)}.label{font-size:12px;fill:#344054}.label-bg{fill:#fff;stroke:#edf0f5;rx:5}
  </style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1450 1674" role="img" aria-label="CharacterModel field relationship graph">
  <defs>
    <marker id="arrowSource" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#315f9f"/></marker>
    <marker id="arrowTarget" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#24724c"/></marker>
  </defs>
  <text x="36" y="44" class="title">CharacterModel 字段关系图</text>
  <text x="36" y="70" class="note">只统计 dump.cs 字段声明：左边是谁的字段保存了 CharacterModel；右边是 CharacterModel 自己字段保存的类型。委托事件字段和基础值不画。</text>

  <rect class="lane" x="40" y="110" width="390" height="1514"/>
  <rect class="lane" x="530" y="110" width="370" height="1514"/>
  <rect class="lane" x="980" y="110" width="420" height="1514"/>
  <text x="70" y="148" class="lane-title">谁保存了这个类</text>
  <text x="70" y="172" class="note">通俗说：其他类字段里有没有它</text>
  <text x="70" y="196" class="count">统计：2 / 2 已画出</text>
  <text x="70" y="220" class="note">分析：有 2 个类字段保存 CharacterModel</text>
  <text x="560" y="148" class="lane-title">当前类</text>
  <text x="560" y="172" class="note">分析直接写在类名下面</text>
  <text x="1010" y="148" class="lane-title">它保存了哪些类型</text>
  <text x="1010" y="172" class="note">通俗说：这个类字段里有哪些对象</text>
  <text x="1010" y="196" class="count">统计：13 / 13 已画出</text>
  <text x="1010" y="220" class="note">分析：CharacterModel 字段直接保存 13 种非基础类型</text>

  <rect class="core" x="610" y="340" width="280" height="170"/>
  <text x="750" y="382" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1f5fbf">CharacterModel</text>
  <text x="750" y="414" text-anchor="middle" class="desc">字段关系中心</text>
  <text x="750" y="454" text-anchor="middle" class="desc">功能：角色模型表现</text>
  <text x="750" y="477" text-anchor="middle" class="desc">Unity：模型组件</text>
  <text x="750" y="500" text-anchor="middle" class="desc">CF：管理角色身体、动画、材质和武器挂点表现</text>

  <g transform="translate(70 235)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">Player</text>
    <text x="18" y="49" class="desc">玩家对象：本机/敌我玩家的战斗状态主体</text>
    <text x="18" y="69" class="desc">字段依据：&lt;currentCharacter&gt;k__BackingField / characters</text>
  </g>
  <g transform="translate(70 333)">
    <rect class="source" width="330" height="78"/>
    <text x="18" y="27" class="name">TerminatorMoveSnd</text>
    <text x="18" y="49" class="desc">终结者移动声音：纳米模式重型角色脚步/移动音效</text>
    <text x="18" y="69" class="desc">字段依据：mdl</text>
  </g>

  <g transform="translate(1020 235)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Animator</text>
    <text x="18" y="49" class="desc">Unity 动画状态机：控制角色动作切换</text>
    <text x="18" y="69" class="desc">字段依据：characterAnimator / handAnimator</text>
  </g>
  <g transform="translate(1020 333)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">AudioClip</text>
    <text x="18" y="49" class="desc">Unity 音频资源：角色语音、脚步或武器音效素材</text>
    <text x="18" y="69" class="desc">字段依据：dieVoice</text>
  </g>
  <g transform="translate(1020 431)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">CharWpnAnimData</text>
    <text x="18" y="49" class="desc">角色持枪动画数据：不同武器对应的动作配置</text>
    <text x="18" y="69" class="desc">字段依据：animSetting</text>
  </g>
  <g transform="translate(1020 529)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">CharacterEffect</text>
    <text x="18" y="49" class="desc">角色特效组件：控制角色身上的光效、受击或技能表现</text>
    <text x="18" y="69" class="desc">字段依据：characterEffect</text>
  </g>
  <g transform="translate(1020 627)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">CharacterModel.MoveDirection</text>
    <text x="18" y="49" class="desc">角色移动方向枚举：给走、跑、死亡倒地方向选择对应动画</text>
    <text x="18" y="69" class="desc">字段依据：deathDir / lastMovDir</text>
  </g>
  <g transform="translate(1020 725)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">CharacterModel.Sex</text>
    <text x="18" y="49" class="desc">角色性别枚举：区分男/女角色，用于语音、模型和受击/恢复特效表现</text>
    <text x="18" y="69" class="desc">字段依据：sex</text>
  </g>
  <g transform="translate(1020 823)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">CharacterVoice</text>
    <text x="18" y="49" class="desc">角色语音配置：管理角色语音、呼喊或受击声音</text>
    <text x="18" y="69" class="desc">字段依据：voiceAsset</text>
  </g>
  <g transform="translate(1020 921)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">HUD_RoleAsset</text>
    <text x="18" y="49" class="desc">角色 HUD 资源：角色头像、身份标识或界面素材</text>
    <text x="18" y="69" class="desc">字段依据：roleAsset</text>
  </g>
  <g transform="translate(1020 1019)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Helmet</text>
    <text x="18" y="49" class="desc">头盔/头部装备表现：角色头部模型或防具组件</text>
    <text x="18" y="69" class="desc">字段依据：&lt;helmet&gt;k__BackingField</text>
  </g>
  <g transform="translate(1020 1117)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">ParticleSystem</text>
    <text x="18" y="49" class="desc">Unity 粒子系统：烟雾、火花、爆炸等特效</text>
    <text x="18" y="69" class="desc">字段依据：aliveEffect</text>
  </g>
  <g transform="translate(1020 1215)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">QVModel</text>
    <text x="18" y="49" class="desc">第一人称手臂/武器模型：玩家自己视角的模型表现</text>
    <text x="18" y="69" class="desc">字段依据：&lt;bindQvMdl&gt;k__BackingField</text>
  </g>
  <g transform="translate(1020 1313)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Renderer</text>
    <text x="18" y="49" class="desc">Unity 渲染器：控制模型材质和可见性</text>
    <text x="18" y="69" class="desc">字段依据：cvRenderers</text>
  </g>
  <g transform="translate(1020 1411)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Transform</text>
    <text x="18" y="49" class="desc">Unity 变换组件：位置、旋转、层级挂点</text>
    <text x="18" y="69" class="desc">字段依据：spine / spine1 / neck / hitboxes</text>
  </g>
<path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 274 H575 V430 H660"/><path class="edge source-edge" marker-end="url(#arrowSource)" d="M400 372 H575 V430 H660"/>
<path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V274 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V372 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V470 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V568 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V666 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V764 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V862 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V960 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V1058 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V1156 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V1254 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V1352 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V1450 H1020"/>
</svg>
</div>
</body>
</html>
