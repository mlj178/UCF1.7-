<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameManager 字段关系图</title>
  <style>
    :root{--bg:#f3f5f8;--ink:#1f2633;--muted:#5f6878;--line:#cfd7e4;--core:#1f5fbf;--source:#315f9f;--target:#24724c}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;color:var(--ink)}
    .canvas{width:100%;min-height:100vh;padding:12px}svg{display:block;width:100%;min-width:1180px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
    .title{font-size:25px;font-weight:700;fill:var(--ink)}.note{font-size:13px;fill:var(--muted)}.lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;rx:12}
    .core{fill:#eef5ff;stroke:var(--core);stroke-width:3;rx:12}.box,.source,.target,.empty{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.source{fill:#f2f7ff}.target{fill:#f1fbf5}.empty{fill:#f8fafc}
    .name{font-size:15px;font-weight:700;fill:#1f2633}.desc{font-size:12px;fill:var(--muted)}.count{font-size:14px;font-weight:700;fill:#1f7a4d}.lane-title{font-size:17px;font-weight:700;fill:#2d3748}
    .edge{fill:none;stroke-width:2.7}.source-edge{stroke:var(--source)}.target-edge{stroke:var(--target)}.label{font-size:12px;fill:#344054}.label-bg{fill:#fff;stroke:#edf0f5;rx:5}
  </style>
</head>
<body>
<div class="canvas">
<svg viewBox="0 0 1450 1478" role="img" aria-label="GameManager field relationship graph">
  <defs>
    <marker id="arrowSource" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#315f9f"/></marker>
    <marker id="arrowTarget" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#24724c"/></marker>
  </defs>
  <text x="36" y="44" class="title">GameManager 字段关系图</text>
  <text x="36" y="70" class="note">只统计 dump.cs 字段声明：左边是谁的字段保存了 GameManager；右边是 GameManager 自己字段保存的类型。委托事件字段和基础值不画。</text>

  <rect class="lane" x="40" y="110" width="390" height="1318"/>
  <rect class="lane" x="530" y="110" width="370" height="1318"/>
  <rect class="lane" x="980" y="110" width="420" height="1318"/>
  <text x="70" y="148" class="lane-title">谁保存了这个类</text>
  <text x="70" y="172" class="note">通俗说：其他类字段里有没有它</text>
  <text x="70" y="196" class="count">统计：0 / 0 已画出</text>
  <text x="70" y="220" class="note">分析：没有其他类字段直接保存 GameManager</text>
  <text x="560" y="148" class="lane-title">当前类</text>
  <text x="560" y="172" class="note">分析直接写在类名下面</text>
  <text x="1010" y="148" class="lane-title">它保存了哪些类型</text>
  <text x="1010" y="172" class="note">通俗说：这个类字段里有哪些对象</text>
  <text x="1010" y="196" class="count">统计：11 / 11 已画出</text>
  <text x="1010" y="220" class="note">分析：GameManager 字段直接保存 11 种非基础类型</text>

  <rect class="core" x="610" y="340" width="280" height="170"/>
  <text x="750" y="382" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#1f5fbf">GameManager</text>
  <text x="750" y="414" text-anchor="middle" class="desc">字段关系中心</text>
  <text x="750" y="454" text-anchor="middle" class="desc">功能翻译：一局战斗的总管理器</text>
  <text x="750" y="477" text-anchor="middle" class="desc">Unity：场景单例，统一持有预制体、资源和运行时列表</text>
  <text x="750" y="500" text-anchor="middle" class="desc">CF：创建/记录玩家和 Bot，区分 BL / GR 阵营</text>
  <text x="750" y="523" text-anchor="middle" class="desc">管理存活 Player / Entity，用于胜负、复活和回合判断</text>
  <text x="750" y="546" text-anchor="middle" class="desc">管理 GameMode、WeaponLimited、武器数据、角色资源和对象池</text>

  <g transform="translate(70 235)">
    <rect class="empty" width="330" height="78"/>
    <text x="18" y="27" class="name">没有发现</text>
    <text x="18" y="49" class="desc">没有其他类字段直接保存 GameManager</text>
    <text x="18" y="69" class="desc">字段依据：0 个类的字段保存 GameManager</text>
  </g>

  <g transform="translate(1020 235)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">CharacterAsset</text>
    <text x="18" y="49" class="desc">角色资源配置表：管理可用角色/模型资源</text>
    <text x="18" y="69" class="desc">字段依据：characterAsset</text>
  </g>
  <g transform="translate(1020 333)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Entity</text>
    <text x="18" y="49" class="desc">战斗实体基类：玩家/Bot 等可受击对象</text>
    <text x="18" y="69" class="desc">字段依据：entityBL_Alive / entityGR_Alive</text>
  </g>
  <g transform="translate(1020 431)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">GameMode</text>
    <text x="18" y="49" class="desc">玩法模式配置：决定当前对局类型</text>
    <text x="18" y="69" class="desc">字段依据：gameMode</text>
  </g>
  <g transform="translate(1020 529)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">GameObject</text>
    <text x="18" y="49" class="desc">Unity 场景对象/预制体：用于生成或引用场景对象</text>
    <text x="18" y="69" class="desc">字段依据：playerPrefab / botPrefab / gameModePrefab</text>
  </g>
  <g transform="translate(1020 627)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">NameKeyPool</text>
    <text x="18" y="49" class="desc">按名称索引的对象池：复用角色/武器对象</text>
    <text x="18" y="69" class="desc">字段依据：characterPool / weaponPool</text>
  </g>
  <g transform="translate(1020 725)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Player</text>
    <text x="18" y="49" class="desc">玩家对象：本机/敌我玩家的战斗状态主体</text>
    <text x="18" y="69" class="desc">字段依据：myPlayer / allPlayers / playersBL / playersBL_Alive 等 7 个字段</text>
  </g>
  <g transform="translate(1020 823)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">RecyclableObject</text>
    <text x="18" y="49" class="desc">可回收场景物：掉落物或临时对象清理</text>
    <text x="18" y="69" class="desc">字段依据：recyclableObjects</text>
  </g>
  <g transform="translate(1020 921)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">Weapon</text>
    <text x="18" y="49" class="desc">武器实例：实际可装备、发射、掉落的武器对象</text>
    <text x="18" y="69" class="desc">字段依据：WpnDictionary</text>
  </g>
  <g transform="translate(1020 1019)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">WeaponAsset</text>
    <text x="18" y="49" class="desc">武器资源配置表：提供可加载/可发放武器资源</text>
    <text x="18" y="69" class="desc">字段依据：weaponAsset</text>
  </g>
  <g transform="translate(1020 1117)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">WeaponData</text>
    <text x="18" y="49" class="desc">武器数值配置：伤害、弹药、图标等资料</text>
    <text x="18" y="69" class="desc">字段依据：WpnDataDictionary</text>
  </g>
  <g transform="translate(1020 1215)">
    <rect class="target" width="360" height="78"/>
    <text x="18" y="27" class="name">WeaponLimited</text>
    <text x="18" y="49" class="desc">武器限制规则：限制刀、手枪、狙击等可用武器</text>
    <text x="18" y="69" class="desc">字段依据：weaponLimited</text>
  </g>

<path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V274 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V372 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V470 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V568 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V666 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V764 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V862 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V960 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V1058 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V1156 H1020"/><path class="edge target-edge" marker-end="url(#arrowTarget)" d="M840 430 H940 V1254 H1020"/>
</svg>
</div>
</body>
</html>
