<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1a;
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            color: #e4e4f0;
            padding: 24px 32px;
        }

        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        /* 左侧结构树 */
        .structure-panel {
            flex: 2;
            min-width: 300px;
            background: #1e1e2a;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #2e2e3e;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        }

        .structure-header {
            background: #252536;
            padding: 16px 20px;
            border-bottom: 1px solid #3a3a4e;
        }

        .tree-view {
            padding: 12px 8px 20px 8px;
            max-height: 700px;
            overflow-y: auto;
        }

        .tree-node {
            list-style: none;
            margin-left: 0;
        }

        .tree-node li {
            list-style: none;
            margin: 4px 0;
        }

        .node-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 14px;
            background: #252532;
            cursor: pointer;
            transition: 0.2s;
            border-left: 3px solid transparent;
        }

        .node-item:hover {
            background: #32324a;
            transform: translateX(3px);
        }

        .node-item.active {
            background: #2d4b6e;
            border-left-color: #5dade2;
        }

        .node-icon {
            font-size: 1.2rem;
            width: 28px;
        }

        .node-name {
            flex: 1;
            font-weight: 500;
        }

        .node-badge {
            background: #3a3a4e;
            border-radius: 30px;
            padding: 2px 8px;
            font-size: 0.7rem;
        }

        .children-wrapper {
            margin-left: 28px;
            padding-left: 8px;
            border-left: 1px dashed #3a3a55;
        }

        /* 中间详情面板 */
        .detail-panel {
            flex: 1.8;
            min-width: 320px;
            background: #1a1a26;
            border-radius: 24px;
            border: 1px solid #2e2e42;
            display: flex;
            flex-direction: column;
        }

        .detail-header {
            background: #222232;
            padding: 16px 20px;
            border-radius: 24px 24px 0 0;
            border-bottom: 1px solid #3a3a4e;
        }

        .detail-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            line-height: 1.5;
        }

        .prop-group {
            margin-bottom: 18px;
            border-bottom: 1px solid #2a2a3a;
            padding-bottom: 12px;
        }

        .prop-title {
            font-weight: 700;
            color: #b3c7ff;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .prop-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 8px 12px;
            font-size: 0.85rem;
        }

        .prop-label {
            color: #9b9bcf;
        }

        .prop-value {
            color: #ddddf5;
            font-family: monospace;
            word-break: break-word;
        }

        /* 右侧规格面板 */
        .spec-panel {
            flex: 1.2;
            min-width: 260px;
            background: #141422;
            border-radius: 24px;
            border: 1px solid #2e2e46;
        }

        .spec-header {
            background: #20202e;
            padding: 16px 20px;
            border-radius: 24px 24px 0 0;
            border-bottom: 1px solid #3a3a50;
        }

        .spec-content {
            padding: 20px;
            overflow-y: auto;
            max-height: 700px;
            font-size: 0.85rem;
        }

        .spec-card {
            background: #1e1e2c;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .spec-card-title {
            font-weight: 700;
            color: #8fb4ff;
            margin-bottom: 6px;
        }

        .spec-line {
            font-family: monospace;
            font-size: 0.75rem;
            color: #bbb;
            margin: 4px 0;
        }

        .docs-area {
            margin-top: 30px;
            background: #15151f;
            border-radius: 28px;
            border: 1px solid #2c2c40;
            overflow: hidden;
        }

        .docs-tabs {
            display: flex;
            background: #20202c;
            border-bottom: 1px solid #2e2e44;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 500;
            color: #aaaac8;
            cursor: pointer;
            flex: 1;
            transition: 0.2s;
        }

        .tab-btn.active {
            color: #5dade2;
            border-bottom: 2px solid #5dade2;
            background: #181824;
        }

        .docs-content {
            padding: 24px 28px;
            max-height: 460px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.55;
        }

        .code-block {
            background: #0c0c14;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: monospace;
            font-size: 0.8rem;
            border-left: 3px solid #5dade2;
            margin: 12px 0;
            overflow-x: auto;
        }

        hr {
            border-color: #2a2a3a;
            margin: 16px 0;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            margin-top: 40px;
            opacity: 0.6;
        }
    </style>
</head>

</div>

<div class="docs-area">

                    { name: "滑板鞋卡片", icon: "👟", type: "基础组件" },
                    { name: "无限时间卡片", icon: "⏰", type: "基础组件" },
                    { name: "轻重力/高跳卡片", icon: "🌌", type: "基础组件" },
                    { name: "金刚不坏卡片", icon: "🛡️", type: "基础组件" }
                ] },
                { name: "其他选项卡", icon: "⚙️", type: "分支模块", children: [
                    { name: "聚怪卡片", icon: "👾", type: "基础组件" },
                    { name: "回合跳过卡片", icon: "⏭️", type: "基础组件" },
                    { name: "天机傀儡卡片", icon: "🧠", type: "基础组件" }
                ] }
            ] },
            { name: "连接按钮区 btn_frame", icon: "🔗", type: "分支模块", children: [] },
            { name: "底部提示区", icon: "📌", type: "分支模块", children: [] },
            { name: "日志区 log_area", icon: "📜", type: "分支模块", children: [] },
            { name: "设置窗口 settings_window", icon: "⚙️", type: "分支模块", children: [] },
            { name: "折叠效果", icon: "📁", type: "分支模块", children: [] }
        ]
    };

    function buildTree(node, container) {
        const li = document.createElement('li');
        const div = document.createElement('div');
        div.className = 'node-item';
        div.setAttribute('data-name', node.name);
        div.innerHTML = `
            <span class="node-icon">${node.icon || '📁'}</span>
            <span class="node-name">${node.name}</span>
            <span class="node-badge">${node.type || (node.children ? '分支' : '组件')}</span>
        `;
        li.appendChild(div);
        if (node.children && node.children.length) {
            const ul = document.createElement('ul');
            ul.className = 'children-wrapper';
            node.children.forEach(child => buildTree(child, ul));
            li.appendChild(ul);
        }
        container.appendChild(li);
    }

    const treeRoot = document.getElementById('uiTree');
    const rootUl = document.createElement('ul');
    rootUl.className = 'tree-node';
    buildTree(uiTreeData, rootUl);
    treeRoot.appendChild(rootUl);

    // 显示组件详情（含规格）
    function showComponentDetail(compName) {
        const spec = specsLibrary[compName];
        if (!spec) {
            document.getElementById('detailContent').innerHTML = `<div style="color:#aaa;">未找到组件 "${compName}" 的详细规格，请检查数据。</div>`;
            return;
        }
        let propsHtml = '';
        for (const [k, v] of Object.entries(spec.props)) {
            propsHtml += `<div class="prop-grid"><div class="prop-label">${k}</div><div class="prop-value">${v}</div></div>`;
        }
        const html = `
            <div class="prop-group">
                <div class="prop-title">📖 功能描述</div>
                <div class="prop-value">${spec.desc}</div>
            </div>
            <div class="prop-group">
                <div class="prop-title">📍 代码位置</div>
                <div class="prop-value"><code>${spec.location}</code></div>
            </div>
            <div class="prop-group">
                <div class="prop-title">⚡ 交互回调</div>
                <div class="prop-value">${spec.callback || '—'}</div>
            </div>
            <div class="prop-group">
                <div class="prop-title">📐 详细属性参数</div>
                ${propsHtml || '<div class="prop-value">无额外属性</div>'}
            </div>
        `;
        document.getElementById('detailContent').innerHTML = html;
    }

    // 右侧全局规格
    function renderGlobalSpec() {
        const globalHtml = `
            <div class="spec-card"><div class="spec-card-title">🪟 主窗口</div>
            <div class="spec-line">尺寸: 700x750 (可缩放) → 折叠后: 500x70</div>
            <div class="spec-line">透明度: 0.92 | 置顶: True</div>
            </div>
            <div class="spec-card"><div class="spec-card-title">📇 标准卡片</div>
            <div class="spec-line">背景: #3a3a3a / 悬停 #4a4a4a | 圆角6 | 边框 #555 1px</div>
            <div class="spec-line">标题字体: 15px bold | 描述框高度自适应(28~48px)</div>
            <div class="spec-line">滑块: 快刀1-10/滑板鞋1-6/重力0-1/跳跃1-5/剑气1-50</div>
            </div>
            <div class="spec-card"><div class="spec-card-title">⚙️ 设置窗口</div>
            <div class="spec-line">尺寸500x600, 不可缩放, 置顶, 模态</div>
            <div class="spec-line">音效: 开关 + 音量0-100 | 快捷键: Ctrl+0~9 | 关于: 版本/B站/赞赏码</div>
            </div>
            <div class="spec-card"><div class="spec-card-title">📜 日志区</div>
            <div class="spec-line">Consolas 11px, 高度110, 只读自动滚动</div>
            </div>
            <div class="spec-card"><div class="spec-card-title">📂 数据持久化</div>
            <div class="spec-line">data/hotkeys.json, data/settings.json</div>
            </div>
        `;
        document.getElementById('globalSpec').innerHTML = globalHtml;
    }

    // 节点点击绑定
    function bindClickEvents() {
        const items = document.querySelectorAll('.node-item');
        items.forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                items.forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                const nameElem = item.querySelector('.node-name');
                if (nameElem) showComponentDetail(nameElem.innerText.trim());
            });
        });
    }

    // 下方文档切换
    function setupDocsTabs() {
        const implHtml = `
            <h4>✅ v1.4 UI 具体实施方案</h4>
            <p><strong>整体框架</strong>：主窗口 CTk 700x750，alpha 0.92。折叠时将非状态栏区域 pack_forget，窗口改为500x70，展开时恢复原几何。</p>
            <p><strong>卡片系统</strong>：make_feature_card 统一生成圆角卡片，支持悬停高亮、点击卡片区域触发开关。滑块使用 CTkSlider 并绑定 trace 更新标签。</p>
            <p><strong>分类选项卡</strong>：CTkTabview + CTkScrollableFrame，2列等宽网格。每个卡片独立管理状态。</p>
            <p><strong>设置窗口</strong>：独立 Toplevel，三选项卡：音效(开关+音量滑块)、快捷键(Ctrl+数字下拉绑定)、关于(版本/B站/赞赏码)。</p>
            <p><strong>日志系统</strong>：CTkTextbox 只读，_log 方法统一输出并自动滚动。</p>
            <hr>
            <h4>📊 关键数值汇总</h4>
            <ul><li>主窗口: 700x750 / 折叠 500x70</li><li>卡片圆角6, 边框1px #555, 内边距8px</li><li>滑块步长: 快刀90步, 滑板鞋50步, 重力10步, 跳跃8步</li><li>日志高度110, 字体 Consolas 11</li><li>设置窗口 500x600, 赞赏码图片 225x225</li></ul>
        `;
        const guideHtml = `
            <h4>🧩 后续添加功能：保持风格一致性与可维护性</h4>
            <div class="code-block">
                /* 扩展规范 */<br>
                1. 新增功能优先使用 make_feature_card，传入 icon/name/desc/滑块参数等。<br>
                2. 复杂布局参照轻重力卡片，保留边框圆角悬停及点击切换主功能。<br>
                3. 所有开关调用 _toggle_feature，滑块回调需发送配置到 Frida。<br>
                4. 快捷键：只需在 _hotkeys 中添加映射，_setup_hotkeys 自动绑定。<br>
                5. 音效：开关/快捷键触发时调用 _play_sound()。<br>
                6. 数据持久化：沿用 data/ 目录 JSON 存储扩展配置。<br>
                7. JS 模块需实现 enable/disable 并注册到 modules 对象。<br>
                8. 折叠行为扩展：新增区域需在 _toggle_collapse 中添加 pack_forget/pack 逻辑。<br>
            </div>
            <p><strong>视觉一致性</strong>：所有卡片背景使用深色系(#3a3a3a)，重要功能深红/深绿；标题色按类别区分（武器暖色、人物冷色、其他中性）。</p>
        `;
        const docDiv = document.getElementById('docsContent');
        docDiv.innerHTML = implHtml;
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                docDiv.innerHTML = btn.getAttribute('data-tab') === 'impl' ? implHtml : guideHtml;
            });
        });
    }

    window.onload = () => {
        renderGlobalSpec();
        bindClickEvents();
        setupDocsTabs();
        // 默认高亮并展示主窗口详情
        const firstNode = document.querySelector('.node-item');
        if (firstNode) {
            firstNode.classList.add('active');
            const firstName = firstNode.querySelector('.node-name').innerText.trim();
            showComponentDetail(firstName);
        }
    };
</script>
</body>
</html>
